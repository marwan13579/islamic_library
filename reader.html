<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القارئ · المكتبة الإسلامية</title>
<meta name="description" content="قارئ واحد للفتاوى والخطب والتاريخ والتفسير وحصن المسلم، يبني العنصر من ملفه وحده.">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<link rel="stylesheet" href="library.css">
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0; --green:#2F6B4F;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28; --green:#5FA787;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28; --green:#5FA787;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  .rhead{padding:26px 16px 14px;border-bottom:1px solid var(--line);text-align:center}
  .rhead h1{font-family:"Amiri",serif;font-size:clamp(1.6rem,6vw,2.3rem);margin:0}
  .rhead .sub{color:var(--ink-soft);font-size:.8rem;margin:.3rem 0 0}

  .qbox{background:var(--card);border:1px solid var(--gold-soft);border-radius:14px;padding:16px;margin:16px 0}
  .qbox .q{font-family:"Amiri",serif;font-size:1.15rem;line-height:2;margin:0 0 12px}
  .body{font-family:"Amiri",serif;font-size:1.1rem;line-height:2.15;text-align:justify}
  .body p{margin:0 0 1em}
  .body h3{font-family:"Cairo",sans-serif;font-size:.95rem;color:var(--gold);margin:1.4em 0 .5em}
  .ayah{font-family:"Amiri",serif;font-size:1.25rem;line-height:2.3;color:var(--green);
    border-inline-start:3px solid var(--gold-soft);padding-inline-start:14px;margin:0 0 12px}
  .ansbtn{font-family:"Cairo";font-weight:600;font-size:.82rem;background:var(--gold);border:0;color:#2b1e05;
    padding:9px 18px;border-radius:999px;cursor:pointer}
  .opt{display:block;width:100%;text-align:start;font-family:"Cairo";font-size:.9rem;background:var(--paper-2);
    border:1px solid var(--line);color:var(--ink);padding:11px 14px;border-radius:12px;margin:8px 0;cursor:pointer}
  .opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
  .opt.no{background:#7a2f2f;color:#fff;border-color:#7a2f2f}
  .opts[hidden]{display:none}

  .audio{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.82rem;color:var(--ink-soft)}
  .audio audio{flex:1;height:38px}
  .navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
  .navrow a,.navrow button{font-family:"Cairo";font-weight:600;font-size:.82rem;background:var(--paper-2);
    border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;
    cursor:pointer;text-decoration:none;display:inline-block}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="rhead">
  <h1 id="rTitle">جارٍ التحميل…</h1>
  <p class="sub" id="rSub"></p>
</div>

<main class="wrap" id="main"><p class="lib-state">جارٍ التحميل…</p></main>

<script type="module">
  import { escapeHtml, toArNum } from "./src/lib/text.js";
  import { readItem, browse, isBookmarked, toggleBookmark } from "./src/lib/library.js";
  import { renderBody, param } from "./src/lib/content-ui.js";

  const main = document.getElementById("main");
  const titleEl = document.getElementById("rTitle");
  const subEl = document.getElementById("rSub");

  const TITLES = {
    fatwa: "الفتاوى",
    khutbahs: "الخطب",
    history: "التاريخ الإسلامي",
    quiz: "اختبار",
    tafsir: "التفسير الميسر",
    hisn: "حصن المسلم",
  };

  /** روابط المصدر في أسفل العنصر. */
  function refs(item) {
    if (!item.refs || !item.refs.length) return "";
    const rows = item.refs
      .map((ref) => `<a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(ref.label)} ↗</a>`)
      .join("");
    return `<div class="lib-refs"><strong>المصادر</strong>${rows}</div>`;
  }

  /** مشغّل صوت لباب من حصن المسلم. */
  function audio(url) {
    if (!url) return "";
    return (
      `<div class="audio"><span>صوت الباب</span>` +
      `<audio controls preload="none" src="${escapeHtml(url)}"></audio>` +
      `<a href="${escapeHtml(url)}" download>تنزيل</a></div>`
    );
  }

  /** عرض سؤال اختبار مع إخفاء الإجابة. */
  function quizBlock(item) {
    const data = item.quiz || {};
    const answers = data.answers || [];
    if (!answers.length) return `<p>${escapeHtml(item.content || "")}</p>`;
    const opts = answers
      .map(
        (a) =>
          `<button type="button" class="opt" data-ok="${a.correct ? "1" : "0"}">${escapeHtml(a.text)}</button>`
      )
      .join("");
    return (
      `<p>${escapeHtml(item.content || item.title)}</p>` +
      `<button type="button" class="ansbtn" id="showAns">أظهر الإجابة</button>` +
      `<div class="opts" id="opts" hidden>${opts}</div>`
    );
  }

  const type = param("type", "fatwa");
  const id = param("id", "");

  if (!id) {
    titleEl.textContent = "لا يوجد عنصر";
    main.innerHTML = `<p class="lib-empty">اختر عنصرًا من المكتبة.</p>`;
  } else {
    const item = await readItem(type, id);
    if (!item) {
      titleEl.textContent = "لم يُعثر على العنصر";
      main.innerHTML = `<p class="lib-empty">ربما حُذف أو تغيّر مساره.</p>`;
    } else {
      const kind = TITLES[type] || "المكتبة";
      titleEl.textContent = item.title || kind;
      document.title = `${item.title || kind} · المكتبة الإسلامية`;

      const meta = [];
      if (item.author) meta.push(item.author);
      if (item.dateText || item.dateIso) meta.push(item.dateText || item.dateIso);
      if (item.surahName) meta.push(`سورة ${item.surahName}`);
      if (item.ayah) meta.push(`الآية ${toArNum(item.ayah)}`);
      if (item.categories && item.categories.length) meta.push(item.categories.join(" · "));
      subEl.textContent = meta.join(" — ");

      let body = "";
      if (type === "tafsir") {
        body =
          `<p class="ayah">${escapeHtml(item.text)}</p>` +
          renderBody(String(item.content).replace(/\[\d+\]\s*/g, "")) +
          `<p class="lib-state">الجزء ${toArNum(item.page)}</p>`;
      } else if (type === "hisn") {
        body =
          audio(item.audio) +
          (item.items || [])
            .map((row, i) => `<h3>${toArNum(i + 1)}</h3>${renderBody(row.t)}`)
            .join("");
      } else if (type === "quiz") {
        body = quizBlock(item) + refs(item);
      } else {
        body = renderBody(item.content) + refs(item);
      }

      main.innerHTML = `<div class="body">${body}</div>`;

      const show = document.getElementById("showAns");
      if (show) {
        show.addEventListener("click", () => {
          const box = document.getElementById("opts");
          box.hidden = false;
          show.remove();
          for (const opt of box.children) {
            opt.disabled = true;
            if (opt.dataset.ok === "1") opt.classList.add("ok");
          }
        });
      }

      /* شريط سفلي: المفضّلة، ثم جيرانه في المجموعة نفسها. */
      const nav = document.createElement("div");
      nav.className = "navrow";
      const saved = isBookmarked(id);
      const mark = document.createElement("button");
      mark.type = "button";
      mark.textContent = saved ? "محفوظ ✓" : "حفظ في المفضّلة";
      mark.addEventListener("click", () => {
        const now = toggleBookmark(id);
        mark.textContent = now ? "محفوظ ✓" : "حفظ في المفضّلة";
      });
      nav.appendChild(mark);

      if (type === "tafsir" || type === "hisn") {
        const step = type === "tafsir" ? item.surah : item.bab;
        const last = type === "tafsir" ? 114 : 132;
        const link = (n, label) => {
          const a = document.createElement("a");
          a.href = `${location.pathname.split("/").pop()}?type=${type}&id=${type}-${n}`;
          a.textContent = label;
          return a;
        };
        if (step > 1) nav.appendChild(link(step - 1, "‹ السابق"));
        if (step < last) nav.appendChild(link(step + 1, "التالي ›"));
      } else {
        const chunk = await browse(type, { page: 1, perPage: 5 });
        const at = chunk.items.findIndex((row) => row.id === id);
        if (at > 0) {
          const prev = document.createElement("a");
          prev.href = `${location.pathname.split("/").pop()}?type=${type}&id=${encodeURIComponent(chunk.items[at - 1].id)}`;
          prev.textContent = "‹ السابق";
          nav.appendChild(prev);
        }
        if (at >= 0 && at < chunk.items.length - 1) {
          const next = document.createElement("a");
          next.href = `${location.pathname.split("/").pop()}?type=${type}&id=${encodeURIComponent(chunk.items[at + 1].id)}`;
          next.textContent = "التالي ›";
          nav.appendChild(next);
        }
      }
      main.appendChild(nav);
    }
  }
</script>

</body>
</html>
