<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    --warn:#8A5A1E; --warn-bg:#F3E1C4;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
    --warn:#E3B366; --warn-bg:#2B2210;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
    --warn:#E3B366; --warn-bg:#2B2210;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(2rem,7vw,2.8rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:42ch;margin:.4rem auto 0}

  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.88rem;background:none;border:0;color:var(--ink-soft);
    padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  section[hidden]{display:none}

  nav.subtabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
  nav.subtabs::-webkit-scrollbar{display:none}
  .subtab{font-family:"Cairo";font-weight:600;font-size:.78rem;background:var(--paper-2);border:1px solid var(--line);
    color:var(--ink-soft);padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .subtab[aria-pressed="true"]{background:var(--gold);color:#2b1e05;border-color:var(--gold)}
  .subpanel[hidden]{display:none}

  .intro{font-size:.88rem;color:var(--ink-soft);margin:4px 0 14px}

  details.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  details.item>summary{padding:12px 14px;cursor:pointer;list-style:none;font-weight:700;font-size:.92rem;
    display:flex;align-items:center;gap:8px}
  details.item>summary::-webkit-details-marker{display:none}
  details.item>summary::before{content:"◂";color:var(--gold);transition:transform .15s ease;font-size:.75rem}
  details.item[open]>summary::before{transform:rotate(-90deg)}
  .idesc{padding:0 14px 14px;font-size:.87rem;color:var(--ink-soft)}
  .idesc ul{margin:6px 0 0;padding-inline-start:20px}
  .idesc li{margin-bottom:4px}

  .simplelist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .srow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.88rem}
  .srow b{color:var(--gold)}

  .linkcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold-soft);
    border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);margin:12px 0}
  .linkcard .em{font-size:1.5rem}
  .linkcard .t{font-weight:700;font-size:.92rem}
  .linkcard .d{font-size:.78rem;color:var(--ink-soft)}

  .warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:14px 16px;margin:16px 0;font-size:.85rem;color:var(--warn)}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>

<div class="wrap">
<header>
  <h1>العبادات</h1>
  <p>دليل تعليمي مبسّط للصلاة والصيام والزكاة — أركانها وفرائضها وسننها وأحكامها الأساسية.</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ</footer>

<script>
function accordion(items){
  const wrap=document.createElement("div");
  items.forEach(([title,points])=>{
    const det=document.createElement("details");
    det.className="item";
    const list = Array.isArray(points) ?
      '<ul>'+points.map(p=>'<li>'+p+'</li>').join('')+'</ul>' :
      '<p style="margin:0">'+points+'</p>';
    det.innerHTML='<summary>'+title+'</summary><div class="idesc">'+list+'</div>';
    wrap.appendChild(det);
  });
  return wrap;
}
function introP(text){
  const p=document.createElement("p");
  p.className="intro"; p.textContent=text;
  return p;
}
function linkCard(emoji,title,desc,href){
  const a=document.createElement("a");
  a.className="linkcard"; a.href=href;
  a.innerHTML='<span class="em">'+emoji+'</span><span><span class="t">'+title+'</span><br><span class="d">'+desc+'</span></span>';
  return a;
}
function warnBox(text){
  const d=document.createElement("div");
  d.className="warnbox"; d.textContent=text;
  return d;
}

/* ===================== الصلاة ===================== */
function buildSalah(){
  const frag=document.createElement("div");
  const sub=document.createElement("nav"); sub.className="subtabs";
  const panels={};
  const SUBS=[
    ["wudu","الوضوء"],
    ["fara","فرائض الصلاة"],
    ["sunan","سنن الصلاة"],
    ["sifa","صفة الصلاة"],
    ["sahw","سجود السهو"]
  ];
  SUBS.forEach(([id,label],i)=>{
    const b=document.createElement("button");
    b.className="subtab"; b.type="button"; b.textContent=label;
    b.setAttribute("aria-pressed", i===0?"true":"false");
    b.addEventListener("click",()=>selectSub(id));
    sub.appendChild(b);
  });
  frag.appendChild(sub);

  const p1=document.createElement("div"); p1.className="subpanel";
  p1.appendChild(introP("الوضوء شرط لصحة الصلاة، وله أركان لا تصح بدونها، وسنن تكمّله وتزيد أجره."));
  p1.appendChild(accordion([
    ["أركان الوضوء (لا يصح بدونها)",[
      "النية: عزم القلب على رفع الحدث، محلها القلب ولا تُشترط بالتلفظ.",
      "غسل الوجه كاملًا: من منبت شعر الرأس إلى الذقن، ومن الأذن إلى الأذن.",
      "غسل اليدين مع المرفقين.",
      "مسح الرأس كله أو بعضه (على خلاف بين العلماء في القدر المجزئ، والأحوط مسح الكل).",
      "غسل الرجلين مع الكعبين.",
      "الترتيب بين هذه الأعضاء كما وردت.",
      "الموالاة: ألا يفصل بين الأعضاء فصلًا يُجفّف ما قبله في العادة."
    ]],
    ["سنن الوضوء",[
      "التسمية في أوله.",
      "غسل الكفين ثلاثًا قبل البدء.",
      "المضمضة والاستنشاق والاستنثار.",
      "تخليل الأصابع واللحية الكثة.",
      "البدء باليمين قبل اليسار في اليدين والرجلين.",
      "التثليث (تكرار الغسل ثلاث مرات) في الأعضاء المغسولة.",
      "مسح الأذنين مع الرأس.",
      "الدعاء بعد الفراغ منه."
    ]],
    ["نواقض الوضوء (أشهرها)",[
      "الخارج من السبيلين (بول، غائط، ريح).",
      "النوم المستغرق الذي يُزيل الشعور.",
      "زوال العقل (إغماء، جنون، سُكر).",
      "لمس الفرج بلا حائل عند بعض العلماء.",
      "أكل لحم الإبل عند بعض العلماء."
    ]]
  ]));
  panels["wudu"]=p1;

  const p2=document.createElement("div"); p2.className="subpanel"; p2.hidden=true;
  p2.appendChild(introP("فرائض الصلاة (أركانها) لا تصح الصلاة بدونها، ولا يجبرها سجود السهو إن تُركت عمدًا."));
  p2.appendChild(accordion([
    ["القيام مع القدرة","في الفرض، ويسقط عن العاجز فيصلي جالسًا أو على جنب حسب استطاعته."],
    ["تكبيرة الإحرام","قول: الله أكبر، وبها يدخل المصلي في الصلاة."],
    ["قراءة الفاتحة","في كل ركعة، ولا تصح الركعة بدونها للإمام والمنفرد."],
    ["الركوع والطمأنينة فيه","الانحناء حتى تستقر الأعضاء، لا مجرد الانحناء السريع."],
    ["الرفع من الركوع والاعتدال قائمًا","مع الطمأنينة."],
    ["السجود على الأعضاء السبعة والطمأنينة فيه","الجبهة مع الأنف، الكفان، الركبتان، أطراف القدمين."],
    ["الجلوس بين السجدتين والطمأنينة فيه",""],
    ["التشهد الأخير وجلسته","قراءة التحيات في الجلسة الأخيرة قبل السلام."],
    ["الصلاة على النبي ﷺ في التشهد الأخير",""],
    ["الترتيب بين الأركان",""],
    ["التسليم","الخروج من الصلاة بقول السلام عليكم."]
  ]));
  panels["fara"]=p2;

  const p3=document.createElement("div"); p3.className="subpanel"; p3.hidden=true;
  p3.appendChild(introP("سنن الصلاة تزيد كمالها وأجرها، ومن تركها سهوًا فصلاته صحيحة، وبعضها يُجبر بسجود السهو."));
  p3.appendChild(accordion([
    ["سنن قولية",[
      "دعاء الاستفتاح بعد تكبيرة الإحرام.",
      "الاستعاذة قبل القراءة، والبسملة سرًا.",
      "التأمين بعد الفاتحة.",
      "قراءة سورة أو آيات بعد الفاتحة في الركعتين الأوليين.",
      "الجهر في الفجر والأوليين من المغرب والعشاء، والإسرار فيما عداها.",
      "التسبيح في الركوع والسجود أكثر من المرة الواحدة.",
      "قول 'ربنا ولك الحمد' بعد 'سمع الله لمن حمده'.",
      "الدعاء بين السجدتين وبعد التشهد قبل السلام."
    ]],
    ["سنن فعلية",[
      "رفع اليدين عند تكبيرة الإحرام وعند الركوع والرفع منه.",
      "وضع اليد اليمنى على اليسرى فوق الصدر.",
      "النظر إلى موضع السجود.",
      "التجافي في السجود (عدم إلصاق البطن بالفخذين).",
      "جلسة الاستراحة بعد الرفع من السجدة الثانية قبل القيام للركعة التالية.",
      "الإشارة بالسبابة عند الشهادة في التشهد."
    ]]
  ]));
  panels["sunan"]=p3;

  const p4=document.createElement("div"); p4.className="subpanel"; p4.hidden=true;
  p4.appendChild(introP("هذا ملخص سريع لترتيب الصلاة؛ للتفصيل الكامل خطوة بخطوة مع الأذكار المنطوقة، افتح أداة «تعلّم الصلاة» في المكتبة."));
  p4.appendChild(accordion([
    ["الترتيب العام",[
      "استقبال القبلة والنية، ثم تكبيرة الإحرام.",
      "دعاء الاستفتاح، ثم الفاتحة وسورة (في الأوليين).",
      "الركوع، ثم الرفع منه، ثم السجدتان مع جلسة بينهما.",
      "تكرار ذلك حسب عدد الركعات، مع الجلوس للتشهد الأول بعد الركعة الثانية إن كانت الصلاة أكثر من ركعتين.",
      "التشهد الأخير والصلاة الإبراهيمية، ثم التسليم."
    ]]
  ]));
  const linkA = linkCard("🕋","تعلّم الصلاة بالتفصيل","خطوة بخطوة مع كل الأذكار المنطوقة، مناسب للأطفال وحديثي الإسلام","4-salah.html");
  p4.appendChild(linkA);
  panels["sifa"]=p4;

  const p5=document.createElement("div"); p5.className="subpanel"; p5.hidden=true;
  p5.appendChild(introP("سجود السهو: سجدتان يُجبر بهما نقص أو زيادة أو شك يقع في الصلاة سهوًا لا عمدًا."));
  p5.appendChild(accordion([
    ["حالات الزيادة","إن زاد المصلي ركوعًا أو سجودًا أو قيامًا سهوًا، سجد للسهو بعد السلام."],
    ["حالات النقص","إن ترك واجبًا من واجبات الصلاة سهوًا (كالتشهد الأول)، جبره بسجود السهو، والغالب أنه يكون قبل السلام."],
    ["حالة الشك","إن شك في عدد الركعات ولم يترجّح عنده شيء، بنى على اليقين (الأقل) وأتم، ثم سجد للسهو قبل السلام."],
    ["كيفية سجود السهو","سجدتان كسجود الصلاة العادي، يُكبّر لهما، ثم يتشهد ويسلم إن كانتا بعد السلام."]
  ]));
  const noteP = document.createElement("p");
  noteP.className="intro";
  noteP.textContent="هذه قواعد عامة متفق على أصلها؛ تفاصيل الحالات الدقيقة قد تختلف بين المذاهب الفقهية، فارجع لأهل العلم عند التطبيق العملي.";
  p5.appendChild(noteP);
  panels["sahw"]=p5;

  [p1,p2,p3,p4,p5].forEach(p=>frag.appendChild(p));

  function selectSub(id){
    Object.keys(panels).forEach((k,i)=>{
      panels[k].hidden = k!==id;
      sub.children[i].setAttribute("aria-pressed", k===id?"true":"false");
    });
  }
  return frag;
}

/* ===================== الصيام ===================== */
function buildSawm(){
  const frag=document.createElement("div");
  const sub=document.createElement("nav"); sub.className="subtabs";
  const panels={};
  const SUBS=[["ahkam","أحكام الصيام"],["mufsidat","المفطرات"],["tatawwu","صيام التطوع"],["ramadan","رمضان"]];
  SUBS.forEach(([id,label],i)=>{
    const b=document.createElement("button");
    b.className="subtab"; b.type="button"; b.textContent=label;
    b.setAttribute("aria-pressed", i===0?"true":"false");
    b.addEventListener("click",()=>selectSub(id));
    sub.appendChild(b);
  });
  frag.appendChild(sub);

  const p1=document.createElement("div"); p1.className="subpanel";
  p1.appendChild(introP("الصيام: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس بنية التعبد لله."));
  p1.appendChild(accordion([
    ["شروط وجوب الصيام",["الإسلام","البلوغ","العقل","القدرة على الصيام","الإقامة (غير مسافر)","خلو المرأة من الحيض والنفاس وقت الوجوب"]],
    ["أركان الصيام",["النية: تُبيَّت من الليل في الفرض قبل الفجر.","الإمساك عن المفطرات طوال النهار الشرعي (من الفجر إلى المغرب)."]],
    ["رخص الإفطار",["المريض الذي يشق عليه الصيام أو يضره.","المسافر سفرًا يُبيح القصر.","الحامل والمرضع إن خافتا على نفسيهما أو ولديهما.","كبير السن العاجز عن الصيام أصلًا.","لكل حالة حكمها الخاص من قضاء أو فدية، فراجع أداة «متابعة صيام القضاء» وعالمًا موثوقًا لحالتك."]]
  ]));
  panels["ahkam"]=p1;

  const p2=document.createElement("div"); p2.className="subpanel"; p2.hidden=true;
  p2.appendChild(introP("المفطرات: ما يُبطل الصيام إن وقع عمدًا وعِلمًا واختيارًا."));
  p2.appendChild(accordion([
    ["الأكل والشرب عمدًا","أي إدخال طعام أو شراب للجوف عن قصد."],
    ["الجماع","من أعظم المفطرات وفيه كفارة مغلظة إن وقع في نهار رمضان عمدًا."],
    ["الاستقاءة عمدًا","التقيؤ بإرادة الشخص، أما من غلبه القيء فلا يفطر."],
    ["خروج دم الحيض أو النفاس","يُفطر الصائمة ولو في آخر لحظة من النهار، ويجب عليها القضاء."],
    ["ما لا يُفطر (خلافًا لظن كثيرين)",["الأكل أو الشرب نسيانًا: لا يُفطر، والصيام صحيح.","الاحتلام أثناء النوم: لا يُفطر.","القيء الغالب (بلا قصد): لا يُفطر.","السواك والمضمضة المعتادة بلا مبالغة: لا تُفطر.","الحجامة: محل خلاف بين العلماء."]]
  ]));
  panels["mufsidat"]=p2;

  const p3=document.createElement("div"); p3.className="subpanel"; p3.hidden=true;
  p3.appendChild(introP("صيام التطوع: أيام مستحبة ورد فضلها في السنة، غير واجبة لكنها مضاعفة الأجر."));
  p3.appendChild(accordion([
    ["الاثنين والخميس","كان النبي ﷺ يتحرى صيامهما، فقد تُعرض الأعمال على الله فيهما."],
    ["الأيام البيض","الثالث عشر والرابع عشر والخامس عشر من كل شهر هجري."],
    ["ستة أيام من شوال","بعد رمضان، من صامها مع رمضان فكأنما صام الدهر كله."],
    ["يوم عرفة (لغير الحاج)","يُكفّر السنة الماضية والباقية."],
    ["يوم عاشوراء وتاسوعاء","العاشر من محرم، ويُستحب صيام التاسع معه مخالفة لأهل الكتاب."],
    ["صيام داود عليه السلام","يومًا ويفطر يومًا، وهو أفضل صيام التطوع عند كثير من العلماء لعدم إجهاده."]
  ]));
  panels["tatawwu"]=p3;

  const p4=document.createElement("div"); p4.className="subpanel"; p4.hidden=true;
  p4.appendChild(introP("رمضان: الركن الرابع من أركان الإسلام، صيامه فرض على كل مسلم مكلّف قادر مقيم."));
  p4.appendChild(accordion([
    ["فضل رمضان",["نزل فيه القرآن.","فيه ليلة القدر خير من ألف شهر.","تُفتح فيه أبواب الجنة وتُغلق أبواب النار وتُصفّد الشياطين.","صيامه وقيامه إيمانًا واحتسابًا يُغفر بهما ما تقدم من الذنب."]],
    ["السنن المرتبطة به",["السحور، وتأخيره قدر المستطاع.","تعجيل الفطر.","الدعاء عند الإفطار.","الإكثار من قراءة القرآن وصلاة التراويح.","الاعتكاف خاصة في العشر الأواخر."]]
  ]));
  const linkR = linkCard("🌙","تقويم رمضان","دعاء ومهام لكل يوم، ومتابعة العشر الأواخر والاعتكاف","7-ramadan.html");
  p4.appendChild(linkR);
  panels["ramadan"]=p4;

  [p1,p2,p3,p4].forEach(p=>frag.appendChild(p));

  function selectSub(id){
    Object.keys(panels).forEach((k,i)=>{
      panels[k].hidden = k!==id;
      sub.children[i].setAttribute("aria-pressed", k===id?"true":"false");
    });
  }
  return frag;
}

/* ===================== الزكاة ===================== */
function buildZakat(){
  const frag=document.createElement("div");
  frag.appendChild(introP("الزكاة: الركن الثالث من أركان الإسلام، حق مالي واجب في أموال مخصوصة بلغت نصابًا وحال عليها الحول."));
  frag.appendChild(accordion([
    ["النصاب (تعريف عام)","الحد الأدنى من المال الذي إذا بلغه المسلم وجبت عليه الزكاة، ويختلف مقداره باختلاف نوع المال (نقد، ذهب، فضة، زروع، أنعام)."],
    ["زكاة المال (النقود والأرصدة)",["تجب إذا بلغ المال نصابًا (المعادل لأدنى نصابي الذهب أو الفضة) وحال عليه حول هجري كامل.","مقدارها ٢.٥٪ من إجمالي المبلغ.","تشمل النقد الحاضر، والمدّخر في البنوك، والديون التي يُرجى تحصيلها."]],
    ["زكاة الذهب والفضة",["نصاب الذهب: ٨٥ جرامًا تقريبًا من الذهب الخالص.","نصاب الفضة: ٥٩٥ جرامًا تقريبًا من الفضة الخالصة.","جمهور العلماء لا يُزكّي الذهب المُعَدّ للُبس المعتاد للمرأة، وبعضهم أوجب زكاته أيضًا، فمن أراد الاحتياط زكّاه.","المقدار الواجب ٢.٥٪ من قيمة الذهب أو الفضة المدّخر."]],
    ["زكاة عروض التجارة",["كل ما أُعدّ للبيع بقصد الربح (بضاعة، عقار للتجارة، أسهم للمتاجرة).","تُقوَّم بسعر السوق الحالي عند حلول الحول، لا بسعر الشراء.","الزكاة الواجبة ٢.٥٪ من القيمة السوقية."]],
    ["شروط عامة لوجوب الزكاة",["الإسلام.","الملك التام للمال.","بلوغ النصاب.","مرور الحول الهجري الكامل (باستثناء زكاة الزروع والثمار التي تجب عند الحصاد)."]]
  ]));
  frag.appendChild(linkCard("🧮","حاسبة الزكاة","احسب زكاتك تلقائيًا بإدخال أرقامك وسعر الذهب","10-zakat.html"));
  frag.appendChild(warnBox("⚠️ حاسبة الزكاة في هذه المكتبة أداة تقديرية للمساعدة على الحساب السريع فقط، وليست فتوى شرعية. حالتك المالية قد تحتوي تفاصيل (ديون، شراكات، أموال مختلطة، خلاف فقهي في نوع مالك) تحتاج عرضها على عالم أو جهة إفتاء موثوقة قبل إخراج الزكاة فعليًا."));
  return frag;
}

/* ===================== wiring ===================== */
const TABS = [
  ["salah","الصلاة", buildSalah],
  ["sawm","الصيام", buildSawm],
  ["zakat","الزكاة", buildZakat]
];
const tabsEl=document.getElementById("tabs");
const main=document.getElementById("main");
const panels={};
TABS.forEach(([id,label,build],i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=label;
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.addEventListener("click",()=>select(id));
  tabsEl.appendChild(b);
  const s=document.createElement("section");
  if(i!==0) s.hidden=true;
  s.appendChild(build());
  main.appendChild(s);
  panels[id]=s;
});
function select(id){
  TABS.forEach(([t],i)=>{
    panels[t].hidden = t!==id;
    tabsEl.children[i].setAttribute("aria-selected", t===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
