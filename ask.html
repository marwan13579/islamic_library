<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسأل الموقع — موسوعة إسلامية قابلة للبحث</title>
<meta name="description" content="اسأل الموقع عن أي موضوع إسلامي. بحث ذكي في القرآن والأحاديث والتفسير والفتاوى والأذكار والكتب الإسلامية.">
<meta name="theme-color" content="#0b3d2c">
<link rel="canonical" href="./ask.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:site_name" content="المكتبة الإسلامية">
<meta property="og:title" content="اسأل الموقع — موسوعة إسلامية قابلة للبحث">
<meta property="og:description" content="اسأل الموقع عن أي موضوع إسلامي. بحث ذكي في القرآن والأحاديث والتفسير والفتاوى والأذكار والكتب الإسلامية.">
<meta property="og:url" content="./ask.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tailwind.generated.css">
<link rel="stylesheet" href="tools.css">
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14);
    --card:#FFFAF0; --green:#2F6B4F; --green-soft:#DCEAE0;
    --accent:#0b4d3a; --accent-soft:#e8f5ee;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --green:#5FA787; --green-soft:#173A30;
    --accent:#5FA787; --accent-soft:#1a3a2f;
  }
  :root:not([data-theme="dark"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --green:#5FA787; --green-soft:#173A30;
    --accent:#5FA787; --accent-soft:#1a3a2f;
  }}
  *, *::before, *::after{ box-sizing:inherit; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Cairo","Amiri","Scheherazade New","Aref Ruqaa",system-ui,sans-serif;
    line-height:1.8; min-height:100vh; direction:rtl;
  }
  a{ color:var(--green); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .skip-link{
    position:absolute; top:-40px; right:0; background:var(--accent); color:#fff;
    padding:8px 16px; z-index:100; border-radius:0 0 8px 0;
  }
  .skip-link:focus{ top:0; }

  /* Header */
  .site-header{
    background:var(--paper-2); border-bottom:1px solid var(--line);
    padding:12px 16px; position:sticky; top:0; z-index:50;
    backdrop-filter:blur(12px);
  }
  .header-inner{
    max-width:900px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
  }
  .logo{
    font-size:1.25rem; font-weight:700; color:var(--ink);
    white-space:nowrap; display:flex; align-items:center; gap:6px;
  }

  /* Main */
  .main{
    max-width:800px; margin:0 auto; padding:16px;
  }

  /* Hero / Search Box */
  .hero{
    text-align:center; padding:32px 0 24px;
  }
  .hero h1{
    font-size:2rem; margin:0 0 4px; font-weight:700;
  }
  .hero p{
    color:var(--ink-soft); margin:0 0 20px; font-size:1rem;
  }
  .search-box{
    display:flex; gap:8px; max-width:700px; margin:0 auto;
  }
  .search-input{
    flex:1; padding:14px 18px; font-size:1.05rem;
    border:2px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--ink);
    font-family:inherit; outline:none;
    transition:border-color .2s;
  }
  .search-input:focus{ border-color:var(--green); }
  .search-input::placeholder{ color:var(--ink-soft); opacity:.7; }
  .search-btn{
    padding:14px 24px; background:var(--green); color:#fff;
    border:none; border-radius:12px; font-size:1rem; font-weight:600;
    cursor:pointer; font-family:inherit;
    transition:background .2s;
  }
  .search-btn:hover{ filter:brightness(1.1); }
  .search-btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* Suggestions */
  .suggestions{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top:16px;
  }
  .suggestion-chip{
    padding:6px 14px; border-radius:20px; font-size:.85rem;
    border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); cursor:pointer; font-family:inherit;
    transition:all .2s;
  }
  .suggestion-chip:hover{
    border-color:var(--green); color:var(--green); background:var(--accent-soft);
  }

  /* Filters */
  .filters{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin:20px 0;
  }
  .filter-btn{
    padding:6px 14px; border-radius:20px; font-size:.85rem;
    border:1px solid var(--line); background:transparent;
    color:var(--ink-soft); cursor:pointer; font-family:inherit;
    transition:all .2s;
  }
  .filter-btn:hover, .filter-btn.active{
    background:var(--green); color:#fff; border-color:var(--green);
  }

  /* Loading */
  .loading{
    text-align:center; padding:32px; color:var(--ink-soft);
  }
  .spinner{
    width:32px; height:32px; border:3px solid var(--line);
    border-top-color:var(--green); border-radius:50%;
    animation:spin .8s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Answer */
  .answer-container{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  .answer-section{
    background:var(--card); border-radius:12px; padding:20px;
    margin-bottom:16px; border:1px solid var(--line);
  }
  .answer-section h2{
    font-size:1.15rem; margin:0 0 12px; display:flex;
    align-items:center; gap:8px;
  }
  .answer-section h3{
    font-size:1rem; margin:16px 0 8px; color:var(--green);
  }
  .answer-section p, .answer-section li{
    color:var(--ink-soft); font-size:.95rem; line-height:2;
  }
  .answer-section ul, .answer-section ol{
    padding-right:20px; margin:8px 0;
  }

  /* Source badge */
  .source-badge{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 10px; border-radius:12px; font-size:.75rem;
    font-weight:600;
  }
  .source-badge.tier-1{ background:#fff3cd; color:#856404; }
  .source-badge.tier-2{ background:#d4edda; color:#155724; }
  .source-badge.tier-3{ background:#cce5ff; color:#004085; }
  .source-badge.tier-4{ background:#e2e3e5; color:#383d41; }
  :root[data-theme="dark"] .source-badge.tier-1{ background:#5a4a1a; color:#ffd966; }
  :root[data-theme="dark"] .source-badge.tier-2{ background:#1a5c30; color:#5cdb8a; }
  :root[data-theme="dark"] .source-badge.tier-3{ background:#1a3a5c; color:#5cb8ff; }
  :root[data-theme="dark"] .source-badge.tier-4{ background:#2a2d30; color:#b0b3b8; }

  /* Source item */
  .source-item{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px; border-radius:8px; background:var(--paper-2);
    margin-bottom:8px; border:1px solid var(--line);
  }
  .source-item .src-icon{ font-size:1.2rem; flex-shrink:0; }
  .source-item .src-info{ flex:1; }
  .source-item .src-title{
    font-weight:600; font-size:.9rem; color:var(--ink);
    display:block;
  }
  .source-item .src-meta{
    font-size:.78rem; color:var(--ink-soft);
  }
  .source-item a{
    font-size:.8rem; padding:4px 10px; border-radius:6px;
    background:var(--accent-soft); color:var(--green);
    white-space:nowrap; align-self:center;
  }

  /* Result item */
  .result-item{
    padding:12px; border-radius:8px; background:var(--paper-2);
    margin-bottom:10px; border:1px solid var(--line);
    transition:border-color .2s;
  }
  .result-item:hover{ border-color:var(--gold-soft); }
  .result-item .result-title{
    font-weight:600; font-size:.95rem; color:var(--ink);
    display:block; margin-bottom:4px;
  }
  .result-item .result-desc{
    font-size:.85rem; color:var(--ink-soft); line-height:1.7;
  }
  .result-item .result-meta{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;
  }

  /* Related questions */
  .related-q{
    display:inline-block; padding:8px 14px; margin:4px;
    border-radius:8px; background:var(--paper-2);
    border:1px solid var(--line); color:var(--ink-soft);
    cursor:pointer; font-family:inherit; font-size:.85rem;
    transition:all .2s;
  }
  .related-q:hover{
    border-color:var(--green); color:var(--green); background:var(--accent-soft);
  }

  /* Zero results */
  .zero-state{ text-align:center; padding:48px 16px; }
  .zero-state h2{ font-size:1.3rem; margin:0 0 8px; }
  .zero-state p{ color:var(--ink-soft); margin:0 0 16px; }

  /* External label */
  .external-label{
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 10px; border-radius:8px; font-size:.75rem;
    background:#fff3cd; color:#856404; font-weight:600;
  }
  :root[data-theme="dark"] .external-label{
    background:#5a4a1a; color:#ffd966;
  }

  /* Corrections */
  .correction-box{
    padding:12px; border-radius:8px; background:#fff3cd;
    border:1px solid #ffc107; color:#856404; margin-bottom:16px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .correction-box button{
    padding:4px 12px; border-radius:6px; border:1px solid #ffc107;
    background:#ffc107; color:#856404; cursor:pointer; font-weight:600;
    font-family:inherit;
  }

  /* Error boundary */
  .error-boundary{
    padding:20px; border-radius:12px; background:#f8d7da;
    border:1px solid #f5c6cb; color:#721c24; text-align:center;
  }

  /* Keyboard hint */
  .kbd-hint{
    font-size:.75rem; color:var(--ink-soft); text-align:center;
    margin-top:8px;
  }

  /* Responsive */
  @media(max-width:600px){
    .hero h1{ font-size:1.5rem; }
    .search-box{ flex-direction:column; }
    .search-btn{ width:100%; }
  }

  /* Reduced motion */
  @media(prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms!important; transition-duration:.01ms!important; }
  }
</style>
</head>
<body>

<a href="#main" class="skip-link">انتقل إلى المحتوى الرئيسي</a>

<header class="site-header" role="banner">
  <div class="header-inner">
    <a href="index.html" class="back-link" aria-label="العودة للصفحة الرئيسية">← الرئيسية</a>
    <div class="logo">🕌 اسأل الموقع</div>
  </div>
</header>

<main id="main" class="main" role="main">
  <section class="hero" aria-labelledby="ask-heading">
    <h1 id="ask-heading">اسأل الموقع</h1>
    <p>موسوعة إسلامية ذكية — اكتب سؤالك وسأبحث في كل محتوى الموقع</p>

    <div class="search-box" role="search">
      <label for="ask-input" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">سؤالك</label>
      <input
        id="ask-input"
        type="text"
        class="search-input"
        placeholder="اسأل عن أي شيء داخل الموقع..."
        autocomplete="off"
        aria-describedby="ask-hint"
        lang="ar"
        dir="auto"
      >
      <button id="ask-btn" class="search-btn" aria-label="بحث">🔍 بحث</button>
    </div>
    <p id="ask-hint" class="kbd-hint">اضغط Enter للبحث</p>

    <div id="suggestions-container" class="suggestions" role="list" aria-label="اقتراحات"></div>
  </section>

  <div id="filters" class="filters" role="group" aria-label="تصفية النتائج">
    <button class="filter-btn active" data-filter="all">الكل</button>
    <button class="filter-btn" data-filter="quran">📖 القرآن</button>
    <button class="filter-btn" data-filter="hadith">📕 الحديث</button>
    <button class="filter-btn" data-filter="tafsir">📚 التفسير</button>
    <button class="filter-btn" data-filter="dhikr">🤲 الأذكار</button>
    <button class="filter-btn" data-filter="dua">🤲 الأدعية</button>
    <button class="filter-btn" data-filter="fiqh">⚖️ الفقه</button>
    <button class="filter-btn" data-filter="aqeedah">☝️ العقيدة</button>
    <button class="filter-btn" data-filter="seerah">🕌 السيرة</button>
    <button class="filter-btn" data-filter="library">📚 الكتب</button>
    <button class="filter-btn" data-filter="external">🌐 خارجي</button>
  </div>

  <div id="answer-output" role="region" aria-live="polite" aria-atomic="false">
    <div class="zero-state">
      <h2>ابدأ بكتابة سؤالك</h2>
      <p>ابحث في القرآن والأحاديث والتفسير والفتاوى والأذكار والكتب الإسلامية</p>
    </div>
  </div>
</main>

<script type="module">
  import { ask, askSuggestions, getSearchDiagnostics, resetAskSearch } from "./src/lib/ask-search.js";
  import { processQuery, getSmartSuggestions } from "./src/lib/unified-search.js";

  const input = document.getElementById("ask-input");
  const btn = document.getElementById("ask-btn");
  const output = document.getElementById("answer-output");
  const suggestionsEl = document.getElementById("suggestions-container");
  const filters = document.querySelectorAll(".filter-btn");
  let currentFilter = "all";
  let lastQuery = "";

  function setTheme() {
    try {
      const saved = localStorage.getItem("lib-theme-pref");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch {}
  }
  setTheme();

  async function doSearch() {
    const query = input.value.trim();
    if (!query) return;

    lastQuery = query;
    output.innerHTML = `<div class="loading"><div class="spinner" role="status"></div><p>جاري البحث...</p></div>`;
    btn.disabled = true;

    try {
      const result = await ask(query, {
        limit: 30,
        category: currentFilter === "all" ? null : currentFilter,
        includeExternal: true,
      });

      if (lastQuery !== query) return;

      renderAnswer(result.answer);
    } catch (e) {
      console.error("ask error:", e);
      output.innerHTML = `<div class="error-boundary">حدث خطأ أثناء البحث. يرجى المحاولة مرة أخرى.</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderAnswer(answer) {
    if (answer.zeroResult) {
      const suggestions = [
        "حاول بكلمات أقصر",
        "استخدم مرادفات مختلفة",
        "تصفح الأقسام الرئيسية",
        "جرّب: ما هي أركان الإسلام؟",
        "جرّب: ما فضل الصلاة؟",
      ];
      output.innerHTML = `
        <div class="zero-state">
          <h2>لم نجد نتيجة مطابقة</h2>
          <p>لم يتم العثور على معلومات كافية في محتوى الموقع الحالي. جرب تعديل السؤال أو تصفح المواضيع التالية:</p>
          <div class="suggestions">
            ${suggestions.map(s => `<button class="suggestion-chip" data-query="${s}">${s}</button>`).join("")}
          </div>
        </div>`;
      bindSuggestionChips();
      return;
    }

    let html = '<div class="answer-container">';

    // Internal answer
    if (answer.internal && answer.internal.sections && answer.internal.sections.length > 0) {
      html += '<div class="answer-section">';
      html += '<h2>🏠 من محتوى الموقع</h2>';

      if (answer.internal.summary) {
        html += `<p>${escapeHtml(answer.internal.summary)}</p>`;
      }

      for (const section of answer.internal.sections) {
        html += `<h3>${escapeHtml(section.title)}</h3>`;
        for (const item of section.items.slice(0, 4)) {
          html += `
            <div class="result-item">
              <a href="${escapeHtml(item.route || "#")}" class="result-title" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
              <p class="result-desc">${escapeHtml((item.summary || item.description || "").slice(0, 200))}</p>
              <div class="result-meta">
                <span class="source-badge tier-${section.tier}">${getTierLabel(section.tier)}</span>
                <span style="font-size:.75rem;color:var(--ink-soft);">${escapeHtml(item.category || "")}</span>
              </div>
            </div>`;
        }
      }
      html += "</div>";

      if (answer.internal.sources && answer.internal.sources.length > 0) {
        html += '<div class="answer-section">';
        html += '<h2>📚 المصادر</h2>';
        for (const src of answer.internal.sources.slice(0, 10)) {
          html += `
            <div class="source-item">
              <span class="src-icon">${TYPE_ICONS[src.type] || "📋"}</span>
              <div class="src-info">
                <span class="src-title">${escapeHtml(src.title)}</span>
                <div class="src-meta">${escapeHtml(src.typeLabel || src.type)} · ${escapeHtml(src.category || "")}</div>
              </div>
              ${src.route ? `<a href="${escapeHtml(src.route)}" target="_blank" rel="noopener">فتح المصدر</a>` : ""}
            </div>`;
        }
        html += "</div>";
      }
    }

    // External answer
    if (answer.external && answer.external.sections && answer.external.sections.length > 0) {
      html += '<div class="answer-section" style="border-color:var(--gold-soft);">';
      html += '<h2>🌐 من مصادر خارجية</h2>';
      html += '<p style="font-size:.85rem;color:var(--ink-soft);">المعلومات التالية من مصادر خارجية موثوقة أضيفت للمشروع.</p>';

      if (answer.external.summary) {
        html += `<p>${escapeHtml(answer.external.summary)}</p>`;
      }

      for (const section of answer.external.sections) {
        for (const item of section.items.slice(0, 4)) {
          html += `
            <div class="result-item" style="border-right:3px solid var(--gold-soft);">
              <span class="external-label" style="margin-bottom:4px;">🌐 ${escapeHtml(item.sourceName || "مصدر خارجي")}</span>
              <a href="${escapeHtml(item.route || "#")}" class="result-title" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
              <p class="result-desc">${escapeHtml((item.summary || item.description || "").slice(0, 200))}</p>
              <div class="result-meta">
                <span class="source-badge tier-4">مصدر خارجي</span>
              </div>
            </div>`;
        }
      }
      html += "</div>";
    }

    // Related questions
    if (answer.relatedQuestions && answer.relatedQuestions.length > 0) {
      html += '<div class="answer-section">';
      html += '<h2>💡 أسئلة مشابهة</h2>';
      html += '<div class="suggestions">';
      for (const q of answer.relatedQuestions) {
        html += `<button class="related-q" data-query="${escapeAttr(q)}">${escapeHtml(q)}</button>`;
      }
      html += "</div></div>";
    }

    // Related topics from knowledge graph
    if (answer.relatedTopics && answer.relatedTopics.length > 0) {
      html += '<div class="answer-section">';
      html += '<h2>🔗 مواضيع مرتبطة</h2>';
      html += '<div class="suggestions">';
      for (const t of answer.relatedTopics.slice(0, 8)) {
        html += `<button class="related-q" data-query="${escapeAttr(t)}">${escapeHtml(t)}</button>`;
      }
      html += "</div></div>";
    }

    html += "</div>";
    output.innerHTML = html;

    // Bind related question clicks
    output.querySelectorAll(".related-q").forEach((btn) => {
      btn.addEventListener("click", () => {
        input.value = btn.dataset.query;
        doSearch();
      });
    });

    // Bind external links
    output.querySelectorAll('a[target="_blank"]').forEach((a) => {
      a.addEventListener("click", (e) => {
        if (a.href && a.href.includes("external-sources")) {
          e.preventDefault();
          const notice = document.createElement("div");
          notice.className = "correction-box";
          notice.innerHTML = `هذا الرابط يوجهك إلى موقع خارجي. نحن لا نتحكم في محتواه. <button>متابعة</button>`;
          notice.querySelector("button").addEventListener("click", () => {
            window.open(a.href, "_blank", "noopener");
            notice.remove();
          });
          output.insertBefore(notice, output.firstChild);
        }
      });
    });
  }

  function bindSuggestionChips() {
    output.querySelectorAll(".suggestion-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        input.value = chip.dataset.query;
        doSearch();
      });
    });
  }

  function escapeHtml(str) {
    if (!str) return "";
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return String(str || "").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function getTierLabel(tier) {
    const labels = { 1: "مصدر شرعي أساسي", 2: "مصدر شرعي معتمد", 3: "مصدر تعليمي", 4: "مصدر عام" };
    return labels[tier] || "مصدر";
  }

  const TYPE_ICONS = {
    quran: "📖", hadith: "📕", tafsir: "📚", siraj: "🪔", fatwa: "⚖️",
    khutbah: "🗣️", seerah: "🕌", history: "🏛️", lesson: "📚", book: "📖",
    article: "📝", tool: "🛠️", page: "📄", general: "📋", adhkar: "🤲", dua: "🤲",
  };

  // Event listeners
  btn.addEventListener("click", doSearch);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSearch(); }
  });

  // Filters
  filters.forEach((f) => {
    f.addEventListener("click", () => {
      filters.forEach((x) => x.classList.remove("active"));
      f.classList.add("active");
      currentFilter = f.dataset.filter;
      if (lastQuery) doSearch();
    });
  });

  // Smart suggestions on load
  async function loadSuggestions() {
    try {
      const smart = await getSmartSuggestions();
      if (smart.length) {
        suggestionsEl.innerHTML = smart.slice(0, 6).map((s) =>
          `<button class="suggestion-chip" data-query="${escapeAttr(s.title)}">${escapeHtml(s.title)}</button>`
        ).join("");
        suggestionsEl.querySelectorAll(".suggestion-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            input.value = chip.dataset.query;
            doSearch();
          });
        });
      }
    } catch {}
  }
  loadSuggestions();

  // Load external index hint
  try {
    const stats = await getSearchDiagnostics();
    if (stats.externalIndex && stats.externalIndex.totalDocs > 0) {
      const badge = document.createElement("span");
      badge.className = "external-label";
      badge.textContent = `🌐 ${stats.externalIndex.totalDocs} صفحة خارجية`;
      badge.style.marginTop = "8px";
      badge.style.display = "inline-flex";
      suggestionsEl.after(badge);
    }
  } catch {}

  // Search history (localStorage)
  const HISTORY_KEY = "ask-search-history";
  const MAX_HISTORY = 10;

  function saveToHistory(query) {
    try {
      let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      history = history.filter((h) => h !== query);
      history.unshift(query);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
    } catch {}
  }

  const origDoSearch = doSearch;
  doSearch = async function() {
    const query = input.value.trim();
    if (query) saveToHistory(query);
    await origDoSearch();
  };

  // Keyboard: Ctrl+K / Cmd+K to focus search
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "k") {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });

  window.addEventListener("beforeunload", () => {
    try { resetAskSearch(); } catch {}
  });
</script>
</body>
</html>
