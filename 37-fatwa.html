<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<script src="src/lib/serve-hint.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الفتاوى · المكتبة الإسلامية</title>
<meta name="description" content="فتاوى الدكتور عبد الرحمن البراك مرتّبة ومصنّفة: العبادات، المعاملات، الفقه، والآداب. تُقرأ واحدةً واحدة بلا تحميل المكتبة كلها.">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<link rel="stylesheet" href="library.css">
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="lib-head">
  <h1>الفتاوى</h1>
  <p>فتاوى موثّقة مرتّبة وتصنيفها محفوظ، فتُقرأ الفتاوى واحدةً واحدة ولا تُحمَّل المكتبة كلها.</p>
</div>

<main class="lib-wrap">
  <div class="lib-tools">
    <input class="lib-search" id="q" type="search" placeholder="ابحث في عناوين الفتاوى…" aria-label="بحث في الفتاوى">
  </div>
  <div class="lib-chips" id="sorts"></div>
  <div class="lib-chips" id="chips"></div>
  <p class="lib-count" id="count"></p>
  <div id="list"><p class="lib-state">جارٍ التحميل…</p></div>
  <div class="lib-pager" id="pager"></div>
</main>


<script type="module">
  import { mountCollection } from "./src/lib/content-ui.js";

  const refs = {
    sorts: document.getElementById("sorts"),
    chips: document.getElementById("chips"),
    search: /** @type {HTMLInputElement} */ (document.getElementById("q")),
    list: document.getElementById("list"),
    count: document.getElementById("count"),
    pager: document.getElementById("pager"),
  };

  await mountCollection("fatwa", refs);
</script>
<footer class="lib-foot">

</footer>

</body>
</html>
