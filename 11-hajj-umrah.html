<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل الحج والعمرة</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(2rem,7vw,2.8rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:38ch;margin:.4rem auto 0}

  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.85rem;background:none;border:0;color:var(--ink-soft);
    padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  section[hidden]{display:none}

  .prose p{margin:0 0 12px;font-size:.92rem}
  .box{background:var(--card);border:1px solid var(--gold-soft);border-radius:14px;padding:16px;margin:14px 0;text-align:center}
  .box .text{font-family:"Amiri",serif;font-size:1.2rem;line-height:2;margin:0}
  .box .src{font-size:.78rem;color:var(--ink-soft);margin-top:8px}

  .steps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px}
  .num{font-family:"Amiri",serif;font-weight:700;font-size:1.2rem;color:var(--gold);
    min-width:32px;height:32px;border:2px solid var(--gold-soft);border-radius:50%;
    display:grid;place-items:center;flex-shrink:0}
  .step h3{margin:0 0 5px;font-size:1rem}
  .step p{margin:0;font-size:.87rem;color:var(--ink-soft)}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="wrap">
<header>
  <h1>دليل الحج والعمرة</h1>
  <p>خطوات مبسّطة لأداء العمرة والحج، للمعتمر والحاج لأول مرة.</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ</footer>
</div>

<script>
function stepsList(arr){
  const wrap=document.createElement("div");
  wrap.className="steps";
  let n=0;
  arr.forEach(([title,desc])=>{
    n++;
    const el=document.createElement("div");
    el.className="step";
    el.innerHTML='<span class="num">'+n+'</span><div><h3>'+title+'</h3><p>'+desc+'</p></div>';
    wrap.appendChild(el);
  });
  return wrap;
}

function panelUmrah(){
  const frag=document.createElement("div");
  frag.className="prose";
  frag.innerHTML='<p>العمرة نسك يمكن أداؤه في أي وقت من السنة، وتتكون من أربع خطوات رئيسية.</p>';
  frag.appendChild(stepsList([
    ["الإحرام من الميقات","اغتسل والبس ملابس الإحرام (للرجل إزار ورداء أبيضان، وللمرأة ثيابها العادية الساترة الفضفاضة)، وانوِ العمرة قائلًا: لبيك اللهم عمرة."],
    ["التلبية","أكثر من قول: لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ — من الإحرام حتى تبدأ الطواف."],
    ["الطواف بالكعبة","طُف حول الكعبة سبعة أشواط، تبدأ وتنتهي عند الحجر الأسود، وابدأ كل شوط بالتكبير إن استطعت لمسه أو الإشارة إليه."],
    ["صلاة ركعتين خلف مقام إبراهيم","بعد الطواف صلِّ ركعتين إن أمكن خلف المقام، وإلا ففي أي مكان بالمسجد."],
    ["السعي بين الصفا والمروة","اسعَ سبعة أشواط بين جبلي الصفا والمروة، تبدأ بالصفا وتنتهي بالمروة."],
    ["الحلق أو التقصير","احلق شعر رأسك أو قصّر منه (المرأة تقصّر قدر أنملة)، وبهذا تنتهي العمرة ويحل لك كل ما حرمه الإحرام."]
  ]));
  return frag;
}

function panelHajj(){
  const frag=document.createElement("div");
  frag.className="prose";
  frag.innerHTML='<p>الحج موسم محدد في ذي الحجة، وله ترتيب أيام محدد. هذا ملخص لأهم مناسكه (على نمط حج التمتع، الأكثر شيوعًا).</p>';
  frag.appendChild(stepsList([
    ["8 ذي الحجة (يوم التروية)","أحرم بالحج من مكانك في مكة، واتجه إلى منى وبِت فيها، وصلِّ الصلوات مقصورة."],
    ["9 ذي الحجة (يوم عرفة)","توجّه إلى عرفة وقف فيها من الزوال حتى الغروب، فهي ركن الحج الأعظم — «الحج عرفة». أكثر من الدعاء والاستغفار."],
    ["مزدلفة","بعد غروب شمس يوم عرفة توجّه إلى مزدلفة وبِت فيها، واجمع منها الحصى لرمي الجمرات."],
    ["10 ذي الحجة (يوم النحر)","ارمِ جمرة العقبة الكبرى بسبع حصيات، ثم اذبح الهدي إن كنت متمتعًا أو قارنًا، ثم احلق أو قصّر، ثم طُف طواف الإفاضة واسعَ إن لم تكن سعيت."],
    ["أيام التشريق (11-13 ذي الحجة)","ابقَ في منى وارمِ الجمرات الثلاث كل يوم بعد الزوال، ويجوز التعجّل بالخروج بعد رمي اليوم الثاني عشر."],
    ["طواف الوداع","قبل مغادرة مكة نهائيًا، طُف طواف الوداع وداعًا للبيت الحرام."]
  ]));
  return frag;
}

function panelTips(){
  const frag=document.createElement("div");
  frag.className="prose";
  const box=document.createElement("div");
  box.className="box";
  box.innerHTML='<p class="text">اللَّهُمَّ حَجًّا لَا رِيَاءَ فِيهِ وَلَا سُمْعَةَ</p><p class="src">دعاء يُستحب الإكثار منه في الحج والعمرة</p>';
  frag.appendChild(box);
  frag.appendChild(stepsList([
    ["احرص على الفقه قبل السفر","تعلّم أحكام نسكك (عمرة، حج إفراد، تمتع، قران) من عالم موثوق أو كتيب معتمد قبل السفر، فالتفاصيل تختلف باختلاف النسك."],
    ["احترم الزحام والوقت","تجنّب أوقات الذروة في الطواف والسعي إن استطعت، والتزم الهدوء والرفق مع باقي الحجاج والمعتمرين."],
    ["حافظ على طهارتك ولباس الإحرام","تجنّب محظورات الإحرام: الطيب، قص الشعر أو الأظافر، تغطية الرأس للرجل، لبس المخيط للرجل، عقد النكاح، والجماع."],
    ["استعن بمرشد أو حملة موثوقة","المرشدون يعرفون المواقيت والتنظيم جيدًا، ويجنبونك الزحام والأخطاء الشائعة."],
    ["اغتنم أوقات الإجابة","الدعاء بين الصفا والمروة، وعند الملتزم، وفي عرفة، من أرجى أوقات إجابة الدعاء."],
    ["حافظ على صحتك","اشرب ماء زمزم بكثرة، ولا تهمل الراحة، فالمناسك تحتاج جهدًا بدنيًا كبيرًا خاصة في الحر."]
  ]));
  return frag;
}

const TABS = [
  ["umrah","العمرة", panelUmrah],
  ["hajj","الحج", panelHajj],
  ["tips","نصائح عملية", panelTips]
];
const tabsEl=document.getElementById("tabs");
const main=document.getElementById("main");
const panels={};
TABS.forEach(([id,label,build],i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=label;
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.addEventListener("click",()=>select(id));
  tabsEl.appendChild(b);
  const s=document.createElement("section");
  if(i!==0) s.hidden=true;
  s.appendChild(build());
  main.appendChild(s);
  panels[id]=s;
});
function select(id){
  TABS.forEach(([t],i)=>{
    panels[t].hidden = t!==id;
    tabsEl.children[i].setAttribute("aria-selected", t===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
</body>
</html>
