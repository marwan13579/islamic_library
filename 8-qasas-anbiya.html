<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    --green:#2F6B4F; --green-soft:#DCEAE0; --red:#B23B3B;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
    --green:#5FA787; --green-soft:#173A30; --red:#D86B6B;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
    --green:#5FA787; --green-soft:#173A30; --red:#D86B6B;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 18px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(1.9rem,7vw,2.7rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:44ch;margin:.4rem auto 0}

  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.85rem;background:none;border:0;color:var(--ink-soft);
    padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  section[hidden]{display:none}

  .note{font-size:.8rem;color:var(--ink-soft);background:var(--paper-2);border-radius:10px;padding:12px 14px;margin:16px 0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .card svg{width:44px;height:44px;color:var(--gold);margin-bottom:4px}
  .card .n{font-family:"Amiri",serif;font-size:1.02rem}

  dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:92vw;background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .dcontent{padding:22px;max-height:85vh;overflow-y:auto}
  .dicon{width:64px;height:64px;color:var(--gold);display:block;margin:0 auto}
  .dname{font-family:"Amiri",serif;font-size:1.7rem;text-align:center;color:var(--gold);margin:8px 0 0}
  .dstory{font-size:.95rem;margin-top:14px}
  .dlesson{background:var(--paper-2);border-radius:10px;padding:12px 14px;font-size:.88rem;color:var(--ink-soft);margin-top:14px}
  .dlesson b{color:var(--ink)}

  .quizbox{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .quizbox .q{font-weight:700;font-size:.92rem;margin:0 0 10px}
  .opt{display:block;width:100%;text-align:right;background:var(--paper);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:9px 14px;margin-bottom:7px;cursor:pointer;font-family:"Cairo";font-size:.88rem}
  .opt.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .opt.wrong{background:rgba(178,59,59,.12);border-color:var(--red);color:var(--red)}
  .qfeedback{font-size:.82rem;margin-top:6px;min-height:1.2em}

  .dclose{display:block;margin:18px auto 0;padding:9px 24px;border-radius:999px;border:0;
    background:var(--ink);color:var(--paper);font-family:"Cairo";font-weight:600;cursor:pointer}

  .topiccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .topiccard h2{font-family:"Amiri",serif;font-size:1.15rem;margin:0 0 10px}
  .topiccard ul{margin:0;padding-inline-start:20px;font-size:.9rem}
  .topiccard li{margin-bottom:6px}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>

}
</style>
<style>

  --glass-bg: rgba(255,255,255,.55);

}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),

    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);

}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>

/* ---------- prophets data: [name, story, lesson, icon, quiz] ---------- */
const P = [
["آدم عليه السلام","أول إنسان وأول نبي، خلقه الله بيده ونفخ فيه من روحه، وعلّمه الأسماء كلها، وأسجد له الملائكة إلا إبليس الذي أبى واستكبر. أسكنه الله الجنة مع زوجه حواء، ونهاهما عن شجرة واحدة، فوسوس لهما الشيطان حتى أكلا منها، فأُهبطا إلى الأرض، ثم تاب الله عليهما لأنهما رجعا واعترفا بذنبهما.","التوبة الصادقة تمحو الذنب، والشيطان عدو لا يفتر عن الوسوسة.","garden",
 {q:"لماذا أُهبط آدم وحواء من الجنة؟",o:["لأنهما أكلا من الشجرة التي نُهيا عنها","لأنهما كذبا على الملائكة","لأنهما رفضا السجود"],a:0}],
["إدريس عليه السلام","نبي من ذرية آدم، وصفه القرآن بالصدق والصبر، ورفعه الله مكانًا عليًا. اشتهر بالحكمة والعلم بين قومه.","العلم النافع والصدق يرفعان صاحبهما عند الله والناس.","scroll",
 {q:"بم وصف القرآن نبي الله إدريس؟",o:["بالصدق والصبر","بالقوة والشجاعة فقط","بالغنى والملك"],a:0}],
["نوح عليه السلام","أرسله الله إلى قومه يدعوهم لعبادة الله وحده تسعمائة وخمسين سنة، فلم يؤمن معه إلا قليل. أمره الله ببناء سفينة، فحمل فيها من آمن معه ومن كل زوجين اثنين، وأغرق الله قومه الكافرين بالطوفان.","الصبر على الدعوة مهما طال الزمن، وأن النجاة مع أهل الإيمان لا مع القرابة وحدها.","ship",
 {q:"كم سنة دعا نوح قومه؟",o:["٩٥٠ سنة تقريبًا","١٠ سنوات","١٠٠ سنة"],a:0}],
["هود عليه السلام","أُرسل إلى قوم عاد، وكانوا أقوياء البنية وأصحاب حضارة عظيمة، فدعاهم لعبادة الله فكذّبوه واستكبروا، فأهلكهم الله بريح صرصر عاتية.","القوة والحضارة لا تغني عن عذاب الله لمن كفر وعصى.","wind",
 {q:"بم أهلك الله قوم عاد؟",o:["بريح شديدة عاتية","بطوفان من الماء","بزلزلة"],a:0}],
["صالح عليه السلام","أُرسل إلى قوم ثمود، وأعطاه الله ناقة آية لهم، فنهاهم عن أذاها، فعقروها فأهلكهم الله بصيحة شديدة.","مخالفة أوامر الله ولو في أمر يسير قد تجر عذابًا عظيمًا.","mountain",
 {q:"ماذا كانت آية صالح لقومه؟",o:["ناقة خاصة أمرهم الله ألا يؤذوها","عصا تتحول إلى ثعبان","سفينة عظيمة"],a:0}],
["إبراهيم عليه السلام","خليل الرحمن، كسر أصنام قومه ودعاهم للتوحيد، فألقَوه في النار فجعلها الله عليه بردًا وسلامًا. بنى الكعبة مع ابنه إسماعيل، وابتلاه الله بذبح ابنه ففداه بذبح عظيم لما ثبت على الطاعة.","التوكل الكامل على الله ينجي من أشد المحن، والطاعة التامة لأمر الله ولو كانت صعبة.","flame",
 {q:"ماذا حدث عندما أُلقي إبراهيم في النار؟",o:["جعلها الله عليه بردًا وسلامًا","احترق ثم أحياه الله","لم يُلقَ في النار أصلًا"],a:0}],
["لوط عليه السلام","عاصر عمه إبراهيم، وأُرسل لقوم سدوم الذين ابتكروا فاحشة لم يسبقهم بها أحد من العالمين، فدعاهم للتوبة فأصروا، فأهلكهم الله بقلب قراهم وإمطارها بالحجارة.","الفاحشة مهما انتشرت وتطبّع الناس عليها تبقى جريمة تستحق العقاب.","mountain",
 {q:"من كان نبي الله لوط بالنسبة لإبراهيم؟",o:["عاصره وكان من أهل زمانه","ابنه","أخاه"],a:0}],
["إسماعيل عليه السلام","ابن إبراهيم، صبر مع أبيه حين أُمر بذبحه، وأعانه في بناء الكعبة، وكان صادق الوعد، ودعا قومه للصلاة والزكاة.","الصدق في الوعد وطاعة الوالدين في غير معصية الله من أعظم الأخلاق.","well",
 {q:"في ماذا أعان إسماعيل أباه إبراهيم؟",o:["بناء الكعبة","بناء سفينة","حفر بئر زمزم وحده"],a:0}],
["إسحاق عليه السلام","ابن إبراهيم الثاني، بشّرت به الملائكة أباه وأمه، وجعله الله نبيًا من الصالحين، وبارك فيه وفي ذريته.","بركة الله تكون في ذرية الأنبياء الصالحين الذين ساروا على نهجهم.","star",

["يعقوب عليه السلام","ابن إسحاق، ويُلقّب بإسرائيل، ابتُلي بفراق ابنه يوسف سنوات طويلة فصبر ودعا، حتى فرّج الله كربه وجمعه بابنه.","حسن الظن بالله والصبر الجميل يعقبهما الفرج، مهما طال الابتلاء.","crescent",
 {q:"بأي ابن ابتُلي يعقوب بالفراق؟",o:["يوسف","بنيامين","لاوي"],a:0}],
["يوسف عليه السلام","ابن يعقوب، حسده إخوته فألقَوه في البئر، فبيع عبدًا في مصر، وابتُلي بالسجن ظلمًا بعد أن راودته امرأة العزيز عن نفسه فاستعصم، ثم مكّنه الله في الأرض وجمعه بأهله بعد سنين.","العفة والصبر على الظلم يعقبهما التمكين، وأن كيد الأعداء لا يمنع قدر الله.","well",
 {q:"أين ألقى إخوة يوسف أخاهم؟",o:["في البئر","في البحر","في الصحراء"],a:0}],
["أيوب عليه السلام","ابتلاه الله بفقد المال والولد والصحة سنوات طويلة، فصبر ولم يجزع، ودعا ربه بأدب جم، ففرّج الله كربه ورد له أهله وماله مضاعفًا.","الصبر الجميل عند البلاء من أعظم أسباب الفرج، وحسن الأدب في الدعاء.","garden",
 {q:"اشتهر أيوب عليه السلام بأي صفة؟",o:["الصبر على البلاء","الغنى الشديد","القوة في القتال"],a:0}],
["شعيب عليه السلام","أُرسل إلى أهل مدين، وكانوا يبخسون الناس في الكيل والميزان، فدعاهم للعدل في المعاملة والتوحيد، فكذّبوه فأهلكهم الله بصيحة وزلزلة.","الأمانة في البيع والشراء وعدم الغش من أصول الدين، لا مجرد أخلاق.","scale",
 {q:"بم كان يُخطئ قوم شعيب في معاملاتهم؟",o:["ينقصون الكيل والميزان","يكذبون على الحكام","يهملون الزراعة"],a:0}],

/* ---------- quiz rendering ---------- */
function renderQuiz(container, quiz){
  container.innerHTML = '<p class="q">🧠 '+quiz.q+'</p>';
  const feedback=document.createElement("p");
  feedback.className="qfeedback";
  quiz.o.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button"; b.textContent=opt;
    b.addEventListener("click",()=>{
      const buttons=container.querySelectorAll(".opt");
      buttons.forEach(x=>x.disabled=true);
      if(i===quiz.a){
        b.classList.add("correct");
        feedback.textContent="✅ إجابة صحيحة، أحسنت!";
      } else {
        b.classList.add("wrong");
        buttons[quiz.a].classList.add("correct");
        feedback.textContent="❌ الإجابة الصحيحة: "+quiz.o[quiz.a];
      }
    });
    container.appendChild(b);
  });
  container.appendChild(feedback);
}

/* ---------- wiring ---------- */
const TABS = [
  ["prophets","قصص الأنبياء", buildProphets],
  ["salah","تعلّم الصلاة", buildSalahTopic],
  ["islam","أركان الإسلام", buildIslamPillars],
  ["iman","أركان الإيمان", buildImanPillars]
];
const tabsEl=document.getElementById("tabs");
const main=document.getElementById("main");
const panels={};
TABS.forEach(([id,label,build],i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=label;
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.addEventListener("click",()=>select(id));
  tabsEl.appendChild(b);
  const s=document.createElement("section");
  if(i!==0) s.hidden=true;
  s.appendChild(build());
  main.appendChild(s);
  panels[id]=s;
});
function select(id){
  TABS.forEach(([t],i)=>{
    panels[t].hidden = t!==id;
    tabsEl.children[i].setAttribute("aria-selected", t===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
