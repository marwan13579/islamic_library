<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<link rel="stylesheet" href="engage.css">

<script src="notify-boot.js" defer></script>

<title>نور الذكر — أذكار وأدعية</title>

<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<style>
  :root{
    --paper:#F6EFDF;
    --paper-2:#EFE5CF;
    --ink:#13322C;
    --ink-soft:#3D5B53;
    --gold:#9C7420;
    --gold-soft:#C9A24B;
    --line:rgba(19,50,44,.14);
    --card:#FFFAF0;
    --shadow:0 1px 0 rgba(19,50,44,.06);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#0C201C;
      --paper-2:#102A25;
      --ink:#EFE3C9;
      --ink-soft:#A9BDB4;
      --gold:#D3AE62;
      --gold-soft:#8C6F2E;
      --line:rgba(239,227,201,.16);
      --card:#122E28;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --shadow:none;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Cairo",system-ui,"Segoe UI",sans-serif;
    line-height:1.7;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}

  /* hero */
  header.hero{
    position:relative; overflow:hidden; text-align:center;
    padding:40px 16px 28px; margin-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .pattern{position:absolute;inset:0;opacity:.12;pointer-events:none}
  .hero h1{
    font-family:"Amiri",serif; font-weight:700; margin:0;
    font-size:clamp(2.4rem,9vw,3.6rem); letter-spacing:.02em;
    position:relative;
  }
  .hero p{
    margin:.4rem auto 0; max-width:34ch; color:var(--ink-soft);
    font-size:.95rem; position:relative;
  }
  .rule{
    width:120px;height:14px;margin:14px auto 0;position:relative;
    color:var(--gold);
  }

  /* tabs */
  nav.tabs{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--paper); border-bottom:1px solid var(--line);
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none}
  .tabs-inner{display:flex; gap:4px; padding:8px 12px; min-width:max-content; margin:0 auto}
  .tab{
    font-family:"Cairo",sans-serif; font-size:.9rem; font-weight:600;
    background:none;border:0;color:var(--ink-soft);
    padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  section[hidden]{display:none}
  .section-note{
    font-size:.9rem;color:var(--ink-soft);margin:20px 0 14px;
    padding-inline-start:12px;border-inline-start:3px solid var(--gold-soft);
  }

  /* dhikr card */
  .dhikr{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 18px 14px; margin-bottom:14px; box-shadow:var(--shadow);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, opacity .2s ease;
  }
  .dhikr:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .dhikr .text{
    font-family:"Amiri",serif; font-size:1.3rem; line-height:2.05; margin:0;
  }
  .dhikr .text .quran{color:var(--gold)}
  .dhikr .meta{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
    font-size:.82rem;color:var(--ink-soft);
  }
  .dhikr .src{flex:1}
  .count{
    font-family:"Cairo",sans-serif;font-weight:700;font-size:.85rem;
    min-width:52px;text-align:center;padding:5px 10px;border-radius:999px;
    background:var(--paper-2); color:var(--ink);
  }
  .dhikr.done{opacity:.5}
  .dhikr.done .count{background:var(--gold);color:#12211c}

  /* tasbih */
  .tasbih{text-align:center;padding:28px 0 8px}
  .beadwrap{position:relative;display:inline-block}
  .bead{
    width:min(62vw,240px);height:min(62vw,240px);border-radius:50%;
    border:2px solid var(--gold-soft); background:var(--card);
    color:var(--ink); font-family:"Amiri",serif; font-size:3.4rem; font-weight:700;
    cursor:pointer; display:grid;place-items:center;
    transition:transform .08s ease;
  }
  .bead:active{transform:scale(.97)}
  .bead:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .tasbih .phrase{font-family:"Amiri",serif;font-size:1.5rem;margin:18px 0 4px}
  .btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .btn{
    font-family:"Cairo",sans-serif;font-weight:600;font-size:.88rem;
    padding:9px 16px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);
  }
  .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* prose blocks */
  .prose h2{font-family:"Amiri",serif;font-size:1.6rem;margin:28px 0 8px}
  .prose p{margin:0 0 12px;max-width:68ch}
  .hadith{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-bottom:14px;
  }
  .hadith .text{font-family:"Amiri",serif;font-size:1.22rem;line-height:1.95;margin:0}
  .hadith .src{font-size:.82rem;color:var(--ink-soft);margin-top:10px}

  footer{
    margin-top:36px;padding-top:20px;border-top:1px solid var(--line);
    text-align:center;font-size:.85rem;color:var(--ink-soft);
  }
  .share{
    display:inline-flex;align-items:center;gap:8px;margin-top:10px;
    font-family:"Cairo",sans-serif;font-weight:700;font-size:.9rem;
    background:var(--ink);color:var(--paper);border:0;
    padding:11px 22px;border-radius:999px;cursor:pointer;
  }
  .share:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .toast{
    position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));
    margin:auto;width:max-content;max-width:90vw;
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
    font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:20;
  }
  .toast.show{opacity:1}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>

<header class="hero">
  <svg class="pattern" aria-hidden="true" width="100%" height="100%">
    <defs>
      <pattern id="star" width="60" height="60" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="currentColor" stroke-width="1.1">
          <path d="M30 4 L44 18 L56 18 L56 30 L44 44 L44 56 L30 56 L16 44 L4 44 L4 30 L16 16 L16 4 Z"/>
          <path d="M30 0 L60 30 L30 60 L0 30 Z"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#star)" style="color:var(--gold)"/>

  <h1>نُورُ الذِّكر</h1>

<script>
const A = (t,c,s)=>({t,c:c||1,s:s||""});

const DATA = {
  sabah: {
    label:"أذكار الصباح",
    note:"وقتها من بعد صلاة الفجر إلى طلوع الشمس، ومن فاته فليقلها في أول النهار. المس الذكر لتنقص العدد.",
    items:[
      A("أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ. ﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾", 1, "آية الكرسي — من قالها حين يُصبح أُجير من الجن حتى يُمسي"),
      A("﴿قُلْ هُوَ اللَّهُ أَحَدٌ • اللَّهُ الصَّمَدُ • لَمْ يَلِدْ وَلَمْ يُولَدْ • وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾", 3, "سورة الإخلاص"),
      A("﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ • مِن شَرِّ مَا خَلَقَ • وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ • وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ • وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾", 3, "سورة الفلق"),
      A("﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ • مَلِكِ النَّاسِ • إِلَٰهِ النَّاسِ • مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ • الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ • مِنَ الْجِنَّةِ وَالنَّاسِ﴾", 3, "سورة الناس"),
      A("أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", 1, "رواه مسلم"),
      A("اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", 1, "رواه الترمذي"),
      A("اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", 1, "سيد الاستغفار — رواه البخاري"),
      A("اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ", 4, "رواه أبو داود"),
      A("اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", 1, "رواه أبو داود"),
      A("اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", 3, "رواه أبو داود"),
      A("حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", 7, "من قالها كفاه الله ما أهمه"),
      A("بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ", 3, "رواه أبو داود والترمذي"),
      A("رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا", 3, "رواه أبو داود"),
      A("يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", 1, "رواه الحاكم"),
      A("أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", 1, "رواه أحمد"),
      A("سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", 3, "رواه مسلم"),
      A("اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", 1, "يقال بعد صلاة الفجر — رواه ابن ماجه"),
      A("أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", 100, "ورد عنه ﷺ الاستغفار في اليوم أكثر من سبعين مرة"),
      A("سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", 100, "حُطَّت خطاياه وإن كانت مثل زبد البحر"),
      A("لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", 10, "ومن قالها مئة مرة كانت له عدل عشر رقاب"),
      A("اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ", 10, "من صلى عليّ حين يصبح عشرًا وحين يمسي عشرًا أدركته شفاعتي")
    ]
  },
  masaa: {
    label:"أذكار المساء",
    note:"وقتها من بعد صلاة العصر إلى غروب الشمس، ولا بأس بقولها بعد المغرب.",
    items:[
      A("أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ. ﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾", 1, "آية الكرسي"),
      A("﴿قُلْ هُوَ اللَّهُ أَحَدٌ • اللَّهُ الصَّمَدُ • لَمْ يَلِدْ وَلَمْ يُولَدْ • وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾", 3, "سورة الإخلاص"),
      A("﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ • مِن شَرِّ مَا خَلَقَ • وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ • وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ • وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾", 3, "سورة الفلق"),
      A("﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ • مَلِكِ النَّاسِ • إِلَٰهِ النَّاسِ • مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ • الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ • مِنَ الْجِنَّةِ وَالنَّاسِ﴾", 3, "سورة الناس"),
      A("أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", 1, "رواه مسلم"),
      A("اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ", 1, "رواه الترمذي"),
      A("اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", 1, "سيد الاستغفار — رواه البخاري"),
      A("اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ", 4, "رواه أبو داود"),
      A("اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ", 1, "رواه أبو داود"),
      A("أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", 3, "من قالها حين يمسي لم تضره حُمَة تلك الليلة — رواه مسلم"),
      A("بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ", 3, "رواه أبو داود والترمذي"),
      A("حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", 7, "من قالها كفاه الله ما أهمه"),
      A("رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا", 3, "رواه أبو داود"),
      A("أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", 1, "رواه أحمد"),
      A("أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", 100, "الاستغفار"),
      A("سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", 100, "رواه البخاري ومسلم"),
      A("اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ", 10, "الصلاة على النبي ﷺ")
    ]
  },
  nawm: {
    label:"أذكار النوم",
    note:"يُستحب النوم على طهارة وعلى الشق الأيمن، ويُقرأ ما يلي قبل النوم.",
    items:[
      A("يجمع كفيه ثم ينفث فيهما ويقرأ: ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ و﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾ و﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾، ثم يمسح بهما ما استطاع من جسده، يبدأ برأسه ووجهه وما أقبل من جسده", 3, "رواه البخاري"),
      A("آيَةُ الْكُرْسِيِّ: ﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾ — مَنْ قَرَأَهَا إِذَا أَوَى إِلَى فِرَاشِهِ لَمْ يَزَلْ عَلَيْهِ مِنَ اللَّهِ حَافِظٌ، وَلَا يَقْرَبُهُ شَيْطَانٌ حَتَّى يُصْبِحَ", 1, "رواه البخاري"),
      A("بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ", 1, "متفق عليه"),
      A("اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ", 1, "متفق عليه — ومن مات من ليلته مات على الفطرة"),
      A("سُبْحَانَ اللَّهِ (٣٣) وَالْحَمْدُ لِلَّهِ (٣٣) وَاللَّهُ أَكْبَرُ (٣٤)", 1, "متفق عليه"),
      A("اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", 3, "رواه أبو داود"),
      A("بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", 1, "رواه البخاري"),
      A("الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا، وَكَفَانَا، وَآوَانَا، فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ", 1, "رواه مسلم"),
      A("عند الاستيقاظ: الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", 1, "رواه البخاري")
    ]
  },
  adiya: {
    label:"أدعية",
    note:"أدعية من القرآن الكريم والسنة النبوية، ادعُ بها موقنًا بالإجابة.",
    items:[
      A("﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ﴾", 1, "البقرة: ٢٠١"),
      A("﴿رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ﴾", 1, "آل عمران: ٨"),
      A("﴿رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾", 1, "آل عمران: ١٤٧"),
      A("﴿رَبِّ اشْرَحْ لِي صَدْرِي • وَيَسِّرْ لِي أَمْرِي • وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي • يَفْقَهُوا قَوْلِي﴾", 1, "طه: ٢٥–٢٨"),
      A("﴿رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ﴾", 1, "آل عمران: ٣٨"),
      A("﴿رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ • رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ﴾", 1, "إبراهيم: ٤٠–٤١"),
      A("﴿لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾", 1, "دعوة ذي النون — ما دعا بها مسلم في شيء قط إلا استجاب الله له"),
      A("﴿رَبِّ زِدْنِي عِلْمًا﴾", 1, "طه: ١١٤"),
      A("﴿رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾", 1, "الفرقان: ٧٤"),
      A("اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى", 1, "رواه مسلم"),
      A("اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", 1, "رواه أبو داود"),
      A("اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ", 1, "رواه البخاري"),
      A("اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي", 1, "رواه مسلم"),
      A("اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", 1, "دعاء ليلة القدر — رواه الترمذي"),
      A("اللَّهُمَّ ارْحَمْ وَالِدَيَّ كَمَا رَبَّيَانِي صَغِيرًا، وَاغْفِرْ لَهُمَا وَأَدْخِلْهُمَا فَسِيحَ جَنَّاتِكَ", 1, "دعاء للوالدين"),
      A("اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ، فَإِنَّهُ لَا يَمْلِكُهَا إِلَّا أَنْتَ", 1, "رواه الطبراني")
    ]
  }
};

const HADITH = [
  ["إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: إِلَّا مِنْ صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ","رواه مسلم"],
  ["إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى","متفق عليه"],
  ["مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ","رواه مسلم"],
  ["مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ","رواه الترمذي"],
  ["لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ","متفق عليه"],
  ["الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ","متفق عليه"],
  ["اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ","رواه الترمذي"],
  ["كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ","متفق عليه"],
  ["مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ، وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلَّا عِزًّا","رواه مسلم"],
  ["الطُّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ","رواه مسلم"],
  ["مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ","رواه مسلم"],
  ["تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ","رواه الترمذي"]
];

const TASBIH = [
  {p:"سُبْحَانَ اللَّهِ", g:33},
  {p:"الْحَمْدُ لِلَّهِ", g:33},
  {p:"اللَّهُ أَكْبَرُ", g:34},
  {p:"لَا إِلَهَ إِلَّا اللَّهُ", g:100},
  {p:"أَسْتَغْفِرُ اللَّهَ", g:100},
  {p:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", g:100}
];

/* ---------- storage ---------- */
const today = new Date().toISOString().slice(0,10);
let progress = {};
try{
  const raw = localStorage.getItem("nour-progress");
  const parsed = raw ? JSON.parse(raw) : null;
  if(parsed && parsed.day === today) progress = parsed.data || {};
}catch(e){ progress = {}; }
function save(){
  try{ localStorage.setItem("nour-progress", JSON.stringify({day:today,data:progress})); }catch(e){}
}

/* ---------- render ---------- */
const TABS = [
  ["sabah","أذكار الصباح"],["masaa","أذكار المساء"],["nawm","أذكار النوم"],
  ["adiya","أدعية"],["hadith","أحاديث"],["tasbih","السبحة"],["sadaqa","الصدقة الجارية"]
];
const tablist = document.getElementById("tablist");
const main = document.getElementById("main");

TABS.forEach(([id,label],i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.role="tab"; b.textContent=label;
  b.id="tab-"+id; b.setAttribute("aria-controls","panel-"+id);
  b.setAttribute("aria-selected", i===0 ? "true":"false");
  b.addEventListener("click",()=>select(id));
  tablist.appendChild(b);
});

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function dhikrCard(key,idx,item){
  const id = key+"-"+idx;
  const doneCount = progress[id]||0;
  const left = Math.max(item.c - doneCount,0);
  const el = document.createElement("div");
  el.className = "dhikr"+(left===0?" done":"");
  el.tabIndex = 0; el.setAttribute("role","button");
  el.setAttribute("aria-label","اضغط للعدّ");
  el.innerHTML =
    '<p class="text">'+escapeHtml(item.t)+'</p>'+
    '<div class="meta"><span class="src">'+escapeHtml(item.s)+'</span>'+
    '<span class="count">'+(left===0?"✓ تم":left+" / "+item.c)+'</span></div>';
  const tick = ()=>{
    const cur = progress[id]||0;
    if(cur >= item.c){ progress[id]=0; } else { progress[id]=cur+1; }
    save();
    const now = Math.max(item.c-(progress[id]||0),0);
    el.querySelector(".count").textContent = now===0 ? "✓ تم" : now+" / "+item.c;
    el.classList.toggle("done", now===0);
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
  };
  el.addEventListener("click",tick);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();tick();} });
  return el;
}

function buildAthkar(key){
  const d = DATA[key];
  const frag = document.createDocumentFragment();
  const note = document.createElement("p");
  note.className="section-note"; note.textContent=d.note;
  frag.appendChild(note);
  d.items.forEach((it,i)=>frag.appendChild(dhikrCard(key,i,it)));
  return frag;
}

function buildHadith(){
  const frag=document.createDocumentFragment();
  const note=document.createElement("p");
  note.className="section-note";
  note.textContent="أحاديث جامعة من صحيح السنة، قليلها يكفي لمن عمل به.";
  frag.appendChild(note);
  HADITH.forEach(([t,s])=>{
    const el=document.createElement("article");
    el.className="hadith";
    el.innerHTML='<p class="text">«'+escapeHtml(t)+'»</p><p class="src">'+escapeHtml(s)+'</p>';
    frag.appendChild(el);
  });
  return frag;
}

function buildTasbih(){
  const wrap=document.createElement("div");
  wrap.className="tasbih";
  let mode=0, n=0;
  wrap.innerHTML =
    '<div class="beadwrap"><button class="bead" id="bead" type="button">0</button></div>'+
    '<p class="phrase" id="phrase"></p>'+
    '<p class="section-note" style="border:0;padding:0;text-align:center">اضغط الدائرة للتسبيح</p>'+
    '<div class="btnrow" id="modes"></div>'+
    '<div class="btnrow"><button class="btn" id="reset" type="button">تصفير العدّاد</button></div>';
  const bead=wrap.querySelector("#bead"), phrase=wrap.querySelector("#phrase"),
        modes=wrap.querySelector("#modes");
  TASBIH.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="btn"; b.type="button"; b.textContent=t.p;
    b.setAttribute("aria-pressed", i===0?"true":"false");
    b.addEventListener("click",()=>{ mode=i; n=0; paint(); });
    modes.appendChild(b);
  });
  function paint(){
    const t=TASBIH[mode];
    bead.textContent=n;
    phrase.textContent=t.p+" — الهدف "+t.g;
    [...modes.children].forEach((b,i)=>b.setAttribute("aria-pressed", i===mode?"true":"false"));
  }
  bead.addEventListener("click",()=>{
    n++; paint();
    if(n===TASBIH[mode].g){ toast("تمّ العدد، تقبّل الله"); }
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
  });
  wrap.querySelector("#reset").addEventListener("click",()=>{n=0;paint();});
  paint();
  return wrap;
}

function buildSadaqa(){
  const el=document.createElement("div");
  el.className="prose";
  el.innerHTML =
    '<article class="hadith"><p class="text">«إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: إِلَّا مِنْ صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ»</p><p class="src">رواه مسلم</p></article>'+
    '<h2>ما هي الصدقة الجارية</h2>'+
    '<p>هي كل عمل يبقى نفعه للناس بعد انقطاع عملك، فيجري أجره عليك ما دام الناس ينتفعون به. وأوسع أبوابها العلم النافع: كلمة تُعلِّمها، أو ذِكر تدلّ عليه، أو صفحة كهذه يقرؤها غيرك فيذكر الله بسببك.</p>'+
    '<h2>أبواب تصلح لك اليوم</h2>'+
    '<p>سقيا الماء وحفر بئر، والمساهمة في بناء مسجد أو ترميمه، وطباعة المصاحف وكتب العلم وتوزيعها، وكفالة يتيم أو طالب علم، وغرس شجرة يأكل منها إنسان أو طائر، والتبرع لعلاج مريض، وتعليم إنسان سورة أو دعاءً يردده كل يوم.</p>'+
    '<h2>كيف تجعل هذه الصفحة صدقة جارية</h2>'+
    '<p>انشر رابطها لأهلك وأصحابك ومجموعاتك. كل من قرأ منها ذكرًا أو دعاءً فلك مثل أجره بإذن الله، لأن الدالّ على الخير كفاعله. واحرص أن تنوي بها وجه الله وحده، فإنما الأعمال بالنيات.</p>'+
    '<h2>دعاء</h2>'+
    '<p>اللهم اجعل هذا العمل خالصًا لوجهك، وتقبّله، واجعله في ميزان حسنات كل من كتبه ونشره وقرأه، واغفر لنا ولوالدينا وللمسلمين أجمعين.</p>'+
    '<footer><p>ذكِّر بها غيرك — الدالّ على الخير كفاعله.</p>'+
    '<button class="share" id="share" type="button">انسخ الرابط وشاركه</button></footer>';
  el.querySelector("#share").addEventListener("click",async()=>{
    const url=location.href, title="نور الذكر — أذكار وأدعية";
    try{
      if(navigator.share){ await navigator.share({title,url}); return; }
      await navigator.clipboard.writeText(url);
      toast("تم نسخ الرابط");
    }catch(e){ toast("انسخ الرابط من شريط المتصفح"); }
  });
  return el;
}

function panelContent(id){
  if(DATA[id]) return buildAthkar(id);
  if(id==="hadith") return buildHadith();
  if(id==="tasbih") return buildTasbih();
  return buildSadaqa();
}

const panels={};
TABS.forEach(([id],i)=>{
  const s=document.createElement("section");
  s.id="panel-"+id; s.setAttribute("role","tabpanel");
  s.setAttribute("aria-labelledby","tab-"+id);
  if(i!==0) s.hidden=true;
  s.appendChild(panelContent(id));
  main.appendChild(s);
  panels[id]=s;
});

function select(id){
  TABS.forEach(([t])=>{
    panels[t].hidden = t!==id;
    document.getElementById("tab-"+t).setAttribute("aria-selected", t===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

/* open on evening adhkar after Asr-ish hours */
const h=new Date().getHours();
if(h>=15 && h<20) select("masaa");
else if(h>=20 || h<4) select("nawm");

let toastTimer;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
