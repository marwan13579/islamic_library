  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){

    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;

  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 18px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(2rem,7vw,2.8rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:42ch;margin:.4rem auto 0}

  .search{display:block;width:100%;padding:12px 18px;border-radius:999px;border:1px solid var(--line);

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .fbtn{font-family:"Cairo";font-weight:600;font-size:.78rem;padding:6px 13px;border-radius:999px;

  .fbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .count{font-size:.82rem;color:var(--ink-soft);margin-bottom:10px}
  .results{display:flex;flex-direction:column;gap:10px}
  .r{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .r .cat{display:inline-block;font-size:.7rem;background:var(--paper-2);color:var(--gold);padding:2px 10px;border-radius:999px;margin-bottom:8px}
  .r .text{font-family:"Amiri",serif;font-size:1.1rem;line-height:1.95;margin:0}
  .r .src{font-size:.78rem;color:var(--ink-soft);margin-top:8px}
  .r a{display:inline-block;margin-top:8px;font-size:.78rem;color:var(--gold);text-decoration:none}
  .r a.alt{margin-inline-start:10px;color:var(--muted)}
  .empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:40px 0}
  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}

const CATS = [...new Set(INDEX.map(r=>r.cat))];
const TYPES = [
  {id:"", label:"الكل"},
  {id:"fatwa", label:"الفتاوى", page:"37-fatwa.html"},
  {id:"tafsir", label:"التفسير", page:"35-tafsir.html"},
  {id:"hisn", label:"حصن المسلم", page:"36-hisn.html"},
  {id:"khutbahs", label:"الخطب", page:"38-khutbah.html"},
  {id:"history", label:"التاريخ", page:"39-tarikh.html"},
  {id:"quiz", label:"الاختبارات", page:"41-quiz.html"},
];
let activeCat="all";
let activeType="";
let seq=0;

function renderFilters(){
  const box=document.getElementById("filters");
  box.innerHTML="";
  for(const t of TYPES){
    const b=document.createElement("button");
    b.className="fbtn"; b.type="button"; b.textContent=t.label;
    b.setAttribute("aria-pressed", t.id===activeType?"true":"false");
    b.addEventListener("click",()=>{ activeType=t.id; renderFilters(); render(); });
    box.appendChild(b);
  }
  for(const c of CATS){
    const b=document.createElement("button");
    b.className="fbtn"; b.type="button"; b.textContent=c;
    b.setAttribute("aria-pressed", c===activeCat?"true":"false");
    b.addEventListener("click",()=>{ activeCat = activeCat===c?"all":c; renderFilters(); render(); });
    box.appendChild(b);
  }
}

/** The collection page the item sits in, deep-linked when it can be. */
function contextLink(hit, type){
  if(!type || !type.page) return null;
  if(hit.type==="tafsir" && Array.isArray(hit.extra) && hit.extra[0]){
    return `${type.page}?s=${encodeURIComponent(hit.extra[0])}`;
  }
  if(hit.type==="hisn"){
    const bab=/^hisn-(\d+)$/.exec(hit.id);
    if(bab) return `${type.page}?no=${encodeURIComponent(bab[1])}`;
  }
  return type.page;
}

/** نتيجة واحدة من فهرس المكتبة — العنوان يحمل وسم التظليل. */
function libraryRow(hit){
  const type = TYPES.find(t=>t.id===hit.type);
  const href = `reader.html?type=${encodeURIComponent(hit.type)}&id=${encodeURIComponent(hit.id)}`;
  const where = hit.extra && Array.isArray(hit.extra)
    ? (hit.type==="tafsir" ? `سورة ${hit.extra[0]} · الآية ${hit.extra[1]}` : "")
    : "";
  return {
    cat: type ? type.label : hit.type,
    text: hit.title,
    src: [hit.summary, where, hit.dateText].filter(Boolean).join(" · "),
    link: href,
    linkLabel: "فتح",
    /* رابط ثانٍ إلى صفحة المجموعة نفسها، فكان حقل `page` معلَنًا ولا
       يُقرأ. والقارئ الدقيق يبقى الأول، فلم يتغيّر سلوك النتيجة. */
    alternate: contextLink(hit, type),
  };
}

async function render(){
  const q=document.getElementById("search").value.trim();
  const box=document.getElementById("results");
  const empty=document.getElementById("empty");
  const countEl=document.getElementById("count");
  const mine = ++seq;

  if(!q && activeType==="" && activeCat==="all"){
    box.innerHTML=""; empty.hidden=false; countEl.textContent="";
    return;
  }

  /* الذِّكر المختارة من أدوات المكتبة —Index صغير ثابت. */
  let curated = INDEX.filter(r=> activeCat==="all" || r.cat===activeCat);
  if(q) curated = curated.filter(r=> normalizeAr(r.text+r.src+r.cat).includes(normalizeAr(q)));

  let rows = curated.map(r=>r);
  let total = curated.length;

  /* وفوقها فهرس المكتبة الكبير. */
  if(q || activeType){
    box.innerHTML='<p class="empty">جارٍ البحث…</p>';
    let hits=[];
    let grand=0;
    let truncated=false;
    try{
      const res=await search(q,{limit:40,type:activeType||null});
      if(mine!==seq) return;
      hits=res.results; grand=res.total; truncated=Boolean(res.more);
    }catch(e){
      if(mine!==seq) return;
    }
    rows = hits.map(libraryRow).concat(rows);
    total = grand + curated.length;
  }

  if(mine!==seq) return;
  box.innerHTML="";
  if(!rows.length){ box.innerHTML='<p class="empty">لا نتائج مطابقة.</p>'; }
  rows.forEach(r=>{
    const el=document.createElement("div");
    el.className="r";
    el.innerHTML =
      '<span class="cat">'+escapeHtml(r.cat)+'</span>'+
      '<p class="text">'+marked(r.text)+'</p>'+
      (r.src?'<p class="src">'+escapeHtml(r.src)+'</p>':'')+
      '<a href="'+escapeHtml(r.link)+'">فتح في '+escapeHtml(r.linkLabel)+' ↗</a>'+
      (r.alternate?'<a class="alt" href="'+escapeHtml(r.alternate)+'">في صفحة '+escapeHtml(r.cat)+' ↗</a>':'');
    box.appendChild(el);
  });
  empty.hidden=true;
  /* الفهرس يقرأ أوّل ١٦٠ مرشّحًا، فما زاد لا يُعلم، فيُقال «أكثر من». */
  countEl.textContent = (truncated?"أكثر من ":"") + total + " نتيجة";
}

/** يحوّل وسم التظليل من lib/search إلى <mark>. */
function marked(value){
  return escapeHtml(String(value))
    .replace(/\[\[H\]\]/g,"<mark>")
    .replace(/\[\[\/H\]\]/g,"</mark>");
}

renderFilters();
let timer=0;
document.getElementById("search").addEventListener("input",()=>{
  clearTimeout(timer);
  timer=setTimeout(render,260);
});
render();
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
