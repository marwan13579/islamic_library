<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="0; url=./">
<title data-i18n="tools.بحث شامل في المكتبة">بحث شامل في المكتبة</title>
<style>
@media (prefers-color-scheme: dark) {
  body { background: #0C201C; color: #EFE3C9; }
}
</style>
  <style>
  .langbar{display:flex;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}
  .langbtn{font-family:"Cairo";font-weight:600;font-size:.85rem;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;
    color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:.2s}
  .langbtn:hover{background:var(--paper-2);border-color:var(--gold)}
  .langmenu{position:absolute;top:calc(100% + 4px);right:0;background:var(--card);
    border:1px solid var(--line);border-radius:10px;min-width:200px;max-height:320px;
    overflow-y:auto;z-index:10000;padding:6px;box-shadow:0 4px 20px rgba(0,0,0,.15);
    display:none}
  .langmenu.open{display:block}
  .langmenu input{width:100%;padding:8px 10px;margin-bottom:6px;border:1px solid var(--line);
    border-radius:6px;background:var(--card);color:var(--ink);font-family:inherit;font-size:.85rem}
  .lang-option{display:flex;align-items:center;gap:8px;width:100%;text-align:inherit;
    background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:6px;
    cursor:pointer;font-size:.85rem;text-decoration:none}
  .lang-option:hover{background:var(--paper-2)}
  .lang-option[aria-current="true"]{color:var(--gold);font-weight:700}
  .lang-flag{font-size:1.1rem}
  .lang-native{font-weight:600}
  .lang-dir{font-size:.75rem;opacity:.5}
  </style>
</head>
<body>
<p>جارٍ التوجيه إلى الصفحة الرئيسية…</p>
<p><a href="./index.html">إن لم يُنتقلك المتصفح تلقائيًّا، اضغط هنا.</a></p>
<script>window.location.replace("./");</script>
</body>
</html>
