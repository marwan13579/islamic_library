<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<link rel="stylesheet" href="engage.css">
<script src="engage.js" defer></script>
<script src="notify-boot.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام حياة المسلم</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0; --green:#2F6B4F; --green-soft:#DCEAE0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28; --green:#5FA787; --green-soft:#173A30;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28; --green:#5FA787; --green-soft:#173A30;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 64px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(1.9rem,7vw,2.7rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:40ch;margin:.4rem auto 0}

  .progressbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0;text-align:center}
  .progressbar .n{font-family:"Amiri",serif;font-size:1.8rem;color:var(--green);margin:0}
  .progressbar .track{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin-top:10px}
  .progressbar .track i{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .3s ease}
  .streakrow{display:flex;gap:10px;justify-content:center;margin:14px 0 4px}
  .streakstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;min-width:80px}
  .streakstat b{display:block;font-family:"Amiri",serif;color:var(--gold);font-size:1.15rem}
  .streakstat span{font-size:.7rem;color:var(--ink-soft)}

  .prayerblock{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .prayerblock.complete{border-color:var(--green)}
  .phead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .phead .em{font-size:1.6rem}
  .phead .name{font-family:"Amiri",serif;font-size:1.3rem;flex:1}
  .phead .ptime{font-size:.75rem;color:var(--ink-soft)}

  .step{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
  .step:first-of-type{border-top:0}
  .schk{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold-soft);
    display:grid;place-items:center;flex-shrink:0;cursor:pointer;font-size:.85rem;color:transparent;background:none}
  .schk.on{background:var(--green);border-color:var(--green);color:#fff}
  .slabel{flex:1;font-size:.9rem;cursor:pointer}
  .slabel.on{opacity:.55;text-decoration:line-through}
  .slink{font-size:.78rem;color:var(--gold);text-decoration:none;background:var(--paper-2);padding:5px 12px;border-radius:999px;white-space:nowrap}

  .arrow{color:var(--gold-soft);font-size:.8rem}
  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
  .resetbtn{display:block;margin:20px auto 0;background:none;border:1px solid var(--line);color:var(--ink-soft);
    padding:8px 18px;border-radius:999px;cursor:pointer;font-family:"Cairo";font-size:.82rem}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="wrap">
<header>
  <h1>نظام حياة المسلم</h1>
  <p>يومك كله عبادة مترابطة — كل صلاة معها ذكرها وورد قرآنها، بدل أدوات متفرقة.</p>
</header>

<div class="progressbar">
  <p class="n" id="progressText">0 / 0</p>
  <p style="margin:0;font-size:.82rem;color:var(--ink-soft)">خطوة أنجزتها اليوم</p>
  <div class="track"><i id="progressFill" style="width:0%"></i></div>
</div>
<div class="streakrow">
  <div class="streakstat"><b id="stStreak">0</b><span>يوم متتالي كامل</span></div>
  <div class="streakstat"><b id="stToday">0</b><span>٪ اليوم</span></div>
</div>

<div id="prayers"></div>

<button class="resetbtn" id="resetBtn" type="button">تصفير اليوم</button>

<footer>إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا</footer>
</div>

<script>
const PRAYERS = [
  {id:"fajr", emoji:"🌅", name:"الفجر", time:"من الفجر إلى الشروق",
   steps:[
     ["الصلاة","4-salah.html"],
     ["أذكار الصباح","25-azkar-shamila.html#sabah"],
     ["قرآن (ورد أو حفظ)","17-wird.html"]
   ]},
  {id:"dhuhr", emoji:"☀️", name:"الظهر", time:"من الزوال إلى العصر",
   steps:[
     ["الصلاة","4-salah.html"],
     ["ذكر بعد الصلاة","25-azkar-shamila.html#salah_ba3d"]
   ]},
  {id:"asr", emoji:"🌇", name:"العصر", time:"من انتهاء الظهر إلى اصفرار الشمس",
   steps:[
     ["الصلاة","4-salah.html"],
     ["ورد القرآن","17-wird.html"]
   ]},
  {id:"maghrib", emoji:"🌆", name:"المغرب", time:"من الغروب إلى مغيب الشفق",
   steps:[
     ["الصلاة","4-salah.html"],
     ["أذكار المساء","25-azkar-shamila.html#masaa"]
   ]},
  {id:"isha", emoji:"🌙", name:"العشاء", time:"من مغيب الشفق إلى منتصف الليل",
   steps:[
     ["الصلاة","4-salah.html"],
     ["قرآن","2-mushaf.html"],
     ["أذكار النوم","25-azkar-shamila.html#nawm"]
   ]}
];

function resolveLink(href){ return href; }

const today = new Date().toISOString().slice(0,10);
let state={};
try{ state = JSON.parse(localStorage.getItem("daily-system-state")||"{}"); }catch(e){ state={}; }
let streak = Number(localStorage.getItem("daily-system-streak")||0);
let lastFullDay = localStorage.getItem("daily-system-lastfull")||"";

function save(){
  try{
    localStorage.setItem("daily-system-state", JSON.stringify(state));
    localStorage.setItem("daily-system-streak", String(streak));
    localStorage.setItem("daily-system-lastfull", lastFullDay);
  }catch(e){}
}
function stepKey(pid,si){ return today+"|"+pid+"|"+si; }

function totalSteps(){ return PRAYERS.reduce((s,p)=>s+p.steps.length,0); }
function doneSteps(){
  let n=0;
  PRAYERS.forEach(p=>p.steps.forEach((s,i)=>{ if(state[stepKey(p.id,i)]) n++; }));
  return n;
}
function prayerComplete(p){ return p.steps.every((s,i)=>state[stepKey(p.id,i)]); }

function renderPrayers(){
  const box=document.getElementById("prayers");
  box.innerHTML="";
  PRAYERS.forEach(p=>{
    const complete = prayerComplete(p);
    const block=document.createElement("div");
    block.className="prayerblock"+(complete?" complete":"");
    let html = '<div class="phead"><span class="em">'+p.emoji+'</span><span class="name">'+p.name+'</span><span class="ptime">'+p.time+'</span></div>';
    p.steps.forEach(([label,href],i)=>{
      const key=stepKey(p.id,i);
      const on=!!state[key];
      html += '<div class="step">'+
        '<button class="schk'+(on?" on":"")+'" data-p="'+p.id+'" data-i="'+i+'">✓</button>'+
        '<span class="slabel'+(on?" on":"")+'" data-p="'+p.id+'" data-i="'+i+'">'+label+'</span>'+
        '<a class="slink" href="'+resolveLink(href)+'" target="_blank" rel="noopener">فتح ↗</a>'+
        '</div>';
    });
    block.innerHTML=html;
    box.appendChild(block);
  });

  box.querySelectorAll(".schk, .slabel").forEach(el=>{
    el.addEventListener("click",()=>{
      const pid=el.dataset.p, i=el.dataset.i;
      const key=stepKey(pid,i);
      state[key]=!state[key];
      save();
      renderAll();
    });
  });
}

function checkStreak(){
  const allDone = PRAYERS.every(prayerComplete);
  if(allDone && lastFullDay!==today){
    const diff = lastFullDay ? (new Date(today)-new Date(lastFullDay))/86400000 : null;
    streak = (diff===1) ? streak+1 : 1;
    lastFullDay = today;
    save();
  }
}

function renderProgress(){
  const total=totalSteps(), done=doneSteps();
  document.getElementById("progressText").textContent=done+" / "+total;
  document.getElementById("progressFill").style.width=(total?Math.round(done/total*100):0)+"%";
  document.getElementById("stStreak").textContent=streak;
  document.getElementById("stToday").textContent=total?Math.round(done/total*100):0;
}

function renderAll(){
  checkStreak();
  renderPrayers();
  renderProgress();
}

document.getElementById("resetBtn").addEventListener("click",()=>{
  PRAYERS.forEach(p=>p.steps.forEach((s,i)=>{ delete state[stepKey(p.id,i)]; }));
  save(); renderAll();
});

renderAll();
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
<script type="module">
  import { createSearchModal } from "./src/components/search-modal.js";
  createSearchModal();
</script>
</body>
</html>
