<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;

    --sepia-paper:#F4E9D3; --sepia-ink:#3A2E1F;

  header p{color:var(--ink-soft);font-size:.86rem;max-width:46ch;margin:.4rem auto 0}

  .tab{font-family:"Cairo";font-weight:600;font-size:.82rem;background:none;border:0;color:var(--ink-soft);

async function loadOptionalReferences(){
  if(!navigator.onLine) return;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);
  try{
    const [translationResponse,tafsirResponse]=await Promise.all([
      fetch("https://api.alquran.cloud/v1/quran/en.sahih",{signal:controller.signal}),
      fetch("https://api.alquran.cloud/v1/quran/ar.muyassar",{signal:controller.signal})
    ]);
    if(!translationResponse.ok||!tafsirResponse.ok) throw new Error("reference data unavailable");
    const [translationJson,tafsirJson]=await Promise.all([translationResponse.json(),tafsirResponse.json()]);
    TRANSLATION={};
    translationJson.data.surahs.forEach(s=>{ TRANSLATION[s.number]=s.ayahs.map(a=>a.text); });
    TAFSIR={};
    tafsirJson.data.surahs.forEach(s=>{ TAFSIR[s.number]=s.ayahs.map(a=>a.text); });
    document.getElementById("statusBar").textContent="✅ النص العربي كامل محفوظ محليًا؛ الترجمة والتفسير متاحان أثناء الاتصال.";
  }catch(error){
    document.getElementById("statusBar").textContent="📖 النص العربي كامل متاح دون اتصال؛ الترجمة والتفسير يحتاجان اتصالًا.";
  }finally{
    clearTimeout(timeout);
  }
}

async function loadLiveData(){
  try{
    const localResponse=await fetch("vendor/quran-arabic.json");
    if(!localResponse.ok) throw new Error("local Quran corpus unavailable");
    const corpus=await localResponse.json();
    if(!Array.isArray(corpus.surahs)||corpus.surahs.length!==SURAH_META.length) throw new Error("invalid local Quran corpus");
    let totalAyahs=0;
    corpus.surahs.forEach((surah,index)=>{
      if(surah.number!==index+1||surah.ayahCount!==SURAH_META[index][2]||!Array.isArray(surah.ayahs)||surah.ayahs.length!==surah.ayahCount) throw new Error("invalid local surah data");
      surah.ayahs.forEach((ayah,ayahIndex)=>{
        if(ayah.n!==ayahIndex+1||!ayah.text||!Number.isInteger(ayah.global)||!Number.isInteger(ayah.juz)||!Number.isInteger(ayah.page)) throw new Error("invalid local ayah data");
      });
      totalAyahs+=surah.ayahs.length;
    });
    if(totalAyahs!==6236) throw new Error("invalid local Quran ayah count");
    QURAN={};
    corpus.surahs.forEach(surah=>{QURAN[surah.number]={name:surah.name,englishName:surah.englishName,ayahs:surah.ayahs};});
    dataMode="offline";
    document.getElementById("statusBar").className="statusbar";
    document.getElementById("statusBar").textContent="📖 المصحف العربي كامل متاح دون اتصال — النص العثماني، ١١٤ سورة.";
    renderAll();
    loadOptionalReferences();
    return;
  }catch(localError){}

  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 8000);
    const [qRes] = await Promise.all([
      fetch("https://api.alquran.cloud/v1/quran/quran-uthmani", {signal:controller.signal})
    ]);
    clearTimeout(timeout);
    if(!qRes.ok) throw new Error("bad response");
    const qJson = await qRes.json();
    QURAN = {};
    qJson.data.surahs.forEach(s=>{
      QURAN[s.number] = { name: s.name, ayahs: s.ayahs.map(a=>({n:a.numberInSurah, text:a.text, global:a.number, juz:a.juz, page:a.page, hizb:a.hizbQuarter})) };
    });
    dataMode="live";
    document.getElementById("statusBar").textContent = "✅ القرآن الكريم كامل — متصل بمصدر موثّق";
    setTimeout(()=>{ document.getElementById("statusBar").style.display="none"; }, 3000);
    loadOptionalReferences();
  }catch(err){
    dataMode="fallback";
    QURAN = {};
    Object.keys(FALLBACK).forEach(k=>{
      QURAN[k] = { name: FALLBACK[k].name, ayahs: FALLBACK[k].ayahs.map((t,i)=>({n:i+1,text:t})) };
    });
    document.getElementById("statusBar").className="statusbar err";
    document.getElementById("statusBar").innerHTML =
      "⚠️ تعذّر تحميل ملف المصحف المحلي أو الوصول إلى المصدر الشبكي. المتاح حاليًا سبع سور قصيرة للتحقق، وقد تكون هذه النسخة غير مهيأة. "+
      "تواصل مع مسؤول التطبيق لإعادة تشغيل npm run build وnpm run download:quran.";
    renderAll();
  }
}

/* ================= helpers ================= */
const AR_NUM = n => n.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const QURAN_DIACRITICS = /[ً-ْٰـۖ-ۭ]/g;
/**
 * يطبّع النصَّ للبحث داخل المصحف: حذف التشكيل، وتوحيد الهمزات والتاء
 * المربوطة والألف المقصورة، والأرقام الهندية بأرقامها. والألفُ الخنجرية
 * (ٰ) ألفٌ لا حرفُ حركة، فتُحوَّل ألفًا وإلّا صارت «العالمين» «العلمين».
 * @param {string} value
 * @returns {string}
 */
function normalizeQuran(value){
  return String(value??"")
    .replace(QURAN_DIACRITICS,"")
    .replace(/[أإآٱٲٳ]/g,"ا")
    .replace(/[ٰ]/g,"ا")
    .replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))
    .replace(/[^\\p{L}\\p{N}\\s]/gu," ")
    .replace(/\\s+/g," ").trim();
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}

function ayahCard(surahNum, a){
  const el=document.createElement("div");
  el.className="ayah";
  const bmKey=surahNum+":"+a.n;
  const isBm=!!bookmarks[bmKey];
  const hasNote=!!(notes[bmKey] && notes[bmKey].trim());
  el.innerHTML =
     '<p class="arabic">'+escapeHtml(a.text.replace(/[\u06DD].*$/, ""))+' <span class="num">'+AR_NUM(a.n)+'</span></p>'+
    '<div class="translation" id="tr-'+bmKey+'"></div>'+
    '<div class="tafsir" id="tf-'+bmKey+'"></div>'+
    '<textarea class="noteArea" id="nt-'+bmKey+'" placeholder="ملاحظتك على هذه الآية..."></textarea>'+
    '<div class="actrow">'+
    '<button class="actbtn playBtn" data-g="'+(a.global||"")+'">▶ استماع</button>'+
    '<button class="actbtn repeatBtn" data-g="'+(a.global||"")+'">🔁 تكرار</button>'+
    '<button class="actbtn bmBtn'+(isBm?" on":"")+'" data-k="'+bmKey+'">'+(isBm?"★ محفوظة":"☆ حفظ علامة")+'</button>'+
    '<button class="actbtn trBtn" data-k="'+bmKey+'" data-s="'+surahNum+'" data-a="'+a.n+'">🌐 ترجمة</button>'+
    '<button class="actbtn tfBtn" data-k="'+bmKey+'" data-s="'+surahNum+'" data-a="'+a.n+'">💡 تفسير</button>'+
    '<button class="actbtn ntBtn'+(hasNote?" on":"")+'" data-k="'+bmKey+'">📝 ملاحظة</button>'+
    '<button class="actbtn shareBtn" data-s="'+surahNum+'" data-n="'+a.n+'">↗ مشاركة</button>'+
    '</div>';
  el.querySelector(".noteArea").value=String(notes[bmKey]??"");

  el.querySelector(".playBtn").addEventListener("click",e=>{
    const g=e.target.dataset.g;
    if(!g||!navigator.onLine){ alert("الصوت يحتاج اتصالًا بالإنترنت؛ نص الآيات محفوظ كاملًا على هذا الجهاز."); return; }
    playAyah(g);
  });
  let repeatCount=0, repeatMax=0;
  el.querySelector(".repeatBtn").addEventListener("click",e=>{
    const g=e.target.dataset.g;
    if(!g){ alert("التكرار الصوتي متاح فقط عند الاتصال بمصدر القرآن الكامل."); return; }
    const n=parseInt(prompt("كرر الآية كم مرة؟","3"))||3;
    let count=0;
    function loop(){ if(count>=n) return; count++; playAyah(g, loop); }
    loop();
  });
  el.querySelector(".bmBtn").addEventListener("click",e=>{
    const k=e.target.dataset.k;
    bookmarks[k] = !bookmarks[k]; saveBookmarks();
    e.target.classList.toggle("on");
    e.target.textContent = bookmarks[k] ? "★ محفوظة" : "☆ حفظ علامة";
  });
  el.querySelector(".trBtn").addEventListener("click",e=>{
    const k=e.target.dataset.k, s=e.target.dataset.s, aN=parseInt(e.target.dataset.a);
    const box=document.getElementById("tr-"+k);
    if(TRANSLATION && TRANSLATION[s]){
      box.textContent = TRANSLATION[s][aN-1] || "";
      box.classList.toggle("show");
    } else {
      alert("الترجمة تحتاج اتصالًا بمصدر البيانات الكامل.");
    }
  });
  el.querySelector(".tfBtn").addEventListener("click",e=>{
    const k=e.target.dataset.k, s=e.target.dataset.s, aN=parseInt(e.target.dataset.a);
    const box=document.getElementById("tf-"+k);
    if(TAFSIR && TAFSIR[s]){
      box.textContent = TAFSIR[s][aN-1] || "";
      box.classList.toggle("show");
    } else {
      alert("التفسير يحتاج اتصالًا بمصدر البيانات الكامل.");
    }
  });
  el.querySelector(".ntBtn").addEventListener("click",e=>{
    document.getElementById("nt-"+e.target.dataset.k).classList.toggle("show");
  });
  el.querySelector(".noteArea").addEventListener("input",e=>{
    notes[bmKey]=e.target.value; saveNotes();
  });
  el.querySelector(".shareBtn").addEventListener("click",async e=>{
    const s=e.target.dataset.s, n=e.target.dataset.n;
    const meta=SURAH_META.find(x=>x[0]==s);
    const text=a.text+"\n\n— سورة "+(meta?meta[1]:s)+", آية "+n;
    try{
      if(navigator.share){ await navigator.share({text}); return; }
      await navigator.clipboard.writeText(text);
      alert("تم نسخ الآية للمشاركة");
    }catch(err){}
  });
  return el;
}

let seqToken=0;
function stopSequence(){
  seqToken++;
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  document.querySelectorAll(".ayah.playing").forEach(x=>x.classList.remove("playing"));
}
function playSequence(surahNum, startIndex){
  const s=QURAN[surahNum];
  if(!navigator.onLine||!s||!s.ayahs[0]||!s.ayahs[0].global){
    alert("التشغيل الصوتي يحتاج اتصالًا بالإنترنت؛ النص الكامل متاح دون اتصال.");
    return;
  }
  stopSequence();
  const myToken=++seqToken;
  let i=startIndex||0;
  function next(){
    if(myToken!==seqToken || i>=s.ayahs.length){ stopSequence(); return; }
    const a=s.ayahs[i];
    document.querySelectorAll(".ayah.playing").forEach(x=>x.classList.remove("playing"));
    const card=document.getElementById("ayah-"+surahNum+"-"+a.n);
    if(card){ card.classList.add("playing"); card.scrollIntoView({behavior:"smooth", block:"center"}); }
    playAyah(a.global, ()=>{ i++; next(); });
  }
  next();
}

function openSurah(num, scrollToAyah){
  stopSequence();
  const s=QURAN[num];
  const main=document.getElementById("main");
  main.innerHTML="";
  const head=document.createElement("div");
  head.className="readerhead";
  const meta=SURAH_META.find(x=>x[0]===num);
  head.innerHTML='<button class="backbtn" id="backToList">‹ رجوع</button><span class="title">سورة '+(meta?meta[1]:s.name)+'</span>'+
    '<span><a class="backbtn" id="gharibSurah" href="43-siraj.html?s='+num+'">غريب السورة</a> '+
    '<button class="backbtn" id="playAll">▶ تشغيل السورة</button> <button class="backbtn" id="stopAll">⏹</button></span>';
  main.appendChild(head);
  document.getElementById("backToList").addEventListener("click",()=>{ stopSequence(); select(currentTabId); });
  document.getElementById("playAll").addEventListener("click",()=>playSequence(num,0));
  document.getElementById("stopAll").addEventListener("click",stopSequence);

  s.ayahs.forEach(a=>{
    const card=ayahCard(num, a);
    card.id="ayah-"+num+"-"+a.n;
    main.appendChild(card);
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting) saveLastPos(num, a.n); });
    },{threshold:0.6});
    obs.observe(card);
  });

  if(scrollToAyah){
    setTimeout(()=>{
      const t=document.getElementById("ayah-"+num+"-"+scrollToAyah);
      if(t) t.scrollIntoView({behavior:"smooth", block:"center"});
    },100);
  } else {
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function buildSearch(){
  const frag=document.createElement("div");
  const inp=document.createElement("input");
  inp.className="search"; inp.type="search"; inp.placeholder="ابحث في نص القرآن...";
  frag.appendChild(inp);
  const resultsBox=document.createElement("div");
  frag.appendChild(resultsBox);
  let debounce=0;
  inp.addEventListener("input",()=>{
    const q=inp.value.trim();
    resultsBox.innerHTML="";
    if(!q || q.length<2) return;
    if(!QURAN){ return; }
    // البحث هنا كان `a.text.includes(q)` على النصّ المشكول، فلا يطابقه إلا ما
    // كُتب بالحروف نفسها لتشكيله، والاستعلام بلا تشكيل لا يُطابق ولا آيةً ولا
    // واحدة. صار يُ.normalise السائل والمبحوث عنه معًا، ويقبل بادئة الكلمة
    // وخطأً بحرف، ويلغي الحركات، فيصير البحث في المصحف كما يُكتب فيُم.
    clearTimeout(debounce);
    debounce=setTimeout(()=>renderQuranHits(q, resultsBox), 220);
  });
  return frag;
}

/**
 * يعرض آيات المصحف المطابقة للاستعلام، بتطبيعٍ يوسّع المطابقة، ويجد بالرقم
 * والاسم معًا: «البقرة ٢٥٥» و«الحمد لله» و«ولا يوده حفظهما».
 * @param {string} q استعلامٌ خام
 * @param {HTMLElement} resultsBox
 */
function renderQuranHits(q, resultsBox){
  const needle=normalizeQuran(q);
  if(!needle){ return; }
  const wanted=String(needle).match(/ (\d{1,4})$/);
  const surahWords=needle.replace(/ (\d{1,4})$/,"").split(" ").filter(w=>w.length>2);
  let found=0;
  Object.keys(QURAN).forEach(sNum=>{
    if(found>=50) return;
    const meta=SURAH_META.find(x=>x[0]==sNum);
    QURAN[sNum].ayahs.forEach(a=>{
      if(found>=50) return;
      const text=normalizeQuran(a.text);
      if(!text) return;
      const terms=needle.split(" ").filter(Boolean);
      if(!terms.every(term=>text.includes(term))) return;
      const byNumber=wanted && Number(wanted[1])===a.n;
      const namesSurah=surahWords.some(w=>normalizeQuran(meta?meta[1]:"")===w);
      if(wanted && !byNumber && !namesSurah) return;
      found++;
      const card=document.createElement("div");
      card.className="ayah";
      card.style.cursor="pointer";
      card.innerHTML='<p class="arabic" style="font-size:1.2rem">'+escapeHtml(a.text)+'</p><p style="font-size:.78rem;color:var(--ink-soft);margin-top:8px">سورة '+(meta?meta[1]:sNum)+' — آية '+AR_NUM(a.n)+'</p>';
      card.addEventListener("click",()=>openSurah(parseInt(sNum), a.n));
      resultsBox.appendChild(card);
    });
  });
  if(found===0){
    resultsBox.innerHTML='<p class="note">لا نتائج مطابقة'+(dataMode==="fallback"?" (البحث محدود بالسور الاحتياطية المتاحة)":"")+'</p>';
  }
}

function buildBookmarks(){
  const frag=document.createElement("div");
  const keys=Object.keys(bookmarks).filter(k=>bookmarks[k]);
  if(keys.length===0){
    const n=document.createElement("p"); n.className="note"; n.textContent="لا توجد علامات مرجعية بعد.";
    frag.appendChild(n);
    return frag;
  }
  keys.forEach(k=>{
    const [s,n]=k.split(":").map(Number);
    if(!QURAN[s]) return;
    const a=QURAN[s].ayahs.find(x=>x.n===n);
    if(!a) return;
    const meta=SURAH_META.find(x=>x[0]===s);
    const card=document.createElement("div");
    card.className="ayah"; card.style.cursor="pointer";
    card.innerHTML='<p class="arabic" style="font-size:1.2rem">'+escapeHtml(a.text)+'</p><p style="font-size:.78rem;color:var(--ink-soft);margin-top:8px">★ سورة '+(meta?meta[1]:s)+' — آية '+AR_NUM(n)+'</p>';
    card.addEventListener("click",()=>openSurah(s,n));
    frag.appendChild(card);
  });
  return frag;
}

}

/* ================= deep link: ?s=سورة&a=آية ================= */
/**
 * يفتح موضعًا بعينه من رابط البحث: `?s=2&a=255` يفتح سورة البقرة عند الآية
 * ٢٥٥. كانت هذه الروابط ميتة، لأنّ الصفحة لم تقرأ المعاملات أصلًا، فكلُّ آيةٍ
 * أو تفسيرٍ في نتائج البحث كان يفتح الصفحة على أوّل تبويب.
 * @returns {void}
 */
function openFromUrl(){
  let params;
  try{ params=new URLSearchParams(location.search); }catch(e){ return; }
  const surah=Number(params.get("s"));
  if(!surah||!QURAN[surah]) return;
  const ayah=Number(params.get("a"))||0;
  if(params.has("a")) history.replaceState(null,"",location.pathname+location.hash);
  openSurah(surah, ayah||undefined);
}
