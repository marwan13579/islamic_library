name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:js
      - run: npm run check:icons
      - run: npm run check:order
      - run: npm run check:content
      - run: npm run check:noor
      - run: npm run check:corpora
      - run: npm run verify:content
      - run: npm run review:ci

  browser:
    # فحص زمن التشغيل في متصفح حقيقي. لا يحجب النشر: continue-on-error
    # حتى لا يوقف إفلاس عابرٌ تحديثًا لموقع يعمل، وتبقى النتيجة في التقرير.
    name: Browser checks (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve Chromium path
        run: echo "CHROMIUM_PATH=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)" >> "$GITHUB_ENV"
      - run: npm run check:browser
      - run: npm run check:reader
      - run: npm run check:audio
      - run: npm run check:interaction
      - run: npm run check:search
      - run: npm run check:daily
      - run: npm run videos:check

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # نطاق مشروع Vercel — يُستخدم في sitemap.xml و robots.txt.
          SITE_ORIGIN: https://islamic-library-green.vercel.app
        run: npm run build:pages
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prebuilt'
          working-directory: .
          scope: ${{ secrets.VERCEL_ORG_ID }}
