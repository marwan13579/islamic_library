<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار المناسبات</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(2rem,7vw,2.8rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:38ch;margin:.4rem auto 0}

  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.85rem;background:none;border:0;color:var(--ink-soft);
    padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}

  section[hidden]{display:none}
  .section-note{font-size:.9rem;color:var(--ink-soft);margin:18px 0 14px;padding-inline-start:12px;border-inline-start:3px solid var(--gold-soft)}

  .dhikr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .dhikr .text{font-family:"Amiri",serif;font-size:1.2rem;line-height:2;margin:0}
  .dhikr .src{font-size:.8rem;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="wrap">
<header>
  <h1>أذكار المناسبات</h1>
  <p>أدعية نبوية لكل موقف من مواقف يومك — السفر، المرض، الهمّ، دخول البيت والمسجد، والطعام.</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>ما من عبد يقول في صباح كل يوم ومساء كل ليلة: بسم الله الذي لا يضر مع اسمه شيء، فيضره شيء</footer>
</div>

<script>
const D = (t,s)=>({t,s});

const DATA = {
  travel: {
    label:"السفر",
    note:"دعاء ركوب الدابة أو السيارة أو الطائرة، ودعاء العودة من السفر.",
    items:[
      D("اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ﴾. اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ", "رواه مسلم — دعاء ركوب وسيلة السفر"),
      D("اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ", "رواه مسلم"),
      D("آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ", "رواه مسلم — يقال عند العودة من السفر"),
      D("عِنْدَ نزول منزل في السفر: أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", "رواه مسلم — لم يضره شيء حتى يرتحل من منزله ذلك")
    ]
  },
  illness: {
    label:"المرض",
    note:"أدعية للرقية والشفاء، تُقال للمريض أو يدعو بها المريض لنفسه.",
    items:[
      D("أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا", "متفق عليه"),
      D("أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ", "رواه أبو داود — سبع مرات لمن يُعاد مريضًا لم يحضر أجله"),
      D("بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ", "رواه مسلم — رقية"),
      D("لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللَّهُ", "رواه البخاري — تقال للمريض تطييبًا لقلبه"),
      D("قراءة الفاتحة، وآية الكرسي، والمعوذتين، مع النفث بعدهن — من أعظم الرقى الثابتة عن النبي ﷺ", "رواه البخاري")
    ]
  },
  distress: {
    label:"الهمّ والكرب",
    note:"أدعية لتفريج الهم والغم والكرب، ثابتة عن النبي ﷺ.",
    items:[
      D("اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ... أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي", "رواه أحمد"),
      D("لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", "متفق عليه — دعاء الكرب"),
      D("اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ", "رواه أبو داود"),
      D("اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا", "رواه ابن حبان"),
      D("حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", "رواه البخاري — قالها إبراهيم عليه السلام حين أُلقي في النار")
    ]
  },
  home: {
    label:"البيت والمسجد",
    note:"دعاء دخول المنزل والخروج منه، ودعاء دخول المسجد والخروج منه.",
    items:[
      D("بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا، ثم يُسلّم على أهله", "رواه أبو داود — عند دخول البيت"),
      D("بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", "رواه أبو داود والترمذي — عند الخروج من البيت"),
      D("اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "رواه مسلم — عند دخول المسجد، ويُقدَّم الرجل اليمنى"),
      D("اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "رواه مسلم — عند الخروج من المسجد، ويُقدَّم الرجل اليسرى")
    ]
  },
  food: {
    label:"الطعام",
    note:"دعاء بدء الطعام وختامه، وما يقال إذا نسي التسمية.",
    items:[
      D("بِسْمِ اللَّهِ", "رواه أبو داود — قبل الأكل، وإن نسي في أوله قال: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ"),
      D("الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", "رواه أبو داود والترمذي — بعد الفراغ من الطعام"),
      D("الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ غَيْرَ مَكْفِيٍّ وَلَا مُوَدَّعٍ وَلَا مُسْتَغْنًى عَنْهُ رَبَّنَا", "رواه البخاري"),
      D("لمن أضافك: اللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِي، وَاسْقِ مَنْ سَقَانِي", "رواه مسلم — دعاء لصاحب الطعام"),
      D("اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا، وَقِنَا عَذَابَ النَّارِ، بِسْمِ اللَّهِ", "دعاء مأثور عند بدء الطعام")
    ]
  }
};

function dhikrCard(item){
  const el=document.createElement("div");
  el.className="dhikr";
  el.innerHTML='<p class="text">'+item.t+'</p><p class="src">'+item.s+'</p>';
  return el;
}

function buildPanel(key){
  const d=DATA[key];
  const frag=document.createDocumentFragment();
  const note=document.createElement("p");
  note.className="section-note"; note.textContent=d.note;
  frag.appendChild(note);
  d.items.forEach(it=>frag.appendChild(dhikrCard(it)));
  return frag;
}

const KEYS = Object.keys(DATA);
const tabsEl=document.getElementById("tabs");
const main=document.getElementById("main");
const panels={};

KEYS.forEach((k,i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=DATA[k].label;
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.addEventListener("click",()=>select(k));
  tabsEl.appendChild(b);

  const s=document.createElement("section");
  if(i!==0) s.hidden=true;
  s.appendChild(buildPanel(k));
  main.appendChild(s);
  panels[k]=s;
});

function select(id){
  KEYS.forEach((k,i)=>{
    panels[k].hidden = k!==id;
    tabsEl.children[i].setAttribute("aria-selected", k===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
</body>
</html>
