<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14);
    --card:#FFFAF0; --green:#2F6B4F; --green-soft:#DCEAE0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --green:#5FA787; --green-soft:#173A30;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --green:#5FA787; --green-soft:#173A30;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}

  header{position:relative;overflow:hidden;text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-weight:700;margin:0;font-size:clamp(2rem,7vw,2.8rem);position:relative}
  header p{margin:.4rem auto 0;max-width:60ch;color:var(--ink-soft);font-size:.9rem;position:relative}

  .dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .dcard .n{font-family:"Amiri",serif;font-size:1.5rem;color:var(--gold);margin:0}
  .dcard .l{font-size:.75rem;color:var(--ink-soft);margin-top:2px}

  .daily-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px;margin:14px 0;display:flex;flex-direction:column;gap:10px;
  }
  .daily-card .label{font-size:.85rem;color:var(--ink-soft);font-weight:600}
  .daily-card .value{font-size:1.05rem;line-height:1.9}
  .daily-card .value.quran{font-family:"Amiri",serif;font-size:1.2rem;text-align:center}
  .daily-card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

  .next-prayer{
    background:linear-gradient(135deg,var(--ink),#0d2620);color:var(--paper);
    border-radius:20px;padding:22px;margin:20px 0;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.15);
  }
  .next-prayer .title{font-family:"Amiri",serif;font-size:1.4rem;margin:0}
  .next-prayer .time{font-size:2rem;font-weight:800;margin:8px 0}
  .next-prayer .countdown{font-size:.9rem;opacity:.85}

  .task-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .task-row:last-child{border-bottom:0}
  .task-row .check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .task-row .check.done{background:var(--green);border-color:var(--green);color:#fff}
  .task-row .text{flex:1;font-size:.9rem}
  .task-row .text.done{text-decoration:line-through;color:var(--ink-soft)}

  .btn{font-family:"Cairo";font-weight:700;font-size:.85rem;padding:10px 20px;border-radius:999px;cursor:pointer;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--green);color:#fff}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}

  @media (max-width:360px){
    .wrap{padding-left:12px;padding-right:12px}
  }

<script type="module">
import { APP_DAILY_VERSES, APP_DAILY_HADITHS, APP_DAILY_WISDOM } from "src/data/app-daily.js";
import { HIJRI_EVENTS } from "src/data/hijri-events.js";
import { isHijriToday, hijriShort } from "src/lib/dates.js";
import { read, write, KEYS } from "src/lib/storage.js";
import { toArNum } from "src/lib/text.js";

const TASKS_KEY = "daily-guide-tasks";
const PROGRESS_KEY = "daily-guide-progress";

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function getTasks() {
  try {
    return JSON.parse(localStorage.getItem(TASKS_KEY) || "[]");
  } catch {
    return [];
  }
}

function saveTasks(tasks) {
  localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
}

function getProgress() {
  try {
    return JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveProgress(progress) {
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
}

function getTodayProgress() {
  const progress = getProgress();
  return progress[todayKey()] || { ward: 0, athkar: 0, tasks: 0 };
}

function updateTodayProgress(field) {
  const progress = getProgress();
  if (!progress[todayKey()]) progress[todayKey()] = { ward: 0, athkar: 0, tasks: 0 };
  progress[todayKey()][field] = (progress[todayKey()][field] || 0) + 1;
  saveProgress(progress);
}

function render() {
  const verse = APP_DAILY_VERSES[Math.floor(Math.random() * APP_DAILY_VERSES.length)];
  const hadith = APP_DAILY_HADITHS[Math.floor(Math.random() * APP_DAILY_HADITHS.length)];
  const wisdom = APP_DAILY_WISDOM[Math.floor(Math.random() * APP_DAILY_WISDOM.length)];
  const today = HIJRI_EVENTS.filter((event) => isHijriToday(event.date));
  const ward = read(KEYS.quranWard, { target: 1, done: 0 });
  const tasbih = read(KEYS.tasbihCount, 0);
  const todayProgress = getTodayProgress();

  let html = "";

  if (today.length) {
    html += `<div class="daily-card" style="background:linear-gradient(135deg,var(--ink),#0d2620);color:var(--paper);border:0">
      <div class="label">🎉 اليوم</div>
      <div class="value">${today.map((e) => e.title).join(" · ")}</div>
    </div>`;
  }

  html += `<div class="next-prayer">
    <div class="title">🕰️ الصلاة القادمة</div>
    <div class="time" id="nextPrayerTime">--</div>
    <div class="countdown" id="prayerCountdown">جارٍ الحساب...</div>
    <div style="margin-top:12px">
      <a class="btn btn-ghost" href="29-prayer-times.html" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)">📋 مواقيت الصلاة الكاملة</a>
    </div>
  </div>`;

  html += `<div class="dashboard">
    <div class="dcard"><p class="n">${toArNum(ward.done)}</p><p class="l">صفحة ورد اليوم</p></div>
    <div class="dcard"><p class="n">${toArNum(tasbih)}</p><p class="l">تسبيح اليوم</p></div>
    <div class="dcard"><p class="n">${todayProgress.athkar}</p><p class="l">أذكار مكتملة</p></div>
    <div class="dcard"><p class="n">${todayProgress.tasks}</p><p class="l">مهام مكتملة</p></div>
  </div>`;

  html += `<div class="daily-card">
    <div class="label">📅 التاريخ الهجري</div>
    <div class="value">${hijriShort()}</div>
  </div>`;

  html += `<div class="daily-card">
    <div class="label">📖 آية اليوم</div>
    <div class="value quran">${verse.text}</div>
    <div class="actions">
      <button class="btn btn-ghost" id="copyVerse">📋 نسخ</button>
      <a class="btn btn-ghost" href="30-quran-full.html">📖 قراءة القرآن</a>
    </div>
  </div>`;

  html += `<div class="daily-card">
    <div class="label">📕 حديث اليوم</div>
    <div class="value">${hadith.text || hadith.title}</div>
    <div class="label">📎 ${hadith.ref || hadith.src || ""}</div>
    <div class="actions">
      <a class="btn btn-ghost" href="27-hadith.html">📚 المزيد من الأحاديث</a>
    </div>
  </div>`;

  html += `<div class="daily-card">
    <div class="label">🤲 ذكر اليوم</div>
    <div class="value">${wisdom.text}</div>
    <div class="label">📎 ${wisdom.ref || ""}</div>
    <div class="actions">
      <a class="btn btn-ghost" href="25-azkar-shamila.html">🤲 الأذكار الشاملة</a>
    </div>
  </div>`;

  const tasks = getTasks();
  if (tasks.length > 0) {
    html += `<div class="daily-card">
      <div class="label">✅ مهام اليوم</div>
      ${tasks.map((task, i) => `
        <div class="task-row">
          <div class="check ${task.done ? "done" : ""}" data-task="${i}">${task.done ? "✓" : ""}</div>
          <div class="text ${task.done ? "done" : ""}">${task.text}</div>
        </div>
      `).join("")}
    </div>`;
  }

  html += `<div class="daily-card">
    <div class="label">💡 مهمة إيمانية اليوم</div>
    <div class="value">أكمل وردك اليومي من القرآن واذكر الله كثيرًا</div>
  </div>`;

  document.getElementById("dashboard").innerHTML = html;

  document.querySelectorAll(".check[data-task]").forEach((el) => {
    el.addEventListener("click", () => {
      const idx = Number(el.dataset.task);
      const current = getTasks();
      if (current[idx]) {
        current[idx].done = !current[idx].done;
        saveTasks(current);
        if (current[idx].done) updateTodayProgress("tasks");
        render();
      }
    });
  });

  document.getElementById("copyVerse")?.addEventListener("click", () => {
    navigator.clipboard?.writeText(verse.text + "\n\n" + verse.ref);
  });

  updateNextPrayer();
}

function updateNextPrayer() {
  const timeEl = document.getElementById("nextPrayerTime");
  const countEl = document.getElementById("prayerCountdown");
  if (!timeEl || !countEl) return;

  const prayers = [
    { name: "الفجر", time: "05:00" },
    { name: "الظهر", time: "12:30" },
    { name: "العصر", time: "15:45" },
    { name: "المغرب", time: "18:15" },
    { name: "العشاء", time: "19:45" },
  ];

  const now = new Date();
  const current = now.getHours() * 60 + now.getMinutes();
  let next = prayers[0];
  for (const p of prayers) {
    const [h, m] = p.time.split(":").map(Number);
    if (h * 60 + m > current) { next = p; break; }
  }
  timeEl.textContent = `${next.name} — ${next.time}`;

  function tick() {
    const n = new Date();
    const c = n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
    const [h, m] = next.time.split(":").map(Number);
    const target = h * 60 + m;
    let diff = target - c;
    /* تجاوز وقت الصلاة الأخيرة: العدّاد ي wrap إلى صلاة الغد
       بدل الاستدعاء الذاتي الذي يملأ المكدس. */
    if (diff <= 0) diff = target + 24 * 60 - c;
    const hh = Math.floor(diff / 60);
    const mm = Math.floor(diff % 60);
    countEl.textContent = `متبقي: ${hh} ساعة و ${mm} دقيقة`;
  }
  tick();
  setInterval(tick, 30000);
}

document.getElementById("resetDay")?.addEventListener("click", () => {
  if (confirm("بدء يوم جديد؟ سيتم تصفير مهام اليوم.")) {
    saveTasks(getTasks().map((t) => ({ ...t, done: false })));
    render();
  }
});

render();
</script>
