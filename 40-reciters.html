<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<link rel="stylesheet" href="engage.css">
<script src="engage.js" defer></script>
<script src="notify-boot.js" defer></script>
<script src="src/lib/serve-hint.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القرّاء والتلاوة والإذاعات · المكتبة الإسلامية</title>
<meta name="description" content="القرّاء بسورهم وتلاواتهم، والإذاعات الإسلامية المباشرة، وتحميل أي سورة كاملة للعمل بلا إنترنت — في صفحة واحدة.">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<link rel="stylesheet" href="library.css">
<style>
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.84rem;background:var(--paper-2);border:1px solid var(--line);
    color:var(--ink-soft);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:12px 0}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;
    text-align:start;font-family:"Cairo";color:var(--ink)}
  .rcard:hover{border-color:var(--gold-soft)}
  .rcard b{display:block;font-size:.92rem;line-height:1.6}
  .rcard span{font-size:.72rem;color:var(--ink-soft)}

  .srow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .srow .nm{flex:1;font-size:.9rem}
  .srow .nm small{color:var(--ink-soft);display:block;font-size:.72rem}

  .panelbox{background:var(--card);border:1px solid var(--gold-soft);border-radius:16px;padding:16px;margin:14px 0}
  .panelbox h2{font-family:"Amiri",serif;font-size:1.4rem;margin:0 0 4px}
  .panelbox .sub{color:var(--ink-soft);font-size:.78rem;margin:0 0 8px}
  .panelbox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  .note{font-size:.76rem;color:var(--ink-soft);line-height:1.9;background:var(--paper-2);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;
    font-size:.84rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bar{height:8px;background:var(--paper-2);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
  .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<header class="lib-head">
  <h1>القرّاء والتلاوة والإذاعات</h1>
  <p id="headline">جارٍ التحميل…</p>
</header>

<main class="lib-wrap">
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <input class="lib-search" id="q" type="search" placeholder="ابحث عن قارئ أو إذاعة…" aria-label="بحث في القرّاء والإذاعات">
  <div id="body"><p class="lib-state">جارٍ التحميل…</p></div>
</main>

<script type="module">
  import { reciters, stations, surahIndex } from "./src/lib/shards.js";
  import { cacheAudio, removeAudio, listAudio, clearAudio, audioSize } from "./src/lib/audio-store.js";
  import { escapeHtml, toArNum } from "./src/lib/text.js";
  import { mountPlayer, play as playTrack, stop as stopTrack, isPlaying } from "./src/lib/player.js";
  import { mergedStations, stationForReciter, reciterForStation, buildReciterIndex, stationName } from "./src/lib/audio-hub.js";

  const tabs = document.getElementById("tabs");
  const body = document.getElementById("body");
  const q = document.getElementById("q");

  const [reciterData, stationList, surahs] = await Promise.all([reciters(), stations(), surahIndex()]);
  const allReciters = reciterData.reciters;
  const surahByNo = new Map(surahs.map((s) => [s.no, s]));
  /* المحطات المفحوصة أولًا، ثم ما بقي — فيصير ما ثبتَ عملُه فوق ما لم يُفحص. */
  const allStations = mergedStations(stationList);
  const reciterIndex = buildReciterIndex(allReciters);

  document.getElementById("headline").textContent =
    `${toArNum(allReciters.length)} قارئًا و${toArNum(allStations.length)} إذاعة، وتلاوةُ أي سورة تُحمَّل كاملةً لتُسمع بلا إنترنت.`;

  const VIEWS = [
    { id: "reciters", label: "القرّاء والتلاوة" },
    { id: "radio", label: "الإذاعات" },
    { id: "saved", label: "المحفوظات" },
  ];
  const FROM_HASH = { radio: "radio", stations: "radio", اذاعات: "radio", إذاعة: "radio",
    reciters: "reciters", قراء: "reciters", قارئ: "reciters", saved: "saved", محفوظات: "saved" };
  let view = FROM_HASH[decodeURIComponent(location.hash.replace(/^#/, ""))] || "reciters";

  function drawTabs() {
    tabs.innerHTML = "";
    for (const v of VIEWS) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab";
      b.role = "tab";
      b.textContent = v.label;
      b.setAttribute("aria-selected", v.id === view ? "true" : "false");
      b.addEventListener("click", () => { view = v.id; drawTabs(); draw(); });
      tabs.appendChild(b);
    }
  }

  /** تشغيل مقطع في المشغّل العام، فيتابعه المستخدم من أي صفحة. */
  function play(url, label, subtitle = "", live = false) {
    if (isPlaying()) stopTrack();
    playTrack({ src: url, title: label, subtitle, page: location.pathname, live });
  }

  /* --------------------------------------------------------- القرّاء */

  function viewReciters() {
    const needle = q.value.trim();
    const rows = allReciters.filter(
      (r) => !needle || r.name.includes(needle) || r.riwaya.includes(needle)
    );

    body.innerHTML = `<p class="lib-count">${toArNum(rows.length)} قارئًا</p>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const r of rows) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rcard";
      b.innerHTML = `<b>${escapeHtml(r.name)}</b><span>${escapeHtml(r.riwaya)} · ${toArNum(r.surahs.length)} سورة</span>`;
      b.addEventListener("click", () => openReciter(r));
      grid.appendChild(b);
    }
    body.appendChild(grid);
  }

  async function openReciter(reciter, from = view) {
    body.innerHTML = "";
    const box = document.createElement("div");
    box.className = "panelbox";
    box.innerHTML = `<h2>${escapeHtml(reciter.name)}</h2><p class="sub">${escapeHtml(reciter.riwaya)} · ${escapeHtml(reciter.letter)}</p>`;
    const acts = document.createElement("div");
    acts.className = "acts";

    /* الإذاعة والتلاوة في مكان واحد: من يشغّل بثَّ الشيخ يفتح تلاواتِه، ومن
       يفتح تلاواتِه يجد بثَّه. */
    const station = stationForReciter(reciter, allStations);
    if (station) {
      const live = document.createElement("button");
      live.type = "button";
      live.className = "sbtn";
      live.textContent = "🔴 بثّ حيّ";
      live.addEventListener("click", () => play(station.link, stationName(station), "", true));
      acts.appendChild(live);
    }
    const back = document.createElement("button");
    back.type = "button";
    back.className = "sbtn";
    back.textContent = from === "radio" ? "رجوع إلى الإذاعات" : "رجوع إلى القرّاء";
    back.addEventListener("click", () => { view = from; drawTabs(); draw(); });
    acts.appendChild(back);
    box.appendChild(acts);
    body.appendChild(box);

    /* ما المحفوظ؟ سؤال واحد للمخزن كله، لا سؤال لكل سورة: ١١٤ نداء
       كانت كل سورة وحدها تستأخر نصف ثانية. */
    const saved = new Set((await listAudio()).map((row) => row.url));

    const list = document.createElement("div");
    for (const no of reciter.surahs) {
      const sura = surahByNo.get(no);
      if (!sura) continue;
      const url = `${reciter.server}/${String(no).padStart(3, "0")}.mp3`;
      const isSaved = saved.has(url);
      const row = document.createElement("div");
      row.className = "srow";
      row.innerHTML = `<span class="nm">${escapeHtml(sura.name)}<small>${toArNum(no)} · ${toArNum(sura.verses)} آية</small></span>`;

      const playBtn = document.createElement("button");
      playBtn.type = "button";
      playBtn.className = "sbtn";
      playBtn.textContent = "تشغيل";
      playBtn.addEventListener("click", () => play(url, `${reciter.name} — ${sura.name}`));

      const dl = document.createElement("button");
      dl.type = "button";
      dl.className = "sbtn";
      dl.classList.toggle("ok", isSaved);
      dl.textContent = isSaved ? "محفوظة ✓" : "تحميل";
      dl.addEventListener("click", async () => {
        if (dl.disabled) return;
        dl.disabled = true;
        dl.textContent = "…";
        try {
          await cacheAudio(url);
          dl.classList.add("ok");
          dl.textContent = "محفوظة ✓";
        } catch {
          dl.textContent = "تعذّر التحميل";
          dl.disabled = false;
        }
      });

      row.append(playBtn, dl);
      list.appendChild(row);
    }
    body.appendChild(list);
  }

  /* -------------------------------------------------------- الإذاعات */

  function viewRadio() {
    const needle = q.value.trim();
    const rows = allStations.filter(
      (s) => !needle || stationName(s).includes(needle) || (s.category || "").includes(needle)
    );
    const cats = [...new Set(rows.map((s) => s.category || "أخرى"))];

    body.innerHTML = "";
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = "⚠️ روابط بثٍ مباشرة من خوادم خارجية لا نملكها، فقد تتوقف أيّها عن العمل حسب مصدرها، جرّب غيرها عندها. البثُّ الحيُّ يحتاج اتصالًا بالإنترنت دائمًا، بخلاف تلاوات المحفوظة التي تعمل بلا إنترنت.";
    body.appendChild(note);

    const chips = document.createElement("div");
    chips.className = "lib-chips";
    let active = needle ? "" : "مجرَّبة";
    for (const c of ["مجرَّبة", "", ...cats.filter((cat) => cat !== "مجرَّبة")]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "lib-chip";
      b.textContent = c || "الكل";
      b.setAttribute("aria-pressed", c === active ? "true" : "false");
      b.addEventListener("click", () => {
        active = c;
        for (const node of chips.children) node.setAttribute("aria-pressed", "false");
        b.setAttribute("aria-pressed", "true");
        viewRadio();
      });
      chips.appendChild(b);
    }
    body.appendChild(chips);

    const shown = rows.filter((s) => {
      if (!active) return true;
      if (active === "مجرَّبة") return Boolean(s.featured);
      return (s.category || "أخرى") === active;
    });
    const count = document.createElement("p");
    count.className = "lib-count";
    count.textContent = active === "مجرَّبة"
      ? `${toArNum(shown.length)} إذاعة مفحوصة — والباقي بالتبويبات`
      : `${toArNum(shown.length)} إذاعة`;
    body.appendChild(count);

    for (const s of shown) {
      const row = document.createElement("div");
      row.className = "srow";
      const tag = s.featured ? "مجرَّبة · " : "";
      row.innerHTML = `<span class="nm">${escapeHtml(stationName(s))}<small>${escapeHtml(tag + (s.category || "أخرى"))}</small></span>`;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sbtn";
      btn.textContent = "استماع";
      btn.addEventListener("click", () => play(s.link, stationName(s), "", true));

      row.appendChild(btn);

      /* ومن محطة البث إلى سور صاحبه: الإذاعة بابٌ للتلاوة لا نهايتها. */
      const reciter = reciterForStation(s, reciterIndex);
      if (reciter) {
        const go = document.createElement("button");
        go.type = "button";
        go.className = "sbtn";
        go.textContent = "تلاواتُه";
        go.addEventListener("click", () => openReciter(reciter, "radio"));
        row.appendChild(go);
      }

      body.appendChild(row);
    }

    if (!shown.length) {
      body.innerHTML += `<p class="lib-empty">لا إذاعة بهذا الاسم. جرّب كلمةً أخرى أو تبويب «الكل».</p>`;
    }
  }

  /* ------------------------------------------------------ المحفوظات */

  async function viewSaved() {
    body.innerHTML = `<p class="lib-state">جارٍ الحساب…</p>`;
    const [rows, bytes] = await Promise.all([listAudio(), audioSize()]);

    body.innerHTML = "";
    const stat = document.createElement("div");
    stat.className = "stat";
    stat.innerHTML = `<span>${toArNum(rows.length)} تلاوة محفوظة</span><span>${toArNum(Math.round(bytes / 1048576))} م.ب</span>`;
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "sbtn";
    clear.textContent = "حذف الكل";
    clear.addEventListener("click", async () => {
      clear.disabled = true;
      await clearAudio();
      viewSaved();
    });
    stat.appendChild(clear);
    body.appendChild(stat);

    if (!rows.length) {
      body.innerHTML += `<p class="lib-empty">لا تلاوات محفوظة. افتح قارئًا واضغط «تحميل» على أي سورة.</p>`;
      return;
    }

    for (const row of rows) {
      const name = decodeURIComponent(row.url.split("/").pop());
      const line = document.createElement("div");
      line.className = "srow";
      line.innerHTML = `<span class="nm">${escapeHtml(name)}<small>${toArNum(Math.max(1, Math.round(row.bytes / 1048576)))} م.ب</small></span>`;

      const listen = document.createElement("button");
      listen.type = "button";
      listen.className = "sbtn";
      listen.textContent = "استماع";
      listen.addEventListener("click", () => play(row.url, name));

      const del = document.createElement("button");
      del.type = "button";
      del.className = "sbtn";
      del.textContent = "حذف";
      del.addEventListener("click", async () => {
        await removeAudio(row.url);
        viewSaved();
      });

      line.append(listen, del);
      body.appendChild(line);
    }
  }

  /* ---------------------------------------------------------- الرسم */

  function draw() {
    if (view === "reciters") viewReciters();
    else if (view === "radio") viewRadio();
    else viewSaved();
  }

  let timer = 0;
  q.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(draw, 200);
  });

  /* الرابط العميق: الإذاعةُ القديمة تحيل إلى `#radio` هنا، فمن جاء من
     رابطٍ قديمٍ وجد الإذاعةَ لا القرّاء. */
  window.addEventListener("hashchange", () => {
    const next = FROM_HASH[decodeURIComponent(location.hash.replace(/^#/, ""))];
    if (!next || next === view) return;
    view = next;
    drawTabs();
    draw();
  });

  mountPlayer();
  drawTabs();
  draw();
</script>

  import { createSearchModal } from "./src/components/search-modal.js";
  createSearchModal();
</script>
</body>
</html>
