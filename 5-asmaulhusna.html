<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسماء الله الحسنى</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 18px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(2rem,7vw,2.8rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:44ch;margin:.4rem auto 0}
  .search{display:block;width:100%;max-width:420px;margin:18px auto 0;padding:10px 16px;
    border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:"Cairo";font-size:.9rem}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    cursor:pointer;text-align:center;transition:border-color .15s ease;
  }
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .card .n{font-family:"Amiri",serif;font-size:1.35rem;color:var(--gold)}
  .card .idx{font-size:.7rem;color:var(--ink-soft)}

  dialog{
    border:none;border-radius:16px;padding:0;max-width:480px;width:90vw;
    background:var(--card);color:var(--ink);
  }
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .dcontent{padding:22px}
  .dname{font-family:"Amiri",serif;font-size:2.1rem;text-align:center;color:var(--gold);margin:0}
  .dmeaning{font-size:.95rem;text-align:center;color:var(--ink-soft);margin:.3rem 0 14px}
  .dbody{font-size:.92rem;border-top:1px solid var(--line);padding-top:12px}
  .dclose{
    display:block;margin:16px auto 0;padding:9px 24px;border-radius:999px;border:0;
    background:var(--ink);color:var(--paper);font-family:"Cairo";font-weight:600;cursor:pointer;
  }
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="wrap">
<header>
  <h1>أسماء الله الحسنى</h1>
  <p>«وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا» — من أحصاها دخل الجنة. اضغط أي اسم لتعرف معناه.</p>
  <input class="search" id="search" type="search" placeholder="ابحث عن اسم..." aria-label="ابحث في أسماء الله الحسنى">
</header>
<div class="grid" id="grid"></div>
<footer>اللهم إني أسألك بأسمائك الحسنى كلها ما علمت منها وما لم أعلم</footer>
</div>

<dialog id="dlg">
  <div class="dcontent">
    <p class="dname" id="dName"></p>
    <p class="dmeaning" id="dMeaning"></p>
    <div class="dbody" id="dBody"></div>
    <button class="dclose" id="dClose">إغلاق</button>
  </div>
</dialog>

<script>
const NAMES = [
["الرَّحْمَٰن","ذو الرحمة الواسعة التي تشمل كل الخلق في الدنيا","رحمته وسعت كل شيء، يرزق المؤمن والكافر، البر والفاجر."],
["الرَّحِيم","ذو الرحمة الخاصة بالمؤمنين يوم القيامة","رحمته الخاصة تُدَّخر لعباده المؤمنين في الآخرة."],
["الْمَلِك","المالك المتصرف في كل شيء بلا منازع","له الملك المطلق في الدنيا والآخرة، وكل ملك سواه عارية زائلة."],
["الْقُدُّوس","المنزَّه عن كل نقص وعيب","طاهر من كل عيب، منزّه عن الشريك والولد وكل ما لا يليق بجلاله."],
["السَّلَام","السالم من كل نقص، ومصدر السلامة لخلقه","ذاته سالمة من كل عيب، وهو الذي يمنح الأمن والسلامة لعباده."],
["الْمُؤْمِن","المصدّق لأوليائه، المؤمّن لعباده من الخوف","يمنح الأمان لمن يشاء، ويصدق وعده لعباده المؤمنين."],
["الْمُهَيْمِن","الرقيب الحافظ على كل شيء","مطّلع على كل شيء، شاهد على خلقه، لا يغيب عنه شيء من أحوالهم."],
["الْعَزِيز","الغالب الذي لا يُقهر","له العزة التامة، لا يغلبه شيء ولا يعجزه أحد."],
["الْجَبَّار","الذي يجبر الكسير ويقهر الجبابرة","يجبر قلوب المنكسرين ويصلح أحوال عباده، ويقهر من تجبّر وتكبّر."],
["الْمُتَكَبِّر","المتفرد بصفات العظمة والكبرياء","الكبرياء رداؤه وحده، فلا يليق التكبر بأحد سواه."],
["الْخَالِق","موجِد كل شيء من العدم بقدرته","خلق كل شيء بعلمه وحكمته وقدرته، ولا خالق سواه."],
["الْبَارِئ","المُنشئ للخلق على غير مثال سابق","أوجد الخلق بريئًا من التفاوت والعيب فيما خلقه على الوجه الذي أراد."],
["الْمُصَوِّر","الذي يعطي كل مخلوق صورته الخاصة","صوّر كل مخلوق بصورة مختلفة عن غيره، فلا يتشابه اثنان تمامًا."],
["الْغَفَّار","كثير المغفرة لذنوب عباده","يستر الذنوب ويمحوها عن عباده التائبين مهما كثرت."],
["الْقَهَّار","الغالب لكل شيء، القاهر فوق عباده","قهر كل المخلوقات بقدرته، فلا يمتنع عليه شيء أراده."],
["الْوَهَّاب","كثير العطاء بلا مقابل","يعطي عباده بلا سبب سوى فضله وكرمه، عطاؤه لا ينقطع."],
["الرَّزَّاق","المتكفل برزق كل مخلوق","يرزق كل كائن حي بما يناسبه، ورزقه لا ينفد."],
["الْفَتَّاح","الحاكم بين عباده، الذي يفتح أبواب الخير","يفتح أبواب الرزق والرحمة والهداية لمن يشاء من عباده."],
["الْعَلِيم","المحيط علمه بكل شيء ظاهرًا وباطنًا","يعلم السر وأخفى، ولا يخفى عليه شيء في الأرض ولا في السماء."],
["الْقَابِض","يقبض الأرزاق والأرواح بحكمته","يضيّق الرزق على من يشاء ابتلاءً أو حكمة، ويقبض الأرواح عند الأجل."],
["الْبَاسِط","يوسّع الأرزاق بفضله","يبسط الرزق لمن يشاء توسعة وابتلاءً بالشكر."],
["الْخَافِض","يخفض من يشاء من المتكبرين","يذل الجبابرة والمتكبرين ويضعهم بعد رفعتهم."],
["الرَّافِع","يرفع من يشاء من عباده المؤمنين","يرفع درجات أوليائه في الدنيا والآخرة بالطاعة والتقوى."],
["الْمُعِزّ","يهب العزة لمن يشاء","يعزّ من يشاء من عباده بالإيمان والطاعة."],
["الْمُذِلّ","يذل من يشاء بعدله","يذل من عصاه واستكبر عن طاعته."],
["السَّمِيع","الذي يسمع كل الأصوات مهما خفيت","يسمع دعاء الداعي وسرّ الحديث، لا يخفى عليه صوت."],
["الْبَصِير","الذي يرى كل شيء مهما دقّ","يبصر كل شيء ظاهرًا وخافيًا، لا يغيب عن نظره شيء."],
["الْحَكَم","الفاصل بين الخلق بالعدل","يحكم بين عباده يوم القيامة بالعدل التام، لا ظلم عنده."],
["الْعَدْل","المنزَّه عن الجور في كل قضائه","كل أفعاله عدل محض، لا يظلم أحدًا مثقال ذرة."],
["اللَّطِيف","الرفيق بعباده، العالم بدقائق الأمور","يوصل الخير لعباده من حيث لا يشعرون، ويعلم أدق التفاصيل."],
["الْخَبِير","المطَّلع على بواطن الأمور وحقائقها","يعلم حقيقة كل شيء وباطنه، لا يخدعه ظاهر الأمور."],
["الْحَلِيم","الذي لا يعجل بالعقوبة مع قدرته عليها","يمهل العصاة ولا يعاجلهم بالعقوبة رحمة وحلمًا."],
["الْعَظِيم","صاحب العظمة التي لا يحيط بها وصف","عظيم الذات والصفات، لا يبلغ الخلق كنه عظمته."],
["الْغَفُور","الساتر للذنوب الماحي لها","يغفر الذنوب مهما عظمت لمن تاب وأناب."],
["الشَّكُور","يجازي القليل من الطاعة بالكثير من الأجر","يضاعف الحسنات ويثيب على القليل من العمل بالكثير من الأجر."],
["الْعَلِيّ","المتعالي فوق خلقه بذاته وقدره","علا فوق كل شيء بذاته وقهره وشأنه، لا شبيه له في علوّه."],
["الْكَبِير","الأعظم من كل شيء قدرًا وشأنًا","كل شيء دونه في القدر والعظمة، فهو الكبير المتعال."],
["الْحَفِيظ","الحافظ لخلقه وأعمالهم","يحفظ عباده من الآفات، ويحفظ أعمالهم لتُجزى يوم القيامة."],
["الْمُقِيت","المقتدر، الذي يعطي كل مخلوق قوته","يوصل لكل مخلوق ما يقيم به حياته من رزق."],
["الْحَسِيب","الكافي عباده، المحاسب لهم على أعمالهم","يكفي من توكل عليه، ويحاسب الخلق على أعمالهم يوم القيامة."],
["الْجَلِيل","صاحب الجلال والعظمة والكمال","له صفات الجلال والكمال التي تفوق الوصف."],
["الْكَرِيم","كثير العطاء، المتفضل على عباده بلا حساب","عطاؤه دائم لا ينقطع، يعطي من سأله ومن لم يسأله."],
["الرَّقِيب","المطّلع على كل شيء لا يغفل","لا يغيب عن نظره شيء من أحوال خلقه في كل لحظة."],
["الْمُجِيب","الذي يجيب دعوة من دعاه","يستجيب لدعاء عباده إذا دعوه بصدق ويقين."],
["الْوَاسِع","الواسع الرحمة والعلم والفضل","رحمته وعلمه وعطاؤه يسع كل شيء، لا يضيق عن أحد."],
["الْحَكِيم","صاحب الحكمة البالغة في خلقه وأمره","يضع كل شيء في موضعه بحكمة تامة، لا عبث في خلقه."],
["الْوَدُود","المحب لأوليائه، المحبوب من عباده الصالحين","يحب عباده الصالحين ويحبونه، وهو غاية المحبة الحقيقية."],
["الْمَجِيد","صاحب المجد والشرف الكامل","له الشرف الأعلى والكمال الذي لا يُدانى."],
["الْبَاعِث","الذي يبعث الخلق يوم القيامة للحساب","يحيي الموتى ويبعثهم من قبورهم للحساب والجزاء."],
["الشَّهِيد","الحاضر المطّلع على كل شيء، الشاهد على أعمال العباد","يشهد على كل قول وفعل من عباده، لا يفوته شيء."],
["الْحَقّ","الثابت وجوده حقًا، وكل ما سواه باطل زائل","وجوده حق لا شك فيه، وكل شيء سواه فانٍ وهو الباقي."],
["الْوَكِيل","الكافي لمن توكل عليه، القائم بأمور عباده","من توكل عليه كفاه، وهو القائم بمصالح خلقه."],
["الْقَوِيّ","صاحب القوة الكاملة التي لا تُضاهى","قوته تامة لا يعتريها ضعف ولا عجز."],
["الْمَتِين","شديد القوة الثابت الذي لا يتزعزع","قوته وشدته لا تلين ولا تضعف مهما طال الزمن."],
["الْوَلِيّ","ناصر عباده المؤمنين ومتولي أمورهم","يتولى شؤون أوليائه بالنصرة والحفظ والهداية."],
["الْحَمِيد","المستحق للحمد على كل حال","يستحق الحمد الكامل في كل شؤونه وأفعاله."],
["الْمُحْصِي","المحيط علمه بعدد كل شيء ومقداره","أحصى كل شيء عددًا، فلا يند عن علمه شيء مهما دقّ."],
["الْمُبْدِئ","الذي أنشأ الخلق ابتداءً من العدم","بدأ خلق كل شيء من غير مثال سابق."],
["الْمُعِيد","الذي يعيد الخلق بعد الموت","يعيد الخلق يوم القيامة كما بدأهم أول مرة."],
["الْمُحْيِي","واهب الحياة لكل كائن حي","يحيي الأجساد والقلوب والأرض بعد موتها."],
["الْمُمِيت","الذي يقدّر الموت على كل حي","بيده وحده الإماتة، لا يملكها أحد سواه."],
["الْحَيّ","الحي حياة كاملة لا يعتريها فناء","حياته أزلية أبدية كاملة، لا يعرض لها موت ولا نقص."],
["الْقَيُّوم","القائم بنفسه، المُقيم لغيره","قائم بذاته لا يحتاج لأحد، وكل المخلوقات قائمة به."],
["الْوَاجِد","الغني الذي لا يفتقر لشيء","لا يعوزه شيء، ويجد كل ما يريد بلا عجز."],
["الْمَاجِد","صاحب المجد والكرم الواسع","جامع لصفات الجلال والجمال والكرم."],
["الْوَاحِد","المتفرد في ذاته وصفاته، لا شريك له","لا نظير له ولا شبيه، متفرد في ألوهيته وربوبيته."],
["الصَّمَد","الذي يُقصد في الحوائج، المستغني عن كل أحد","يُلجأ إليه في كل حاجة، وهو غني عن الجميع."],
["الْقَادِر","صاحب القدرة على كل شيء","يقدر على كل شيء أراده، لا يعجزه شيء في الكون."],
["الْمُقْتَدِر","كامل القدرة، الغالب بقدرته","قدرته لا حد لها، يقهر بها كل قوة سواه."],
["الْمُقَدِّم","يقدّم من يشاء بفضله وحكمته","يقدّم من يشاء من عباده بالمنزلة والدرجة."],
["الْمُؤَخِّر","يؤخر من يشاء بحكمته","يؤخر من يشاء ويمهله، فكل شيء بتدبيره."],
["الْأَوَّل","الذي ليس قبله شيء","سابق لكل موجود، لا بداية لوجوده."],
["الْآخِر","الذي ليس بعده شيء","باقٍ بعد فناء كل شيء، لا نهاية لوجوده."],
["الظَّاهِر","الغالب فوق كل شيء بأدلة وجوده الظاهرة","ظهرت آثار قدرته في كل شيء يدل على وجوده."],
["الْبَاطِن","العالم بما بطن من الأمور، القريب من عباده","أقرب إلى عباده من حبل الوريد، وعلمه محيط بكل خفي."],
["الْوَالِي","المتولي لتدبير أمر خلقه كله","يتولى تدبير الكون كله بحكمته وقدرته."],
["الْمُتَعَالِ","المتعالي عن كل نقص وشبيه","تعالى عن مشابهة خلقه وعن كل ما لا يليق بجلاله."],
["الْبَرّ","المحسن إلى خلقه بأنواع الإحسان","كثير البر والإحسان لعباده في كل شأن."],
["التَّوَّاب","الذي يقبل توبة عباده مهما كثرت ذنوبهم","يفتح باب التوبة دومًا ويفرح بتوبة عبده."],
["الْمُنْتَقِم","الذي ينتقم من الظالمين المصرّين على الجرم","يأخذ حق المظلوم من الظالم إن لم يتب."],
["العَفُوّ","الذي يمحو الذنوب ولا يعاقب عليها","يعفو عن عباده التائبين فيمحو الذنب كأنه لم يكن."],
["الرَّءُوف","شديد الرحمة واللطف بعباده","رأفته تدفع عنهم الأذى وتوصل إليهم الخير."],
["مَالِكُ الْمُلْك","المتصرف في كل ملك، يعطيه من يشاء وينزعه ممن يشاء","بيده ملك كل شيء، يؤتي الملك من يشاء وينزعه ممن يشاء."],
["ذُو الْجَلَالِ وَالْإِكْرَام","صاحب العظمة والكرم الذي يستحق أن يُجَلّ ويُكرَم","له كمال الجلال وكمال الإكرام لأوليائه."],
["الْمُقْسِط","العادل في قضائه وحكمه","يقيم العدل بين خلقه في الدنيا والآخرة."],
["الْجَامِع","الذي يجمع الخلائق ليوم لا ريب فيه","يجمع الناس يوم القيامة للحساب، ويجمع المتفرقات بحكمته."],
["الْغَنِيّ","المستغني عن كل خلقه بذاته","لا يحتاج لشيء من مخلوقاته، وكل الخلق محتاجون إليه."],
["الْمُغْنِي","الذي يُغني من يشاء من عباده","يمنح الغنى والكفاية لمن يشاء من خلقه."],
["الْمَانِع","الذي يمنع ما يشاء بحكمته","يمنع الضرر والشر عن عباده، ويحجب عنهم ما لا يصلحهم."],
["الضَّارّ","خالق الضرّ الذي يبتلي به بحكمته","يقدّر الضرّ ابتلاءً وحكمة، لا ظلمًا."],
["النَّافِع","خالق النفع الذي يوصله لعباده","بيده وحده النفع، فلا ينفع أحد إلا بإذنه."],
["النُّور","منوّر السماوات والأرض بنوره الحسي والمعنوي","نوّر الكون بنوره، ويهدي القلوب بنور الإيمان."],
["الْهَادِي","الذي يهدي من يشاء إلى الصراط المستقيم","يرشد عباده إلى طريق الحق ويوفقهم إليه."],
["الْبَدِيع","مبدع الخلق على غير مثال سابق","أوجد كل شيء بصورة مبتكرة لم يسبقها مثال."],
["الْبَاقِي","الدائم الذي لا يفنى ولا يزول","باقٍ بعد فناء كل مخلوق، لا يعتريه زوال."],
["الْوَارِث","الباقي بعد فناء كل شيء يرث ملكه","يرث الأرض ومن عليها بعد فناء كل الخلق."],
["الرَّشِيد","الذي يرشد الخلق لما فيه صلاحهم","يهدي عباده لمصالحهم في الدنيا والآخرة بحكمته."],
["الصَّبُور","الذي لا يعاجل العصاة بالعقوبة","يمهل من عصاه ولا يعجل عليه، حلمًا وصبرًا منه سبحانه."],
["الأَحَد","المتفرد في ذاته، الذي لا ثاني له","فرد في ذاته وصفاته وأفعاله، لا يشاركه فيها أحد."]
];

function render(filter){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  const f=(filter||"").trim();
  NAMES.forEach((n,i)=>{
    if(f && !(n[0]+n[1]).includes(f)) return;
    const c=document.createElement("div");
    c.className="card"; c.tabIndex=0; c.setAttribute("role","button");
    c.innerHTML = '<div class="idx">'+(i+1)+'</div><div class="n">'+n[0]+'</div>';
    const open=()=>{
      document.getElementById("dName").textContent = n[0];
      document.getElementById("dMeaning").textContent = n[1];
      document.getElementById("dBody").textContent = n[2];
      document.getElementById("dlg").showModal();
    };
    c.addEventListener("click",open);
    c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
    grid.appendChild(c);
  });
}
render("");
document.getElementById("search").addEventListener("input",e=>render(e.target.value));
document.getElementById("dClose").addEventListener("click",()=>document.getElementById("dlg").close());
document.getElementById("dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") e.target.close(); });
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
