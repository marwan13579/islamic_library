<title>الأذكار الشاملة</title>

<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-weight:700;margin:0;font-size:clamp(2rem,7.5vw,2.9rem)}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:42ch;margin:.4rem auto 0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:22px 0}
  .catbtn{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;
    text-align:center;cursor:pointer;font-family:"Cairo";
  }
  .catbtn .em{font-size:1.4rem;display:block;margin-bottom:4px}
  .catbtn .t{font-size:.78rem;font-weight:700;color:var(--ink)}
  .catbtn.active{background:var(--ink);border-color:var(--ink)}
  .catbtn.active .t{color:var(--paper)}

  .backtogrid{display:inline-block;margin-bottom:14px;font-family:"Cairo";font-weight:600;font-size:.82rem;
    background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer}
  .section-note{font-size:.9rem;color:var(--ink-soft);margin:8px 0 14px;padding-inline-start:12px;border-inline-start:3px solid var(--gold-soft)}
  .catTitle{font-family:"Amiri",serif;font-size:1.5rem;margin:0 0 4px}

  .dhikr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;
    margin-bottom:14px;cursor:pointer;transition:opacity .2s ease}
  .dhikr .text{font-family:"Amiri",serif;font-size:1.25rem;line-height:2.05;margin:0}
  .dhikr .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;
    padding-top:12px;border-top:1px dashed var(--line);font-size:.82rem;color:var(--ink-soft)}
  .dhikr .src{flex:1}
  .count{font-family:"Cairo";font-weight:700;font-size:.85rem;min-width:52px;text-align:center;
    padding:5px 10px;border-radius:999px;background:var(--paper-2);color:var(--ink)}
  .dhikr.done{opacity:.5}
  .dhikr.done .count{background:var(--gold);color:#12211c}

  #gridView[hidden], #detailView[hidden]{display:none}
  footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>

let progress={};
try{ progress = JSON.parse(localStorage.getItem("azkar-shamila-progress")||"{}"); }catch(e){ progress={}; }
function save(){ try{ localStorage.setItem("azkar-shamila-progress", JSON.stringify(progress)); }catch(e){} }

function renderGrid(){
  const grid=document.getElementById("catGrid");
  grid.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="catbtn"; b.type="button";
    b.innerHTML='<span class="em">'+c.emoji+'</span><span class="t">'+c.label+'</span>';
    b.addEventListener("click",()=>openCat(c.id));
    grid.appendChild(b);
  });
}

function dhikrCard(catId,idx,item){
  const id=catId+"-"+idx;
  const doneCount=progress[id]||0;
  const left=Math.max(item.c-doneCount,0);
  const el=document.createElement("div");
  el.className="dhikr"+(left===0?" done":"");
  el.tabIndex=0; el.setAttribute("role","button");
  el.innerHTML =
    '<p class="text">'+item.t+'</p>'+
    '<div class="meta"><span class="src">'+item.s+'</span>'+
    '<span class="count">'+(left===0?"✓ تم":left+" / "+item.c)+'</span></div>';
  const tick=()=>{
    const cur=progress[id]||0;
    if(cur>=item.c){ progress[id]=0; } else { progress[id]=cur+1; }
    save();
    const now=Math.max(item.c-(progress[id]||0),0);
    el.querySelector(".count").textContent = now===0 ? "✓ تم" : now+" / "+item.c;
    el.classList.toggle("done", now===0);
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
  };
  el.addEventListener("click",tick);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();tick();} });
  return el;
}

function openCat(id){
  const cat=CATS.find(c=>c.id===id);
  document.getElementById("gridView").hidden=true;
  document.getElementById("detailView").hidden=false;
  document.getElementById("catTitle").textContent=cat.emoji+" "+cat.label;
  document.getElementById("catNote").textContent=cat.note;
  const list=document.getElementById("catList");
  list.innerHTML="";
  cat.items.forEach((it,i)=>list.appendChild(dhikrCard(id,i,it)));
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("backBtn").addEventListener("click",()=>{
  document.getElementById("detailView").hidden=true;
  document.getElementById("gridView").hidden=false;
});

renderGrid();
(function(){
  const h=location.hash.replace("#","");
  if(h && CATS.some(c=>c.id===h)) openCat(h);
})();
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
