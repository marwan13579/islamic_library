<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<script src="notify-boot.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آداب الزيارة والعيادة</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<script src="noor-companion.js" defer></script>
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(1.8rem,6.5vw,2.6rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:38ch;margin:.4rem auto 0}

  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.85rem;background:none;border:0;color:var(--ink-soft);
    padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  section[hidden]{display:none}

  .prose p{margin:0 0 12px;font-size:.92rem}
  .duabox{background:var(--card);border:1px solid var(--gold-soft);border-radius:14px;padding:16px;margin:14px 0;text-align:center}
  .duabox .text{font-family:"Amiri",serif;font-size:1.2rem;line-height:2;margin:0}
  .duabox .src{font-size:.78rem;color:var(--ink-soft);margin-top:8px}

  .tips{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .tip h3{margin:0 0 5px;font-size:.98rem;color:var(--gold)}
  .tip p{margin:0;font-size:.88rem;color:var(--ink-soft)}

  .avoid{background:var(--paper-2);border-radius:10px;padding:12px 14px;font-size:.85rem;margin-top:16px}
  .avoid b{color:var(--ink)}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="wrap">
<header>
  <h1>آداب الزيارة والعيادة</h1>
  <p>كيف تزور مريضًا، تُعزّي حزينًا، أو تهنّئ فرحًا — بالأدب والدعاء المناسب.</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>مَن عَادَ مَرِيضًا لَمْ يَزَلْ فِي خُرْفَةِ الْجَنَّةِ حَتَّى يَرْجِعَ</footer>
</div>

<script>
function tipsList(arr){
  const wrap=document.createElement("div");
  wrap.className="tips";
  arr.forEach(([t,d])=>{
    const el=document.createElement("div");
    el.className="tip";
    el.innerHTML='<h3>'+t+'</h3><p>'+d+'</p>';
    wrap.appendChild(el);
  });
  return wrap;
}
function duaBox(text,src){
  const el=document.createElement("div");
  el.className="duabox";
  el.innerHTML='<p class="text">'+text+'</p><p class="src">'+src+'</p>';
  return el;
}

function panelSick(){
  const frag=document.createElement("div");
  frag.className="prose";
  frag.innerHTML='<p>عيادة المريض من حقوق المسلم على أخيه، وفيها أجر عظيم وطمأنة لقلب المريض وأهله.</p>';
  frag.appendChild(duaBox(
    "أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا",
    "متفق عليه — دعاء يُقال عند عيادة المريض"
  ));
  frag.appendChild(tipsList([
    ["اختر وقتًا مناسبًا","تجنّب أوقات الراحة أو العلاج، واسأل الأهل عن الوقت الأنسب قبل الزيارة."],
    ["أوجز الزيارة","لا تُطل الجلوس إلا إن رغب المريض، فالإطالة قد تُرهقه."],
    ["تحدّث بإيجابية","ذكّره برحمة الله وقرب الفرج، وتجنّب الحديث عن حالات مشابهة ساءت."],
    ["ادعُ له بصوت مسموع","الدعاء يطمئن قلب المريض، وهو من أعظم مقاصد الزيارة."],
    ["لا تسأل بإلحاح عن تفاصيل المرض","اترك له مساحة ليتحدث إن أراد، ولا تجعل الزيارة استجوابًا."],
    ["قدّم مساعدة عملية إن أمكن","كلمة 'أنا موجود لو احتجت حاجة' أحيانًا أهم من الكلام المجامل."]
  ]));
  return frag;
}

function panelCondolence(){
  const frag=document.createElement("div");
  frag.className="prose";
  frag.innerHTML='<p>العزاء مواساة للحزين وتذكير بالصبر، لا مجرد عبارات مكررة.</p>';
  frag.appendChild(duaBox(
    "إِنَّ لِلَّهِ مَا أَخَذَ وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمًّى، فَلْتَصْبِرْ وَلْتَحْتَسِبْ",
    "متفق عليه — قالها النبي ﷺ لمن نُعي لها ولدها"
  ));
  frag.appendChild(tipsList([
    ["واسِ بصدق لا بعبارات جاهزة فقط","اسمع أكثر مما تتكلم، فالحضور الصادق يواسي أكثر من الكلام المحفوظ."],
    ["اذكر محاسن المتوفى بإيجاز","إن كنت تعرفه، فذكر موقف طيب له يخفف على أهله."],
    ["ادعُ للمتوفى وأهله","اللهم اغفر له وارحمه، اللهم اربط على قلوب أهله واصبرهم."],
    ["لا تسأل عن تفاصيل الوفاة بإلحاح","اترك ذلك لهم إن أرادوا الحديث عنه."],
    ["ساعد عمليًا إن استطعت","تجهيز طعام، مرافقة، أو قضاء حاجة، من أرقى صور العزاء."],
    ["احترم مهلة العزاء الشرعية","لا حِداد يتجاوز ثلاثة أيام إلا للزوجة (عدة الوفاة)، فلا تُطل الجلسات الرسمية للعزاء أكثر من اللازم."]
  ]));
  return frag;
}

function panelCongrats(){
  const frag=document.createElement("div");
  frag.className="prose";
  frag.innerHTML='<p>التهنئة بالمناسبات السارة (زواج، مولود، نجاح) من حسن الأخوة والمشاركة الوجدانية.</p>';
  frag.appendChild(duaBox(
    "بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ",
    "رواه أبو داود والترمذي — دعاء تهنئة الزواج"
  ));
  frag.appendChild(tipsList([
    ["هنّئ بسرعة معقولة","التهنئة القريبة من المناسبة أبلغ في إظهار المشاركة الحقيقية."],
    ["ادعُ بدل مجرد 'مبروك'","دعاء صادق مثل 'بارك الله لك وأتمّ عليك نعمته' أعمق أثرًا."],
    ["لمولود جديد","يُستحب دعاء: بارك الله لك في الموهوب، وشكرت الواهب، وبلغ أشده، ورُزقت بره."],
    ["لنجاح أو إنجاز","اجعل التهنئة تعترف بالجهد لا بالحظ فقط، فهذا أصدق تقديرًا."],
    ["لا تُتبع التهنئة بمقارنة","تجنّب 'أنا كنت أفضل منك' أو مقارنات تُنقص من فرحة الآخر."]
  ]));
  return frag;
}

function panelGeneral(){
  const frag=document.createElement("div");
  frag.className="prose";
  frag.appendChild(tipsList([
    ["استأذن قبل الدخول","اطرق أو اتصل قبل الزيارة، ولا تدخل بيتًا دون إذن أهله."],
    ["اختر وقتًا لائقًا","تجنّب أوقات الصلاة، النوم، أو أوقات الطعام المعتادة إلا بدعوة."],
    ["لا تُطل الجلوس دون داعٍ","خاصة في زيارات المجاملة، فحسن الضيافة يشمل معرفة وقت الانصراف."],
    ["اغتنم الزيارة للدعاء والذكر","كل تجمع مسلمين فرصة لكلمة طيبة أو دعاء أو تذكير بخير."]
  ]));
  const box=document.createElement("div");
  box.className="avoid";
  box.innerHTML='<b>تنبيه:</b> هذه آداب عامة مستخلصة من السنة والعرف الحسن، وقد تختلف تفاصيلها بحسب العادات المحلية طالما لا تخالف الشرع.';
  frag.appendChild(box);
  return frag;
}

const TABS = [
  ["sick","عيادة المريض", panelSick],
  ["condolence","العزاء", panelCondolence],
  ["congrats","التهنئة", panelCongrats],
  ["general","آداب عامة", panelGeneral]
];
const tabsEl=document.getElementById("tabs");
const main=document.getElementById("main");
const panels={};
TABS.forEach(([id,label,build],i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=label;
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.addEventListener("click",()=>select(id));
  tabsEl.appendChild(b);
  const s=document.createElement("section");
  if(i!==0) s.hidden=true;
  s.appendChild(build());
  main.appendChild(s);
  panels[id]=s;
});
function select(id){
  TABS.forEach(([t],i)=>{
    panels[t].hidden = t!==id;
    tabsEl.children[i].setAttribute("aria-selected", t===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
<script type="module">
  import { createSearchModal } from "./src/components/search-modal.js";
  createSearchModal();
</script>
</body>
</html>
