<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="storage-fallback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السيرة النبوية — خط زمني</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tools.css">
<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 18px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(1.9rem,7vw,2.7rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:42ch;margin:.4rem auto 0}

  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;z-index:5;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{font-family:"Cairo";font-weight:600;font-size:.82rem;background:none;border:0;color:var(--ink-soft);
    padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  section[hidden]{display:none}

  .timeline{position:relative;margin:24px 0;padding-inline-start:26px;border-inline-start:2px solid var(--gold-soft)}
  .event{position:relative;margin-bottom:20px}
  .event::before{
    content:"";position:absolute;inline-size:12px;block-size:12px;border-radius:50%;
    background:var(--gold);inset-inline-start:-33px;top:4px;border:2px solid var(--paper);
  }
  .event .age{font-family:"Amiri",serif;font-size:.85rem;color:var(--gold);margin:0 0 2px}
  .event h3{margin:0 0 6px;font-size:1.05rem}
  .event p{margin:0;font-size:.9rem;color:var(--ink-soft)}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>
<style>
/* cross-device responsiveness: phones, tablets, laptops */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],input[type="button"],input[type="submit"]{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button,.tab,.cat,.subtab,.fbtn,.gbtn,.pbtn,.setbtn,.sortbtn{min-height:38px}
@media (min-width:600px){
  input,select,textarea{font-size:.92rem!important}
}
@media (min-width:900px){
  .wrap{padding-left:32px;padding-right:32px}
  body{font-size:1.02rem}
}
@media (min-width:1200px){
  .wrap{max-width:min(78vw,900px)}
}
@media (max-width:360px){
  .wrap{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:500px){
  header{padding-top:14px;padding-bottom:10px}
}
</style>
<style>
/* Emerald & Gold glassmorphism accent layer */
:root{
  --glass-bg: rgba(255,255,255,.55);
  --glass-border: rgba(255,255,255,.35);
  --glass-shadow: 0 8px 32px rgba(19,50,44,.12);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --glass-bg: rgba(18,46,40,.55);
    --glass-border: rgba(255,255,255,.08);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --glass-bg: rgba(18,46,40,.55);
  --glass-border: rgba(255,255,255,.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.35);
}
body{
  background-image:
    radial-gradient(circle at 12% 8%, rgba(156,116,32,.10), transparent 32%),
    radial-gradient(circle at 88% 18%, rgba(47,107,79,.12), transparent 38%),
    radial-gradient(circle at 50% 95%, rgba(156,116,32,.06), transparent 40%);
  background-attachment:fixed;
}
.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,
details.item, details.site, .timecard, .gcard, .item, .hadith, .tool, .catbtn, .fcard,
.hcard, .warnbox, .continuebar{
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  background-color: var(--glass-bg) !important;
  border-color: var(--glass-border) !important;
  box-shadow: var(--glass-shadow);
}
header{
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
</style>
</head>
<body>
<a class="back-link" href="index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>

<div class="wrap">
<header>
  <h1>السيرة النبوية</h1>
  <p>خط زمني لأهم أحداث حياة النبي محمد ﷺ، من المولد إلى الوفاة.</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<footer>لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ</footer>
</div>

<script>
const PHASES = {
  mecca_early: {
    label:"الطفولة والشباب",
    items:[
      ["عام الفيل","وُلد النبي ﷺ في مكة، في العام الذي حاول فيه أبرهة هدم الكعبة فأهلك الله جيشه بطير أبابيل، وتوفي والده عبد الله قبل ولادته."],
      ["الرضاعة","أرضعته حليمة السعدية في بادية بني سعد، وعاش عندها سنوات طفولته الأولى."],
      ["وفاة الأم","توفيت أمه آمنة وعمره ست سنوات، فكفله جده عبد المطلب، ثم توفي الجد فكفله عمه أبو طالب."],
      ["رعي الغنم والتجارة","عمل في رعي الغنم صغيرًا، ثم عمل بالتجارة، واشتهر بين قومه بالصدق والأمانة حتى لُقّب بالصادق الأمين."],
      ["الزواج من خديجة","تزوج من السيدة خديجة بنت خويلد وعمره خمس وعشرون سنة، وكانت أول من آمن به من الناس."]
    ]
  },
  revelation: {
    label:"بداية الوحي",
    items:[
      ["غار حراء","كان يتعبد ويتفكر في غار حراء قبل البعثة، بعيدًا عن ضجيج الحياة."],
      ["نزول الوحي","نزل عليه جبريل عليه السلام وعمره أربعون سنة، وأمره بقراءة أول آيات سورة العلق، فكانت بداية النبوة."],
      ["الدعوة السرية","دعا أقرب الناس إليه سرًا ثلاث سنوات، فآمن خديجة وأبو بكر وعلي وزيد بن حارثة وآخرون."],
      ["الدعوة الجهرية","أُمر بإعلان الدعوة، فجاهر بها فآذاه المشركون وقاطعوا بني هاشم اقتصاديًا واجتماعيًا سنوات."],
      ["عام الحزن","توفيت خديجة زوجته وأبو طالب عمه في عام واحد، فاشتد عليه الأذى من قريش."],
      ["الإسراء والمعراج","أُسري به من مكة إلى المسجد الأقصى ثم عُرج به إلى السماوات العلا، وفُرضت فيها الصلوات الخمس."]
    ]
  },
  hijrah: {
    label:"الهجرة",
    items:[
      ["بيعتا العقبة","بايعه أهل يثرب (المدينة) على نصرته وحمايته في بيعتين متتاليتين."],
      ["الهجرة إلى المدينة","هاجر مع أبي بكر الصديق من مكة إلى المدينة هربًا من مؤامرة قريش لقتله، واختبآ في غار ثور."],
      ["بناء المسجد النبوي","أول عمل قام به في المدينة بناء المسجد كمركز للعبادة والتعليم واجتماع المسلمين."],
      ["المؤاخاة","آخى بين المهاجرين والأنصار، فتقاسموا المال والسكن حتى صاروا كالإخوة."],
      ["وثيقة المدينة","وضع دستورًا ينظم العلاقة بين المسلمين واليهود وسائر سكان المدينة."]
    ]
  },
  ghazawat: {
    label:"الغزوات",
    items:[
      ["غزوة بدر الكبرى","أول معركة كبرى، انتصر فيها المسلمون رغم قلة عددهم وعتادهم على جيش قريش."],
      ["غزوة أُحد","ابتلي المسلمون فيها بجراح كبيرة بعد مخالفة بعض الرماة لأمر النبي ﷺ، وفيها استشهد حمزة عمه."],
      ["غزوة الخندق","حفر المسلمون خندقًا حول المدينة بمشورة سلمان الفارسي، ففشل حصار الأحزاب لهم."],
      ["صلح الحديبية","عقد النبي ﷺ صلحًا مع قريش بدا في ظاهره مجحفًا، لكنه كان فتحًا عظيمًا مهّد لدخول الناس في الإسلام أفواجًا."],
      ["فتح مكة","دخل النبي ﷺ مكة فاتحًا دون قتال يُذكر، وعفا عن أهلها الذين آذوه سنين طويلة، وحطّم الأصنام حول الكعبة."],
      ["حجة الوداع","حج النبي ﷺ حجته الوحيدة، وألقى خطبته الجامعة التي أرسى فيها مبادئ العدل والمساواة وحرمة الدماء والأموال."]
    ]
  },
  wafat: {
    label:"الوفاة",
    items:[
      ["اكتمال الدين","نزل قوله تعالى: ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾ في حجة الوداع، إيذانًا بقرب اكتمال الرسالة."],
      ["المرض الأخير","مرض النبي ﷺ أيامًا، وأمّ الناس أبو بكر الصديق في الصلاة نيابة عنه."],
      ["الوفاة","توفي النبي ﷺ في المدينة المنورة وعمره ثلاث وستون سنة، ودُفن في حجرة عائشة رضي الله عنها بجوار مسجده."],
      ["الأثر الباقي","ترك للأمة القرآن والسنة، وقال: «تركت فيكم أمرين لن تضلوا ما تمسكتم بهما: كتاب الله وسنة نبيه»."]
    ]
  }
};

const KEYS = Object.keys(PHASES);
const tabsEl=document.getElementById("tabs");
const main=document.getElementById("main");
const panels={};

function build(items){
  const tl=document.createElement("div");
  tl.className="timeline";
  items.forEach(([title,desc])=>{
    const e=document.createElement("div");
    e.className="event";
    e.innerHTML='<h3>'+title+'</h3><p>'+desc+'</p>';
    tl.appendChild(e);
  });
  return tl;
}

KEYS.forEach((k,i)=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.textContent=PHASES[k].label;
  b.setAttribute("aria-selected", i===0?"true":"false");
  b.addEventListener("click",()=>select(k));
  tabsEl.appendChild(b);

  const s=document.createElement("section");
  if(i!==0) s.hidden=true;
  s.appendChild(build(PHASES[k].items));
  main.appendChild(s);
  panels[k]=s;
});

function select(id){
  KEYS.forEach((k,i)=>{
    panels[k].hidden = k!==id;
    tabsEl.children[i].setAttribute("aria-selected", k===id?"true":"false");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
</body>
</html>
