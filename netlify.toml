[build]
  command = "npm run build:pages"
  publish = "dist"

[[redirects]]
  from = "/quran"
  to = "/30-quran-full.html"
  status = 301
  force = true

[[redirects]]
  from = "/azkar"
  to = "/25-azkar-shamila.html"
  status = 301
  force = true

[[redirects]]
  from = "/azkar/morning"
  to = "/25-azkar-shamila.html#sabah"
  status = 301
  force = true

[[redirects]]
  from = "/azkar/evening"
  to = "/25-azkar-shamila.html#masaa"
  status = 301
  force = true

[[redirects]]
  from = "/azkar/sleep"
  to = "/25-azkar-shamila.html#nawm"
  status = 301
  force = true

[[redirects]]
  from = "/azkar/after-prayer"
  to = "/25-azkar-shamila.html"
  status = 301
  force = true

[[redirects]]
  from = "/dua"
  to = "/25-azkar-shamila.html"
  status = 301
  force = true

[[redirects]]
  from = "/hadith"
  to = "/27-hadith.html"
  status = 301
  force = true

[[redirects]]
  from = "/tasbeeh"
  to = "/15-tasbeeh-jamai.html"
  status = 301
  force = true

[[redirects]]
  from = "/qibla"
  to = "/22-qibla.html"
  status = 301
  force = true

[[redirects]]
  from = "/prayer-times"
  to = "/29-prayer-times.html"
