<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورقة المراجعة العلمية — المكتبة الإسلامية</title>
<meta name="description" content="ورقة مراجعة داخلية: كل نصّ منسوب إلى أهله مع حالة تخريجه، جاهزة للمراجعة من طالب علم.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12664a">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="../../fonts.css">
<link rel="stylesheet" href="site.css">
<style>
  body { padding-block: 24px 64px; }
  .sheet { max-width: 60rem; margin-inline: auto; }
  .sheet-head { margin-bottom: 20px; }
  .sheet-head h1 { font-size: 1.6rem; margin-block: 0 6px; }
  .notice {
    border: 1px solid rgba(201,162,39,.4); background: rgba(201,162,39,.1);
    border-radius: 12px; padding: 12px 14px; margin-block: 14px; font-size: .92rem; line-height: 1.9;
  }
  .tally { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 14px; }
  .tally span {
    font-size: .8rem; padding: 5px 12px; border-radius: 999px;
    border: 1px solid rgba(128,128,128,.35); font-variant-numeric: tabular-nums;
  }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 14px; }
  .tools input, .tools select {
    padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(128,128,128,.4);
    background: var(--card, #fff); color: inherit; font: inherit;
  }
  .tools input { flex: 1 1 14rem; }
  .chip {
    cursor: pointer; font: inherit; font-size: .8rem; padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit;
  }
  .chip[aria-pressed="true"] { background: #12664a; border-color: #12664a; color: #fff; }
  .grp { margin-block-end: 28px; }
  .grp > h2 {
    display: flex; align-items: center; gap: 10px; font-size: 1.15rem;
    border-bottom: 2px solid rgba(201,162,39,.35); padding-bottom: 8px; margin-block: 0 4px;
  }
  .grp > h2 .count { font-size: .78rem; font-weight: 400; opacity: .7; }
  .grp > .verdict { font-size: .82rem; margin-block: 6px 12px; }
  .entry {
    border: 1px solid rgba(128,128,128,.25); border-radius: 12px;
    padding: 12px 14px; margin-block-end: 10px;
  }
  .entry.bad { border-inline-start: 4px solid #c0392b; }
  .entry.weak { border-inline-start: 4px solid #d68910; }
  .entry.good { border-inline-start: 4px solid #12664a; }
  .entry .t { font-weight: 700; font-size: .95rem; margin-block-end: 6px; }
  .entry .x { font-family: "Amiri", serif; font-size: 1.05rem; line-height: 2.1; }
  .entry .r { font-size: .8rem; margin-block-start: 8px; opacity: .85; }
  .entry .r b { font-weight: 700; }
  .tag {
    display: inline-block; font-size: .72rem; padding: 2px 9px; border-radius: 999px;
    margin-inline-start: 6px; vertical-align: middle;
  }
  .tag.bad { background: rgba(192,57,43,.16); color: #c0392b; }
  .tag.weak { background: rgba(214,137,16,.18); color: #a06a08; }
  .tag.good { background: rgba(18,102,74,.16); color: #12664a; }
  [data-theme="dark"] .entry { background: rgba(255,255,255,.03); }
  .empty { opacity: .7; font-size: .9rem; }
  @media print {
    .tools, .notice { display: none; }
    .entry { break-inside: avoid; }
  }
</style>
<script>
  try {
    var saved = JSON.parse(localStorage.getItem("theme") || "null");
    if (saved) document.documentElement.dataset.theme = saved;
    else if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
  } catch (error) {}
</script>
</head>
<body>
<a class="back-link" href="../../index.html" aria-label="الرجوع إلى المكتبة">‹ المكتبة</a>
<main class="sheet">
  <div class="sheet-head">
    <h1>ورقة المراجعة العلمية</h1>
    <p class="empty" id="subtitle">جارٍ التحميل…</p>
  </div>

  <div class="notice">
    هذه الورقة <b>أداة مراجعة</b> لا مرجعَ فقهي. تعرض كل نصّ منسوب إلى أهله مع تخريجه
    القائم في ملفات البيانات، فقط ليُراجَع النصّ والتخريج من أهل العلم قبل النشر.
    الأداة لا تصحّح ولا تُقيّم؛ وكل ما يظهر هنا حرفيًّا كما هو في `src/data/`.
  </div>

  <div class="tally" id="tally"></div>

  <div class="tools">
    <input id="q" type="search" placeholder="ابحث في النصوص والتخريج…" aria-label="بحث">
    <select id="filter" aria-label="تصفية بحسب الحالة">
      <option value="all">كل الحالات</option>
      <option value="بلا تخريج">بلا تخريج</option>
      <option value="اسم مجموعة">اسم مجموعة فقط</option>
      <option value="مخرَّج">مخرَّج</option>
      <option value="آية">آية</option>
    </select>
    <button class="chip" id="print" type="button">🖨️ طباعة</button>
  </div>

  <div id="sheet"><p class="empty">جارٍ التحميل…</p></div>
</main>

<script type="module">
  import { ATTRIBUTED, entriesOf, STATUS_LABEL } from "../lib/review.js";
  import { APP_DUAS } from "../data/app-duas.js";
  import { HADITHS } from "../data/hadiths.js";
  import { ATHKAR_DATA } from "../data/app-athkar.js";
  import { SEERAH } from "../data/seerah.js";
  import { PROPHETS } from "../data/prophets.js";
  import { SAYINGS } from "../data/sayings.js";
  import { EXTRA_LESSONS } from "../data/lessons-extra.js";
  import { FORBIDDEN_PRAYER_TIMES } from "../data/forbidden-times.js";
  import { escapeHtml, normalizeAr } from "../lib/text.js";

  const MODULES = { APP_DUAS, HADITHS, ATHKAR_DATA, SEERAH, PROPHETS, SAYINGS, EXTRA_LESSONS, FORBIDDEN_PRAYER_TIMES };

  const GROUPS = ATTRIBUTED.map((group) => ({ ...group, entries: entriesOf(group, MODULES) }));

  const byId = (id) => document.getElementById(id);
  const TONE = { "بلا تخريج": "bad", "اسم مجموعة": "weak", "مخرَّج": "good", "آية": "good" };

  let query = "";
  let filter = "all";

  const matches = (entry) =>
    (filter === "all" || entry.status === filter) &&
    (!query || normalizeAr(`${entry.title} ${entry.text} ${entry.ref}`).includes(query));

  function render() {
    const total = GROUPS.reduce((sum, group) => sum + group.entries.length, 0);
    const counts = {};
    for (const group of GROUPS) {
      for (const entry of group.entries) counts[entry.status] = (counts[entry.status] ?? 0) + 1;
    }
    byId("subtitle").textContent = `${total} نصًّا في ${GROUPS.length} مجموعات`;
    byId("tally").innerHTML = Object.entries(STATUS_LABEL)
      .map(([status, label]) => `<span>${escapeHtml(label)}: ${counts[status] ?? 0}</span>`)
      .join("");

    byId("sheet").innerHTML = GROUPS.map((group) => {
      const entries = group.entries.filter(matches);
      const missing = group.entries.filter((entry) => entry.status === "بلا تخريج").length;
      const verdict = missing
        ? group.advisory
          ? `<span class="verdict">⚠️ ${group.label}: ${missing} عنصرًا بلا تخريج — يحتاج مراجعة</span>`
          : `<span class="verdict">⛔ ${group.label}: ${missing} عنصرًا بلا تخريج — يمنع النشر</span>`
        : `<span class="verdict">✔ ${group.label}: كل العناصر موثّقة</span>`;

      const body = entries.length
        ? entries
            .map(
              (entry) => `<article class="entry ${TONE[entry.status]}">
        <div class="t">${escapeHtml(entry.title)}
          <span class="tag ${TONE[entry.status]}">${escapeHtml(STATUS_LABEL[entry.status])}</span></div>
        <div class="x">${escapeHtml(entry.text)}</div>
        <div class="r">التخريج القائم: <b>${entry.ref ? (entry.url ? `<a href="${escapeHtml(entry.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(entry.ref)}</a>` : escapeHtml(entry.ref)) : "— لا يوجد —"}</b></div>
      </article>`,
            )
            .join("")
        : `<p class="empty">لا عناصر مطابقة.</p>`;

      return `<section class="grp"><h2>${escapeHtml(group.label)}
        <span class="count">${group.entries.length} عنصرًا</span></h2>${verdict}${body}</section>`;
    }).join("");
  }

  byId("q").addEventListener("input", (event) => {
    query = normalizeAr(event.target.value.trim());
    render();
  });
  byId("filter").addEventListener("change", (event) => {
    filter = event.target.value;
    render();
  });
  byId("print").addEventListener("click", () => window.print());

  render();
</script>
</body>
</html>
