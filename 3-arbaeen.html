<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14); --card:#FFFAF0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16); --card:#122E28;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-size:clamp(2rem,7vw,2.8rem);margin:0}
  header p{color:var(--ink-soft);font-size:.9rem;max-width:38ch;margin:.4rem auto 0}
  .search{
    display:block;width:100%;max-width:420px;margin:18px auto 0;padding:10px 16px;
    border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:"Cairo";font-size:.9rem;
  }
  .list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  article.h{
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  }
  article.h > summary, article.h > .head{
    display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none;
  }
  article.h > summary::-webkit-details-marker{display:none}
  .badge{
    font-family:"Amiri",serif;font-weight:700;color:var(--gold);min-width:28px;text-align:center;font-size:1.05rem;
  }
  .title{flex:1;font-weight:700;font-size:.98rem}
  .chev{color:var(--ink-soft);transition:transform .15s ease}
  article.h[open] .chev{transform:rotate(90deg)}
  .body{padding:0 16px 18px}
  .arabic{font-family:"Amiri",serif;font-size:1.18rem;line-height:2;margin:0 0 10px}
  .who{font-size:.82rem;color:var(--ink-soft);margin:0 0 12px}
  .sharh{
    background:var(--paper-2);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--ink-soft);
  }
  .sharh b{color:var(--ink);font-weight:700}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}
</style>

.card, .hcard, .dhikr, .ayah, .todaybox, .nextbox, .duabox, .fastcard, .rec, .topiccard,

<script>
const H = [
["إنما الأعمال بالنيات","عن عمر بن الخطاب رضي الله عنه، عن النبي ﷺ",
"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ. (رواه البخاري ومسلم)",
"أصل عظيم: قيمة العمل بنيته، فالعمل الواحد قد يكون عبادة أو عادة بحسب ما نواه صاحبه. لذا ينبغي تجديد النية وإخلاصها لله قبل كل عمل."],
["حديث جبريل: الإسلام والإيمان والإحسان","عن عمر بن الخطاب رضي الله عنه",
"بَيْنَمَا نَحْنُ عِنْدَ رَسُولِ اللَّهِ ﷺ ذَاتَ يَوْمٍ، إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعَرِ... فَسَأَلَهُ عَنِ الْإِسْلَامِ، وَالْإِيمَانِ، وَالْإِحْسَانِ، ثُمَّ قَالَ: «فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ». (رواه مسلم)",
"يبيّن مراتب الدين الثلاث: الإسلام (الأعمال الظاهرة)، والإيمان (عقائد القلب)، والإحسان (أن تعبد الله كأنك تراه)."],
["بني الإسلام على خمس","عن عبد الله بن عمر رضي الله عنهما",
"بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ. (رواه البخاري ومسلم)",
"أركان الإسلام الخمسة هي الأساس الذي يقوم عليه بنيان الدين كله."],
["خلق الإنسان وأطوار الجنين","عن عبد الله بن مسعود رضي الله عنه",
"إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يُرْسَلُ إِلَيْهِ الْمَلَكُ فَيَنْفُخُ فِيهِ الرُّوحَ، وَيُؤْمَرُ بِأَرْبَعِ كَلِمَاتٍ: بِكَتْبِ رِزْقِهِ، وَأَجَلِهِ، وَعَمَلِهِ، وَشَقِيٍّ أَوْ سَعِيدٍ. (رواه البخاري ومسلم)",
"يبيّن أطوار خلق الإنسان، وأن الرزق والأجل والعمل مقدّرة من قبل أن يولد الإنسان، وأن الأعمال بالخواتيم."],
["من أحدث في أمرنا ما ليس منه فهو رد","عن عائشة رضي الله عنها",
"مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ. (رواه البخاري ومسلم)",
"أصل في رد كل بدعة محدثة في الدين، فالعبادات توقيفية لا تُبتدع فيها من عند النفس."],
["الحلال بيّن والحرام بيّن","عن النعمان بن بشير رضي الله عنهما",
"الْحَلَالُ بَيِّنٌ، وَالْحَرَامُ بَيِّنٌ، وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ لَا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ، فَمَنِ اتَّقَى الشُّبُهَاتِ فَقَدِ اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ. (رواه البخاري ومسلم)",
"يرشد إلى ترك المشتبهات حفاظًا على الدين والعرض، وأن القلب هو محل صلاح الجسد كله."],
["الدين النصيحة","عن تميم الداري رضي الله عنه",
"الدِّينُ النَّصِيحَةُ. قُلْنَا: لِمَنْ؟ قَالَ: لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ الْمُسْلِمِينَ، وَعَامَّتِهِمْ. (رواه مسلم)",
"النصيحة أساس متين للدين، وتشمل الإخلاص لله واتباع كتابه ونصرة رسوله وإرشاد الحكام والعامة."],
["أُمرت أن أقاتل الناس حتى يشهدوا","عن ابن عمر رضي الله عنهما",
"أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ، فَإِذَا فَعَلُوا ذَلِكَ عَصَمُوا مِنِّي دِمَاءَهُمْ وَأَمْوَالَهُمْ إِلَّا بِحَقِّ الْإِسْلَامِ. (رواه البخاري ومسلم)",
"أن عصمة الدم والمال في الإسلام مرتبطة بإقرار الشهادتين وإقامة الصلاة والزكاة."],
["ما نهيتكم عنه فاجتنبوه","عن أبي هريرة رضي الله عنه",
"مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ. (رواه البخاري ومسلم)",
"قاعدة في التعامل مع الأوامر والنواهي: الاجتناب التام للمحرم، والفعل بحسب الاستطاعة للمأمور."],
["إن الله طيب لا يقبل إلا طيبًا","عن أبي هريرة رضي الله عنه",
"إِنَّ اللَّهَ طَيِّبٌ لَا يَقْبَلُ إِلَّا طَيِّبًا... ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ، يَمُدُّ يَدَيْهِ إِلَى السَّمَاءِ: يَا رَبِّ يَا رَبِّ، وَمَطْعَمُهُ حَرَامٌ، وَمَشْرَبُهُ حَرَامٌ، وَمَلْبَسُهُ حَرَامٌ، وَغُذِيَ بِالْحَرَامِ، فَأَنَّى يُسْتَجَابُ لَهُ. (رواه مسلم)",
"أهمية طيب المكسب والمطعم في قبول الدعاء والعمل، وأن الحرام يحجب استجابة الدعاء."],
["دع ما يريبك إلى ما لا يريبك","عن الحسن بن علي رضي الله عنهما",
"دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ. (رواه الترمذي والنسائي)",
"قاعدة في الورع: ترك ما فيه شك إلى ما لا شك فيه، طمأنينة للقلب وسلامة للدين."],
["من حسن إسلام المرء تركه ما لا يعنيه","عن أبي هريرة رضي الله عنه",
"مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ. (رواه الترمذي)",
"حديث جامع في حفظ الوقت والجهد فيما ينفع، وترك الفضول فيما لا يعني الإنسان من قول أو فعل."],
["لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه","عن أنس بن مالك رضي الله عنه",
"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ. (رواه البخاري ومسلم)",
"أصل عظيم في الأخوة الإيمانية ومحبة الخير للآخرين كما يحبه الإنسان لنفسه."],
["لا يحل دم امرئ مسلم إلا بإحدى ثلاث","عن ابن مسعود رضي الله عنه",
"لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ يَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنِّي رَسُولُ اللَّهِ إِلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ الْمُفَارِقُ لِلْجَمَاعَةِ. (رواه البخاري ومسلم)",
"بيان عِظَم حرمة الدم المسلم، وأنه لا يُستباح إلا في حالات محددة شرعًا."],
["من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت","عن أبي هريرة رضي الله عنه",
"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ جَارَهُ، وَمَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيُكْرِمْ ضَيْفَهُ. (رواه البخاري ومسلم)",
"ربط حفظ اللسان وإكرام الجار والضيف بحقيقة الإيمان بالله واليوم الآخر."],
["لا تغضب","عن أبي هريرة رضي الله عنه",
"جَاءَ رَجُلٌ إِلَى النَّبِيِّ ﷺ فَقَالَ: أَوْصِنِي، قَالَ: «لَا تَغْضَبْ»، فَرَدَّدَ مِرَارًا قَالَ: «لَا تَغْضَبْ». (رواه البخاري)",
"وصية جامعة، لأن الغضب أصل كثير من الآفات والذنوب، وكظمه من علامات القوة الحقيقية."],
["إن الله كتب الإحسان على كل شيء","عن شداد بن أوس رضي الله عنه",
"إِنَّ اللَّهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا الْقِتْلَةَ، وَإِذَا ذَبَحْتُمْ فَأَحْسِنُوا الذَّبْحَ، وَلْيُحِدَّ أَحَدُكُمْ شَفْرَتَهُ، وَلْيُرِحْ ذَبِيحَتَهُ. (رواه مسلم)",
"الإحسان مطلوب في كل شأن حتى في إزهاق الأرواح المأذون بها شرعًا، فكيف بمعاملة الأحياء."],
["اتق الله حيثما كنت","عن أبي ذر ومعاذ رضي الله عنهما",
"اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ. (رواه الترمذي)",
"ثلاث وصايا جامعة: تقوى الله في السر والعلن، والمبادرة بالحسنات بعد الذنب، وحسن الخلق مع الناس."],
["احفظ الله يحفظك","عن ابن عباس رضي الله عنهما",
"احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ، إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ... وَاعْلَمْ أَنَّ النَّصْرَ مَعَ الصَّبْرِ، وَأَنَّ الْفَرَجَ مَعَ الْكَرْبِ، وَأَنَّ مَعَ الْعُسْرِ يُسْرًا. (رواه الترمذي)",
"أصل عظيم في التوكل على الله وحده في السؤال والاستعانة، وأن الفرج يأتي بعد الشدة."],
["استحيوا من الله حق الحياء","عن ابن مسعود رضي الله عنه",
"اسْتَحْيُوا مِنَ اللَّهِ حَقَّ الْحَيَاءِ... فَمَنِ اسْتَحْيَا مِنَ اللَّهِ حَقَّ الْحَيَاءِ فَلْيَحْفَظِ الرَّأْسَ وَمَا وَعَى، وَلْيَحْفَظِ الْبَطْنَ وَمَا حَوَى، وَلْيَذْكُرِ الْمَوْتَ وَالْبِلَى. (رواه الترمذي)",
"الحياء الحقيقي من الله يشمل حفظ الجوارح والفكر وتذكر الآخرة، لا مجرد خجل ظاهري."],
["استقم","عن سفيان بن عبد الله رضي الله عنه",
"قُلْتُ: يَا رَسُولَ اللَّهِ، قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ، قَالَ: «قُلْ آمَنْتُ بِاللَّهِ ثُمَّ اسْتَقِمْ». (رواه مسلم)",
"جماع الدين كله في كلمتين: الإيمان الصادق، والثبات عليه استقامةً في القول والعمل."],
["إن الرجل ليتكلم بالكلمة يهوي بها في النار","عن أبي هريرة رضي الله عنه",
"إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مِنْ رِضْوَانِ اللَّهِ لَا يُلْقِي لَهَا بَالًا، يَرْفَعُهُ اللَّهُ بِهَا دَرَجَاتٍ، وَإِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مِنْ سَخَطِ اللَّهِ لَا يُلْقِي لَهَا بَالًا، يَهْوِي بِهَا فِي جَهَنَّمَ. (رواه البخاري)",
"خطورة الكلمة وإن بدت يسيرة، فقد ترفع صاحبها درجات أو تهوي به في النار."],
["مثل المؤمنين في توادهم وتراحمهم","عن النعمان بن بشير رضي الله عنهما",
"مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ، إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى. (رواه البخاري ومسلم)",
"وحدة الأمة المسلمة كوحدة الجسد الواحد، يتألم كله لألم أي عضو فيه."],
["لن يدخل أحدكم الجنة بعمله","عن أبي هريرة رضي الله عنه",
"لَنْ يُدْخِلَ أَحَدًا مِنْكُمْ عَمَلُهُ الْجَنَّةَ... وَلَا أَنَا، إِلَّا أَنْ يَتَغَمَّدَنِيَ اللَّهُ بِرَحْمَةٍ مِنْهُ وَفَضْلٍ، فَسَدِّدُوا وَقَارِبُوا. (رواه البخاري ومسلم)",
"لا ينجي العبد من النار ولا يدخله الجنة عمله وحده، بل رحمة الله، فليجتهد العبد ويقارب دون غلو."],
["كل ابن آدم خطّاء","عن أنس بن مالك رضي الله عنه",
"كُلُّ ابْنِ آدَمَ خَطَّاءٌ، وَخَيْرُ الْخَطَّائِينَ التَّوَّابُونَ. (رواه الترمذي)",
"تطمين للعبد بأن الخطأ من طبيعة البشر، وأن الفضل في المبادرة بالتوبة لا في العصمة."],
["مثل ما بعثني الله به من الهدى والعلم","عن أبي موسى الأشعري رضي الله عنه",
"مَثَلُ مَا بَعَثَنِي اللَّهُ بِهِ مِنَ الْهُدَى وَالْعِلْمِ كَمَثَلِ الْغَيْثِ الْكَثِيرِ أَصَابَ أَرْضًا... (رواه البخاري ومسلم)",
"تشبيه لتفاوت الناس في قبول العلم والهدى النبوي، فمنهم من ينتفع وينفع، ومنهم من لا يقبل شيئًا."],
["إن الله لا ينظر إلى صوركم وأموالكم","عن أبي هريرة رضي الله عنه",
"إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ. (رواه مسلم)",
"مقياس القيمة عند الله هو صلاح القلب وحسن العمل، لا المظهر ولا المال."],
["كل سُلامى من الناس عليه صدقة","عن أبي هريرة رضي الله عنه",
"كُلُّ سُلَامَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ: تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ... وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ... وَتُمِيطُ الْأَذَى عَنِ الطَّرِيقِ صَدَقَةٌ. (رواه البخاري ومسلم)",
"أبواب الصدقة واسعة، تشمل كل عمل خير ولو كان يسيرًا كإماطة الأذى وكلمة طيبة."],
["اتق الله ولو بشق تمرة","عن عدي بن حاتم رضي الله عنه",
"اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ، فَمَنْ لَمْ يَجِدْ فَبِكَلِمَةٍ طَيِّبَةٍ. (رواه البخاري ومسلم)",
"لا تُحتقر الصدقة مهما قلّت، فالقليل المستمر خير من كثير منقطع، والكلمة الطيبة تكفي من لا يجد شيئًا."],
["الحلال بيّن والحرام بيّن (2) لا ضرر ولا ضرار","عن أبي سعيد الخدري رضي الله عنه",
"لَا ضَرَرَ وَلَا ضِرَارَ. (رواه ابن ماجه والدارقطني)",
"قاعدة فقهية عظيمة: لا يجوز إلحاق الضرر بالنفس ولا بالغير، ابتداءً ولا مقابلةً."],
["البينة على المدعي واليمين على من أنكر","عن ابن عباس رضي الله عنهما",
"لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، لَكِنَّ الْبَيِّنَةَ عَلَى الْمُدَّعِي، وَالْيَمِينَ عَلَى مَنْ أَنْكَرَ. (رواه البيهقي)",
"أصل قضائي: من ادّعى شيئًا فعليه إثباته بالدليل، ومن أنكر فيكفيه اليمين حتى يثبت خلافه."],
["ما نهيتكم عنه فاجتنبوه (تكرار المعنى: التيسير)","عن أبي هريرة رضي الله عنه",
"مَا أَمَرْتُكُمْ بِأَمْرٍ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ، وَمَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، فَإِنَّمَا أَهْلَكَ الَّذِينَ مِنْ قَبْلِكُمْ كَثْرَةُ مَسَائِلِهِمْ وَاخْتِلَافُهُمْ عَلَى أَنْبِيَائِهِمْ. (رواه البخاري ومسلم)",
"تحذير من كثرة السؤال والتكلّف والاختلاف على الأنبياء وورثتهم، وهو تتمة لحديث سابق بلفظ آخر."],
["إن لبدنك عليك حقًا","عن عبد الله بن عمرو رضي الله عنهما",
"يَا عَبْدَ اللَّهِ، أَلَمْ أُخْبَرْ أَنَّكَ تَصُومُ النَّهَارَ وَتَقُومُ اللَّيْلَ؟... إِنَّ لِجَسَدِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِعَيْنِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِزَوْجِكَ عَلَيْكَ حَقًّا، وَإِنَّ لِزَوْرِكَ عَلَيْكَ حَقًّا. (رواه البخاري)",
"التوازن مطلوب في العبادة، فلكل صاحب حق حقه: الجسد والأهل والضيف، ولا رهبانية في الإسلام."],
["لا طاعة لمخلوق في معصية الخالق","عن علي وابن مسعود رضي الله عنهما",
"لَا طَاعَةَ لِمَخْلُوقٍ فِي مَعْصِيَةِ الْخَالِقِ. (رواه أحمد)",
"أصل عظيم: الطاعة لولي الأمر والوالدين وغيرهم واجبة في المعروف فقط، لا في معصية الله."],
["إن الله حدّ حدودًا فلا تعتدوها","عن أبي ثعلبة الخشني رضي الله عنه",
"إِنَّ اللَّهَ فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً بِكُمْ مِنْ غَيْرِ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا. (رواه الدارقطني)",
"دعوة للوقوف عند حدود الشرع دون تفريط أو إفراط، وعدم التنقيب عما سكت عنه الشرع رحمة بالعباد."],
["إن الله رفيق يحب الرفق","عن عائشة رضي الله عنها",
"إِنَّ اللَّهَ رَفِيقٌ يُحِبُّ الرِّفْقَ فِي الْأَمْرِ كُلِّهِ. (رواه البخاري ومسلم)",
"الرفق صفة محبوبة عند الله في كل شأن، وهو سبب البركة والتوفيق في الأمور."],
["ما من مسلم يغرس غرسًا","عن أنس بن مالك رضي الله عنه",
"مَا مِنْ مُسْلِمٍ يَغْرِسُ غَرْسًا أَوْ يَزْرَعُ زَرْعًا، فَيَأْكُلُ مِنْهُ طَيْرٌ أَوْ إِنْسَانٌ أَوْ بَهِيمَةٌ إِلَّا كَانَ لَهُ بِهِ صَدَقَةٌ. (رواه البخاري ومسلم)",
"الغرس والزرع من أبواب الصدقة الجارية المستمرة الأجر ما دام ينتفع به أحد من الخلق."],
["الحياء لا يأتي إلا بخير","عن عمران بن حصين رضي الله عنهما",
"الْحَيَاءُ لَا يَأْتِي إِلَّا بِخَيْرٍ. (رواه البخاري ومسلم)",
"الحياء خُلُق نبيل يمنع صاحبه من القبيح ويحمله على كل جميل، فهو خير كله."],
["احفظ حرمة المسلم على المسلم","عن أبي هريرة رضي الله عنه",
"لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا. الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ وَلَا يَخْذُلُهُ وَلَا يَحْقِرُهُ. (رواه مسلم)",
"جماع لحقوق الأخوة الإسلامية، ونهي عن كل ما يفسد المودة بين المسلمين كالحسد والتباغض."],
["إن الله كتب الحسنات والسيئات","عن ابن عباس رضي الله عنهما",
"إِنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ لَهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ لَهُ عَشْرَ حَسَنَاتٍ إِلَى سَبْعِمِائَةِ ضِعْفٍ... وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ لَهُ حَسَنَةً كَامِلَةً، فَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً. (رواه البخاري ومسلم)",
"سعة رحمة الله في مضاعفة الحسنات وعدم مضاعفة السيئات، وأن مجرد نية الخير مثاب عليها."],
["اجعل قلبي نورًا","عن ابن عباس رضي الله عنهما — دعاء النبي ﷺ",
"كان النبي ﷺ يدعو: اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي بَصَرِي نُورًا، وَفِي سَمْعِي نُورًا... وَاجْعَلْنِي نُورًا. (رواه البخاري ومسلم)",
"دعاء جامع بطلب النور الحسي والمعنوي من الله في كل جانب من جوانب الحياة."],
["كن في الدنيا كأنك غريب","عن ابن عمر رضي الله عنهما",
"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ. (رواه البخاري)",
"دعوة للزهد وعدم التعلق بالدنيا، فهي دار عبور لا دار إقامة، والمؤمن يستعد فيها لرحيله."],
["احفظ نعمتين مغبون فيهما كثير من الناس","عن ابن عباس رضي الله عنهما",
"نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالْفَرَاغُ. (رواه البخاري)",
"تنبيه على قيمة الصحة والوقت، وأن كثيرًا من الناس يضيّعهما دون استثمار حقيقي فيما ينفع."],
["الدنيا حلوة خضرة","عن أبي سعيد الخدري رضي الله عنه",
"إِنَّ الدُّنْيَا حُلْوَةٌ خَضِرَةٌ، وَإِنَّ اللَّهَ مُسْتَخْلِفُكُمْ فِيهَا فَيَنْظُرُ كَيْفَ تَعْمَلُونَ، فَاتَّقُوا الدُّنْيَا وَاتَّقُوا النِّسَاءَ. (رواه مسلم)",
"تحذير من فتنة الدنيا وزينتها، فهي محل ابتلاء واختبار لا محل ركون واطمئنان."],
["لا يستقيم إيمان عبد حتى يستقيم قلبه","عن أنس بن مالك رضي الله عنه",
"لَا يَسْتَقِيمُ إِيمَانُ عَبْدٍ حَتَّى يَسْتَقِيمَ قَلْبُهُ، وَلَا يَسْتَقِيمُ قَلْبُهُ حَتَّى يَسْتَقِيمَ لِسَانُهُ. (رواه أحمد)",
"ترابط صلاح القلب واللسان والإيمان، فاستقامة أحدها مرتبطة باستقامة الآخر."],
["يا عبادي إني حرمت الظلم على نفسي","عن أبي ذر رضي الله عنه، فيما يرويه عن ربه تبارك وتعالى",

function render(filter){
  const list=document.getElementById("list");
  list.innerHTML="";
  const f=(filter||"").trim();
  H.forEach((h,i)=>{
    if(f && !(h[0]+h[2]+h[3]).includes(f)) return;
    const art=document.createElement("article");
    art.className="h";
    const det=document.createElement("details");
    det.innerHTML =
      '<summary><span class="badge">'+(i+1)+'</span><span class="title">'+h[0]+'</span><span class="chev">◀</span></summary>'+
      '<div class="body"><p class="arabic">'+h[2]+'</p><p class="who">'+h[1]+'</p>'+
      '<div class="sharh"><b>المعنى: </b>'+h[3]+'</div></div>';
    art.appendChild(det);
    list.appendChild(art);
  });
}
render("");
document.getElementById("search").addEventListener("input", e=>render(e.target.value));

<button id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:64px;z-index:50;background:var(--card,#FFFAF0);color:var(--ink,#13322C);border:1px solid var(--line,rgba(19,50,44,.14));width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 10px rgba(0,0,0,.12)">◐</button>
<script>
(function(){
  var KEY="lib-theme-pref";
  var saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  var btn=document.getElementById("themeToggle");
  if(btn){
    btn.addEventListener("click", function(){
      var cur=document.documentElement.getAttribute("data-theme");
      var isDark = cur==="dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try{ localStorage.setItem(KEY, next); }catch(e){}
    });
  }
})();
</script>
