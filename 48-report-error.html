<style>
  :root{
    --paper:#F6EFDF; --paper-2:#EFE5CF; --ink:#13322C; --ink-soft:#3D5B53;
    --gold:#9C7420; --gold-soft:#C9A24B; --line:rgba(19,50,44,.14);
    --card:#FFFAF0; --green:#2F6B4F; --green-soft:#DCEAE0;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --green:#5FA787; --green-soft:#173A30;
  }}
  :root[data-theme="dark"]{
    --paper:#0C201C; --paper-2:#102A25; --ink:#EFE3C9; --ink-soft:#A9BDB4;
    --gold:#D3AE62; --gold-soft:#8C6F2E; --line:rgba(239,227,201,.16);
    --card:#122E28; --green:#5FA787; --green-soft:#173A30;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:700px;margin:0 auto;padding:0 16px 60px}

  header{position:relative;overflow:hidden;text-align:center;padding:36px 16px 20px;border-bottom:1px solid var(--line)}
  header h1{font-family:"Amiri",serif;font-weight:700;margin:0;font-size:clamp(2rem,7vw,2.8rem);position:relative}
  header p{margin:.4rem auto 0;max-width:60ch;color:var(--ink-soft);font-size:.9rem;position:relative}

  .form-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.83rem;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:"Cairo";font-size:.9rem}
  .field textarea{min-height:120px;resize:vertical}
  .field .hint{font-size:.75rem;color:var(--ink-soft);margin-top:4px}

  .btn{font-family:"Cairo";font-weight:700;font-size:.85rem;padding:12px 24px;border-radius:999px;cursor:pointer;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--green);color:#fff}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

  .success{background:var(--green-soft);border:1px solid var(--green);border-radius:14px;padding:16px;margin-top:16px;text-align:center;color:var(--green)}

  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--ink-soft)}

  @media (max-width:360px){
    .wrap{padding-left:12px;padding-right:12px}
  }
</style>
</head>
<body>
<header>
  <h1>🚨 الإبلاغ عن خطأ</h1>
  <p>بوابة النور — نور الهدى<br>وجدت خطأ؟ أبلغ عنه وسيتم مراجعته في أقرب وقت</p>
</header>

<main class="wrap">
  <div class="form-card">
    <form id="reportForm">
      <div class="field">
        <label for="type">نوع الخطأ *</label>
        <select id="type" required>
          <option value="">— اختر نوع الخطأ —</option>
          <option value="text">خطأ نصي</option>
          <option value="source">مصدر غير صحيح</option>
          <option value="link">رابط لا يعمل</option>
          <option value="tech">مشكلة تقنية</option>
          <option value="content">محتوى يحتاج مراجعة</option>
          <option value="other">آخر</option>
        </select>
      </div>
      <div class="field">
        <label for="page">الصفحة / القسم</label>
        <input id="page" type="text" placeholder="مثال: القرآن الكريم — سورة البقرة">
      </div>
      <div class="field">
        <label for="desc">وصف الخطأ *</label>
        <textarea id="desc" placeholder="اشرح الخطأ بالتفصيل..." required></textarea>
      </div>
      <div class="field">
        <label for="suggest">الاقتراح (اختياري)</label>
        <textarea id="suggest" placeholder="اقتراحك للتعديل..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">📨 إرسال البلاغ</button>
    </form>
    <div id="successMsg" class="success" hidden>
      <p style="margin:0;font-weight:700">✅ تم إرسال البلاغ بنجاح</p>
      <p style="margin:6px 0 0;font-size:.85rem">شكرًا لك على مساعدتك في تحسين الموقع</p>
    </div>
  </div>
</main>

<footer class="wrap">
  <p>المكتبة الإسلامية — بوابة النور | نور الهدى<br>موسوعة رقمية مجانية بلا إعلانات</p>
  <p style="font-size:.8rem;margin-top:4px"><a href="index.html" style="color:var(--gold)">الموسوعة الإسلامية</a> · <a href="index.html" style="color:var(--gold)">الرفيق اليومي</a> · <a href="src/app/app.html" style="color:var(--gold)">بوابة النور</a></p>
</footer>

<script type="module">
document.getElementById("reportForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const report = {
    type: document.getElementById("type").value,
    page: document.getElementById("page").value,
    description: document.getElementById("desc").value,
    suggestion: document.getElementById("suggest").value,
    url: location.href,
    date: new Date().toISOString(),
  };
  try {
    const reports = JSON.parse(localStorage.getItem("error-reports") || "[]");
    reports.push(report);
    localStorage.setItem("error-reports", JSON.stringify(reports));
  } catch {
    // silent
  }
  document.getElementById("reportForm").hidden = true;
  document.getElementById("successMsg").hidden = false;
});
</script>

</body>
